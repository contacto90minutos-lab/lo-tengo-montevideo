<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>LO TENGO - Empresa (MVP)</title>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body style="font-family: monospace; padding: 20px; background: #fffbe6;">
  <h1>Panel Empresa: Restaurante El Fogón</h1>
  <p>ID de Empresa Interno: <strong>IDG-001</strong></p>
  <hr>

  <h3>Pedidos en Cocina para este ID:</h3>
  <div id="listaPedidos">Cargando pedidos...</div>

  <script>
    const socket = io('http://localhost:3000');
    const miIdEmpresa = "IDG-001";

    async function cargarPedidosEmpresa() {
      try {
        const res = await fetch(`http://localhost:3000/api/pedidos/empresa/${miIdEmpresa}`);
        const pedidos = await res.json();
        
        let html = "";
        if (!pedidos || pedidos.length === 0) {
          html = "No hay pedidos en cocina.";
        } else {
          pedidos.forEach(p => {
            html += `<div style="background:#fff; border:1px solid #ccc; padding:10px; margin-bottom:10px;">
              <b>Pedido:</b> ${p.id}<br>
              <b>Cliente Alias:</b> ${p.aliasUsuario || 'Cliente'}<br>
              <b>Productos:</b> ${p.productos ? p.productos.join(', ') : 'N/A'}<br>
              <b>Estado:</b> ${p.estado}
            </div>`;
          });
        }
        document.getElementById('listaPedidos').innerHTML = html;
      } catch (err) {
        console.error("Error al cargar pedidos de empresa", err);
      }
    }

    // Escuchar solo eventos del socket que afecten a esta empresa sin refrescos bruscos
    socket.on('actualizacion_pedido', (pedido) => {
      if (pedido.idEmpresa === miIdEmpresa) {
        cargarPedidosEmpresa();
      }
    });

    // Actualizar periódicamente de forma suave
    setInterval(cargarPedidosEmpresa, 4000);
    cargarPedidosEmpresa();
  </script>
</body>
</html>
