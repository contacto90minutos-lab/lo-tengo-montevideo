<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LO TENGO - Empresas / Comercios</title>
    <!-- Cliente Socket.io para comunicación en tiempo real -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        :root {
            --primary: #002855;
            --secondary: #E85B04;
            --success: #28a745;
            --warning: #ffc107;
            --bg-light: #f8f9fa;
            --border: #e5e7eb;
            --radius: 14px;
            --shadow-subtle: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #eef2f6;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        #toast-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 90%;
            max-width: 400px;
            pointer-events: none;
        }
        .toast-msg {
            background: #111827;
            color: #FFF;
            padding: 14px 18px;
            border-radius: var(--radius);
            font-size: 14px;
            font-weight: 700;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            gap: 12px;
            animation: fadeInOut 3s ease forwards;
            pointer-events: auto;
        }
        .toast-msg.success { background: #059669; }
        .toast-msg.error { background: #DC2626; }
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateY(-10px); }
            15% { opacity: 1; transform: translateY(0); }
            85% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-10px); }
        }

        #splash-screen {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #002855;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .splash-logo-container {
            display: flex; align-items: center; gap: 12px;
            animation: logoScale 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .splash-isologo {
            width: 54px; height: 54px;
            background: linear-gradient(135deg, #E85B04, #ff8533);
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            color: #FFFFFF; font-weight: 900; font-size: 26px; letter-spacing: -1px;
            box-shadow: 0 10px 25px rgba(232, 91, 4, 0.4);
        }

        .splash-texto { color: #FFFFFF; font-size: 28px; font-weight: 900; letter-spacing: -1px; }
        .splash-sub { color: #9CA3AF; font-size: 11px; font-weight: 700; letter-spacing: 2px; margin-top: 14px; text-transform: uppercase; }

        @keyframes logoScale {
            0% { opacity: 0; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }

        #app-container {
            background: #ffffff;
            width: 100%; max-width: 480px; min-height: 100vh;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            box-sizing: border-box;
            display: flex; flex-direction: column; position: relative;
        }

        .header-app {
            background: var(--primary); color: white; padding: 15px 20px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom-left-radius: 20px; border-bottom-right-radius: 20px;
        }

        .header-app h1 {
            margin: 0; font-size: 20px; letter-spacing: 0.5px;
            display: flex; align-items: center; gap: 8px;
        }

        .brand-badge {
            background: var(--secondary); color: #fff;
            width: 28px; height: 28px; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 13px; font-weight: 900;
        }

        .content-body { padding: 15px; flex: 1; overflow-y: auto; padding-bottom: 90px; }

        input, select, textarea {
            width: 100%; padding: 12px; margin: 6px 0 12px 0;
            border: 1px solid var(--border); border-radius: 10px;
            box-sizing: border-box; font-size: 14px; background: #fff;
        }

        button {
            width: 100%; padding: 12px; background-color: var(--primary); color: white;
            border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 14px; transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }

        .link-btn { background: none; color: var(--primary); border: none; text-decoration: underline; cursor: pointer; margin-top: 10px; font-size: 13px; }

        .btn-volver-atras {
            display: inline-flex; align-items: center; gap: 8px;
            background: #FFFFFF; color: var(--primary); border: 1.5px solid var(--border);
            padding: 10px 16px; font-size: 13px; font-weight: 700; border-radius: var(--radius);
            cursor: pointer; width: auto; box-shadow: var(--shadow-subtle); margin-bottom: 16px; transition: all 0.2s;
        }
        .btn-volver-atras:hover { background: #F3F4F6; border-color: var(--secondary); transform: translateY(-1px); }

        .gestion-card {
            background: #fff; border: 1px solid var(--border); border-radius: var(--radius);
            padding: 12px; margin-bottom: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.02);
            display: flex; align-items: center; gap: 12px;
        }

        .gestion-avatar { width: 55px; height: 55px; border-radius: 10px; object-fit: cover; background: #eef2f6; flex-shrink: 0; }
        .badge-outlet { background: var(--secondary); color: white; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; }
        .badge-destacado { background: #7C3AED; color: white; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; }

        .section-title {
            font-size: 16px; font-weight: 800; color: var(--primary); margin: 0 0 12px 0;
            display: flex; justify-content: space-between; align-items: center;
        }

        .bottom-nav {
            position: absolute; bottom: 0; left: 0; width: 100%; background: #ffffff;
            border-top: 1px solid var(--border); display: flex; justify-content: space-around;
            padding: 8px 0; box-sizing: border-box; border-top-left-radius: 20px; border-top-right-radius: 20px;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.03); z-index: 10;
        }

        .nav-item {
            background: none; border: none; color: #666; font-size: 10px; cursor: pointer;
            width: auto; padding: 0; margin: 0; display: flex; flex-direction: column; align-items: center;
        }
        .nav-item span { font-size: 16px; margin-bottom: 2px; }
        .nav-item.active { color: var(--secondary); font-weight: bold; }
    </style>
</head>
<body>

    <div id="toast-container"></div>

    <div id="splash-screen">
        <div class="splash-logo-container">
            <div class="splash-isologo">L+T</div>
            <div class="splash-texto">LO TENGO</div>
        </div>
        <div class="splash-sub">Panel Empresas</div>
    </div>

    <div id="app-container">
        <div class="header-app">
            <h1><div class="brand-badge">L+T</div><span style="color:var(--secondary);">LO</span> TENGO <small style="font-size:11px; opacity:0.8;">[Empresas]</small></h1>
            <span id="header-empresa-info" style="font-size: 11px; opacity: 0.9;">Panel Comercio</span>
        </div>
        
        <div class="content-body" id="main-content-empresa">
            <!-- Login -->
            <div id="screen-login-empresa">
                <h3 style="color: var(--primary); margin-top: 0;">Acceso Comercios</h3>
                <label style="font-size: 12px; color: #555;">RUT de la Empresa:</label>
                <input type="text" id="loginRutEmpresa" placeholder="Ej: 219999990012">

                <label style="font-size: 12px; color: #555;">Contraseña:</label>
                <input type="password" id="loginPassEmpresa" placeholder="Contraseña">

                <div style="display: flex; align-items: center; gap: 8px; margin: 10px 0;">
                    <input type="checkbox" id="recordarUsuarioEmpresa" style="width: auto; margin: 0;">
                    <label for="recordarUsuarioEmpresa" style="font-size: 12px; color: #555; margin: 0; cursor: pointer;">Recordar mi RUT en este dispositivo</label>
                </div>

                <button id="btnIngresarEmpresa" type="button" style="background-color: var(--primary); margin-top: 5px;">Ingresar al Panel</button>
                
                <div style="text-align: center;">
                    <p style="margin-top: 15px; font-size: 13px; color: #666;">¿Tu comercio no está registrado?</p>
                    <button id="irARegistroEmpresa" type="button" class="link-btn">Registrar mi Local</button>
                </div>
            </div>

            <!-- Registro -->
            <div id="screen-registro-empresa" style="display: none;">
                <button type="button" class="btn-volver-atras" onclick="irLoginEmpresa()">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg> Volver al login
                </button>
                <h3 style="color: var(--primary); margin-top: 0;">Registro de Local</h3>
                <label>Nombre del Comercio:</label>
                <input type="text" id="regEmpNombre" placeholder="Ej: Tienda Pepito">
                <label>RUT:</label>
                <input type="text" id="regEmpRut" placeholder="RUT de 12 dígitos">
                
                <label>Giro Comercial (Rubro):</label>
                <select id="regEmpGiro">
                    <option value="Gastronomía">🍔 Gastronomía / Alimentos</option>
                    <option value="Supermercado">🛒 Supermercado / Almacén</option>
                    <option value="Farmacia">💊 Farmacia / Salud</option>
                    <option value="Indumentaria">👕 Indumentaria y Moda</option>
                    <option value="Tecnología">⚡ Tecnología y Electrónica</option>
                </select>

                <label>Logo de la Empresa:</label>
                <input type="file" id="regEmpLogoFile" accept="image/*" onchange="comprimirImagenLocal(event, 'regLogoBase64', 'prevLogoImg')">
                <input type="hidden" id="regLogoBase64">
                <div id="prevLogoContainer" style="display:none; text-align:center; margin-bottom:12px;">
                    <img id="prevLogoImg" style="width:60px; height:60px; border-radius:50%; object-fit:cover; border:2px solid var(--secondary);">
                </div>

                <label>Teléfono de Contacto:</label>
                <input type="tel" id="regEmpTel" placeholder="099123456">
                <label>Dirección del Local:</label>
                <input type="text" id="regEmpDir" placeholder="Av. 18 de Julio 1234">
                <label>Contraseña:</label>
                <input type="password" id="regEmpPass" placeholder="Contraseña de acceso">
                <button type="button" onclick="completarRegistroEmpresa()" style="background: var(--success); margin-top: 6px;">Crear Cuenta Empresa</button>
            </div>
        </div>

        <div class="bottom-nav" id="bottom-nav-empresa" style="display: none;">
            <button class="nav-item active" onclick="mostrarDashboardEmpresa()"><span>📊</span>Dash</button>
            <button class="nav-item" onclick="mostrarGestionCatalogo()"><span>📦</span>Catálogo</button>
            <button class="nav-item" onclick="mostrarPedidosEntrantesComercio()"><span id="icon-tab-pedidos">🛎️</span><span id="label-tab-pedidos">Pedidos</span> <span id="badge-pedidos-count" style="background:var(--secondary); color:white; border-radius:50%; padding:1px 4px; font-size:8px; display:inline-block; vertical-align:top; margin-left:1px;">0</span></button>
            <button class="nav-item" onclick="mostrarPedidosEnRutaComercio()"><span>🛵</span>Envíos</button>
            <button class="nav-item" onclick="mostrarHistorialFinancieroComercio()"><span>💰</span>Historial</button>
            <button class="nav-item" onclick="mostrarPerfilEmpresa()"><span>👤</span>Perfil</button>
            <button class="nav-item" onclick="cerrarSesionEmpresa()"><span>🚪</span>Salir</button>
        </div>
    </div>
    <script>
        const BACKEND_URL = window.location.origin.includes('localhost') ? "http://localhost:3000" : window.location.origin;
        let socket = null;
        let ultimoConteoPedidos = 0;

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = `toast-msg ${type}`;
            toast.innerHTML = `<span>${type === 'success' ? '✅' : '⚠️'}</span> <span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => { toast.remove(); }, 3500);
        }

        function comprimirImagenLocal(event, hiddenInputId, previewImgId) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 400;
                    const MAX_HEIGHT = 400;
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                    } else {
                        if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);
                    document.getElementById(hiddenInputId).value = compressedBase64;
                    let prev = document.getElementById(previewImgId);
                    if (prev) {
                        prev.src = compressedBase64;
                        prev.parentElement.style.display = 'block';
                    }
                    showToast("Imagen optimizada correctamente");
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        document.addEventListener("DOMContentLoaded", () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                if (splash) {
                    splash.style.opacity = '0';
                    splash.style.visibility = 'hidden';
                }
            }, 1200);

            inicializarSocketIO();
            inicializarBaseDatosEmpresasPorDefecto();
            verificarSesionEmpresa();
            configurarEventosLoginEmpresa();
            sincronizarPedidosDesdeServidor();
            
            setInterval(() => {
                sincronizarPedidosDesdeServidor();
            }, 3000);

            window.addEventListener('storage', () => {
                sincronizarEstadosCadeteLocales();
                let emp = obtenerEmpresaActualizada();
                if (emp) {
                    actualizarContadorPedidosBadge(emp.rut);
                    const contenedor = document.getElementById('main-content-empresa');
                    if (contenedor && document.getElementById('bandera-vista-pedidos')) {
                        mostrarPedidosEntrantesComercio();
                    } else if (contenedor && document.getElementById('bandera-vista-envios')) {
                        mostrarPedidosEnRutaComercio();
                    }
                }
            });
        });

        function inicializarSocketIO() {
            socket = io(BACKEND_URL);
            socket.on('connect', () => {
                console.log("⚡ Empresa conectada al WebSocket LO TENGO");
            });

            socket.on('nuevo_pedido_servidor', (pedido) => {
                let sesion = JSON.parse(localStorage.getItem('lt_sesion_empresa'));
                let esExpressO3Cruces = pedido.tipoPedido === 'express' || pedido.tipoPedido === 'tres_cruces' || pedido.esTresCruces;
                if (sesion && pedido.rutComercio && String(pedido.rutComercio).trim() === String(sesion.rut).trim() && !esExpressO3Cruces) {
                    reproducirChicharraAlerta();
                    showToast("🛎️ ¡Nuevo pedido recibido!");
                    sincronizarPedidosDesdeServidor();
                }
            });

            socket.on('actualizacion_pedido', () => {
                sincronizarPedidosDesdeServidor();
            });

            socket.on('pedido_entregado_exito', () => {
                sincronizarEstadosCadeteLocales();
                sincronizarPedidosDesdeServidor();
            });
        }

        // SINCRONIZA EL ESTADO DE Cierre/Entrega DESDE EL MODULO DE CADETES
        function sincronizarEstadosCadeteLocales() {
            let sesion = JSON.parse(localStorage.getItem('lt_sesion_empresa'));
            if (!sesion) return;

            let base = JSON.parse(localStorage.getItem('lt_base_empresas')) || [];
            let emp = base.find(e => String(e.rut).trim() === String(sesion.rut).trim());
            if (!emp || !emp.pedidos) return;

            let pedidosCadete = JSON.parse(localStorage.getItem('lt_pedidos_cadete')) || [];
            let cambiosRealizados = false;

            emp.pedidos.forEach(p => {
                let matchCadete = pedidosCadete.find(pc => Number(pc.id) === Number(p.id));
                if (matchCadete && matchCadete.estado) {
                    let stC = matchCadete.estado.toLowerCase();
                    if (stC.includes('entregado') || stC.includes('cerrado')) {
                        if (p.estado !== 'Entregado y Cerrado') {
                            p.estado = 'Entregado y Cerrado';
                            cambiosRealizados = true;
                        }
                    }
                }
            });

            // Eliminar estrictamente cualquier pedido cruzado de Express o Tres Cruces que se haya colado
            let filtrados = emp.pedidos.filter(p => {
                let esExpressO3Cruces = p.tipoPedido === 'express' || p.tipoPedido === 'tres_cruces' || p.esTresCruces;
                let rutMatch = !p.rutComercio || String(p.rutComercio).trim() === String(emp.rut).trim();
                return !esExpressO3Cruces && rutMatch;
            });

            if (filtrados.length !== emp.pedidos.length) {
                emp.pedidos = filtrados;
                cambiosRealizados = true;
            }

            if (cambiosRealizados) {
                localStorage.setItem('lt_base_empresas', JSON.stringify(base));
                localStorage.setItem('lt_sesion_empresa', JSON.stringify(emp));
            }
        }

        async function sincronizarPedidosDesdeServidor() {
            try {
                sincronizarEstadosCadeteLocales();
                let response = await fetch(`${BACKEND_URL}/api/pedidos`);
                if (response.ok) {
                    let pedidosRemotos = await response.json();
                    if (pedidosRemotos && Array.isArray(pedidosRemotos)) {
                        let base = JSON.parse(localStorage.getItem('lt_base_empresas')) || [];
                        let sesion = JSON.parse(localStorage.getItem('lt_sesion_empresa'));
                        if (base.length > 0 && sesion) {
                            let emp = base.find(e => String(e.rut).trim() === String(sesion.rut).trim());
                            if (emp) {
                                let pedidosCadete = JSON.parse(localStorage.getItem('lt_pedidos_cadete')) || [];
                                let mapaLocal = new Map();
                                (emp.pedidos || []).forEach(p => mapaLocal.set(String(p.id).trim(), p));
                                
                                let nuevosEntrantes = 0;
                                pedidosRemotos.forEach(pR => {
                                    let esDeEstaEmpresa = pR.rutComercio && String(pR.rutComercio).trim() === String(emp.rut).trim();
                                    let esExpressO3Cruces = pR.tipoPedido === 'express' || pR.tipoPedido === 'tres_cruces' || pR.esTresCruces;
                                    
                                    if (esDeEstaEmpresa && !esExpressO3Cruces) {
                                        // Verificar si el cadete ya lo cerró
                                        let matchC = pedidosCadete.find(pc => Number(pc.id) === Number(pR.id));
                                        if (matchC && matchC.estado && matchC.estado.toLowerCase().includes('entregado')) {
                                            pR.estado = 'Entregado y Cerrado';
                                        }

                                        if (!mapaLocal.has(String(pR.id).trim())) nuevosEntrantes++;
                                        mapaLocal.set(String(pR.id).trim(), pR);
                                    }
                                });

                                emp.pedidos = Array.from(mapaLocal.values()).filter(p => {
                                    let esExpressO3Cruces = p.tipoPedido === 'express' || p.tipoPedido === 'tres_cruces' || p.esTresCruces;
                                    let rutMatch = !p.rutComercio || String(p.rutComercio).trim() === String(emp.rut).trim();
                                    return !esExpressO3Cruces && rutMatch;
                                });

                                localStorage.setItem('lt_base_empresas', JSON.stringify(base));
                                localStorage.setItem('lt_sesion_empresa', JSON.stringify(emp));

                                let pendientesActuales = emp.pedidos.filter(p => {
                                    let st = (p.estado || '').toLowerCase().trim();
                                    return st !== 'listo para retirar (en ruta/cadete)' && !st.includes('entregado') && !st.includes('cerrado');
                                }).length;

                                if (pendientesActuales > ultimoConteoPedidos && nuevosEntrantes > 0) {
                                    reproducirChicharraAlerta();
                                }
                                ultimoConteoPedidos = pendientesActuales;
                                actualizarContadorPedidosBadge(emp.rut);
                            }
                        }
                    }
                }
            } catch (e) {}
        }

        function reproducirChicharraAlerta() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.8);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.8);
            } catch(e) {}
        }

        function inicializarBaseDatosEmpresasPorDefecto() {
            let base = JSON.parse(localStorage.getItem('lt_base_empresas')) || [];
            if (base.length === 0) {
                const empresasDemo = [
                    {
                        rut: '219999990012',
                        nombre: 'Lo Tengo Chivitería Central',
                        giro: 'Gastronomía',
                        logo: 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=400&q=80',
                        telefono: '099000000',
                        direccion: 'Av. 18 de Julio 1300',
                        password: '123',
                        productos: [
                            { id: 101, nombre: "Chivito al Plato Clásico", precio: 480, imagen: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=400&q=80", outlet: false, destacado: true },
                            { id: 102, nombre: "Empanadas de Carne (Docena)", precio: 520, imagen: "https://images.unsplash.com/photo-1608897013039-887f21d8c804?auto=format&fit=crop&w=400&q=80", outlet: true, destacado: false }
                        ],
                        pedidos: []
                    }
                ];
                localStorage.setItem('lt_base_empresas', JSON.stringify(empresasDemo));
            }
        }

        function verificarSesionEmpresa() {
            const sesion = localStorage.getItem('lt_sesion_empresa');
            if (sesion) {
                try {
                    const empresa = JSON.parse(sesion);
                    let empresaReal = obtenerEmpresaActualizadaPorRut(empresa.rut);
                    if (empresaReal) {
                        document.getElementById('header-empresa-info').innerText = empresaReal.nombre;
                        document.getElementById('bottom-nav-empresa').style.display = 'flex';
                        actualizarTextosNavSegunGiro(empresaReal.giro);
                        actualizarContadorPedidosBadge(empresaReal.rut);
                        mostrarDashboardEmpresa();
                    }
                } catch (e) {}
            }
        }

        function actualizarTextosNavSegunGiro(giro) {
            let labelPedidos = document.getElementById('label-tab-pedidos');
            let iconPedidos = document.getElementById('icon-tab-pedidos');
            if (labelPedidos && iconPedidos) {

            const btnReg = document.getElementById('irARegistroEmpresa');
            if (btnReg) {
                btnReg.onclick = () => {
                    document.getElementById('screen-login-empresa').style.display = 'none';
                    document.getElementById('screen-registro-empresa').style.display = 'block';
                };
            }

            const rutGuardado = localStorage.getItem('lt_recordar_rut_empresa');
            if (rutGuardado) {
                const inputRut = document.getElementById('loginRutEmpresa');
                const checkRecordar = document.getElementById('recordarUsuarioEmpresa');
                if (inputRut) inputRut.value = rutGuardado;
                if (checkRecordar) checkRecordar.checked = true;
            }

            const btnIng = document.getElementById('btnIngresarEmpresa');
            if (btnIng) btnIng.onclick = ejecutarLoginEmpresa;
        }

        async function ejecutarLoginEmpresa() {
            const rutInput = document.getElementById('loginRutEmpresa').value.trim();
            const passInput = document.getElementById('loginPassEmpresa').value.trim();
            const recordar = document.getElementById('recordarUsuarioEmpresa').checked;

            if (!rutInput || !passInput) {
                showToast("Ingresá RUT y contraseña", "error");
                return;
            }

            let base = JSON.parse(localStorage.getItem('lt_base_empresas')) || [];
            let emp = base.find(e => String(e.rut).trim() === rutInput && String(e.password || '123').trim() === passInput);

            if (!emp) {
                showToast("RUT o contraseña incorrectos", "error");
                return;
            }

            if (recordar) localStorage.setItem('lt_recordar_rut_empresa', rutInput);
            else localStorage.removeItem('lt_recordar_rut_empresa');

            localStorage.setItem('lt_sesion_empresa', JSON.stringify(emp));
            showToast("Sesión iniciada");
            setTimeout(() => location.reload(), 800);
        }

        async function completarRegistroEmpresa() {
            let nombre = document.getElementById('regEmpNombre').value.trim();
            let rut = document.getElementById('regEmpRut').value.trim();
            let giro = document.getElementById('regEmpGiro').value;
            let telefono = document.getElementById('regEmpTel').value.trim();
            let direccion = document.getElementById('regEmpDir').value.trim();
            let password = document.getElementById('regEmpPass').value.trim();
            let logo = document.getElementById('regLogoBase64').value || 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=400&q=80';

            if (!nombre || !rut || !password) { showToast("Completá los campos obligatorios", "error"); return; }

            let base = JSON.parse(localStorage.getItem('lt_base_empresas')) || [];
            if (base.some(e => String(e.rut).trim() === rut)) { showToast("Ya existe un local con este RUT", "error"); return; }

            let nuevaEmpresa = { rut, nombre, giro, logo, telefono, direccion, password, productos: [], pedidos: [] };
            base.push(nuevaEmpresa);
            localStorage.setItem('lt_base_empresas', JSON.stringify(base));

            localStorage.setItem('lt_sesion_empresa', JSON.stringify(nuevaEmpresa));
            showToast("Comercio registrado con éxito");
            setTimeout(() => location.reload(), 800);
        }

        function obtenerEmpresaActualizada() {
            sincronizarEstadosCadeteLocales();
            let sesion = JSON.parse(localStorage.getItem('lt_sesion_empresa'));
            if (!sesion) return null;
            return obtenerEmpresaActualizadaPorRut(sesion.rut);
        }

        function obtenerEmpresaActualizadaPorRut(rut) {
            let base = JSON.parse(localStorage.getItem('lt_base_empresas')) || [];
            let emp = base.find(e => String(e.rut).trim() === String(rut).trim());
            if (emp) {
                // Filtrar por seguridad cualquier pedido cruzado
                emp.pedidos = (emp.pedidos || []).filter(p => {
                    let esExpressO3Cruces = p.tipoPedido === 'express' || p.tipoPedido === 'tres_cruces' || p.esTresCruces;
                    let rutMatch = !p.rutComercio || String(p.rutComercio).trim() === String(emp.rut).trim();
                    return !esExpressO3Cruces && rutMatch;
                });
                localStorage.setItem('lt_sesion_empresa', JSON.stringify(emp));
            }
            return emp;
        }

            let emp = obtenerEmpresaActualizadaPorRut(rut);
            if (emp && emp.pedidos) {
                let pendientes = emp.pedidos.filter(p => {
                    let st = (p.estado || '').toLowerCase().trim();
                    let esExpressO3Cruces = p.tipoPedido === 'express' || p.tipoPedido === 'tres_cruces' || p.esTresCruces;
                    return !esExpressO3Cruces && 
                           st !== 'listo para retirar (en ruta/cadete)' && 
                           !st.includes('entregado') && 
                           !st.includes('cerrado');
                });
                let badge = document.getElementById('badge-pedidos-count');
                if (badge) badge.innerText = pendientes.length;
            }
        }

        async function guardarNuevoProducto() {
            let nombre = document.getElementById('nuevoProdNombre').value.trim();
            let precio = parseFloat(document.getElementById('nuevoProdPrecio').value);
            let imagen = document.getElementById('nuevoProdImgBase64').value || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=400&q=80';
            let outlet = document.getElementById('nuevoProdOutlet').checked;

            if (!nombre || !precio) { showToast("Completá nombre y precio", "error"); return; }

            let base = JSON.parse(localStorage.getItem('lt_base_empresas')) || [];
            let sesion = JSON.parse(localStorage.getItem('lt_sesion_empresa'));
            let emp = base.find(e => String(e.rut).trim() === String(sesion.rut).trim());

            if (!emp.productos) emp.productos = [];
            let nuevoP = { id: Date.now(), nombre, precio, outlet, destacado: false, imagen };

            emp.productos.push(nuevoP);
            localStorage.setItem('lt_base_empresas', JSON.stringify(base));
            localStorage.setItem('lt_sesion_empresa', JSON.stringify(emp));

            try {
                await fetch(`${BACKEND_URL}/api/empresas/${emp.rut}/catalogo`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ productos: emp.productos })
                });
            } catch(e) {}

            showToast("Producto agregado con éxito");
            mostrarGestionCatalogo();
        }

        async function eliminarProductoComercio(idProd) {
            if (!confirm("¿Estás seguro de eliminar este producto?")) return;
            let base = JSON.parse(localStorage.getItem('lt_base_empresas')) || [];
            let sesion = JSON.parse(localStorage.getItem('lt_sesion_empresa'));
            let emp = base.find(e => String(e.rut).trim() === String(sesion.rut).trim());

            emp.productos = emp.productos.filter(p => p.id !== idProd);
            localStorage.setItem('lt_base_empresas', JSON.stringify(base));
            localStorage.setItem('lt_sesion_empresa', JSON.stringify(emp));

            try {
                await fetch(`${BACKEND_URL}/api/empresas/${emp.rut}/catalogo`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ productos: emp.productos })
                });
            } catch(e) {}

            showToast("Producto eliminado");
            mostrarGestionCatalogo();
        }

                <div style="display:flex; gap:8px; margin-bottom:15px;">
                    <button type="button" onclick="mostrarPedidosEntrantesComercio()" style="flex:1; padding:10px; font-size:12px; background:#E5E7EB; color:var(--text-main);">${emp.giro === 'Gastronomía' ? '🍳 Cocina' : '🛎️ Pedidos'}</button>
                    <button type="button" onclick="mostrarPedidosEnRutaComercio()" style="flex:1; padding:10px; font-size:12px; background:#E5E7EB; color:var(--text-main);">🛵 Esperando Cadete</button>
                    <button type="button" style="flex:1; padding:10px; font-size:12px; background:var(--primary);">✅ Finalizados</button>
                </div>

                <div class="section-title"><span>✅ Pedidos Finalizados y Entregados</span></div>
                ${htmlHistorial}
            `;
        }

        function mostrarPerfilEmpresa() {
            actualizarMenuActivoEmpresa(5);
            let emp = obtenerEmpresaActualizada();
            if (!emp) return;

            const container = document.getElementById('main-content-empresa');
            container.innerHTML = `
                <button type="button" class="btn-volver-atras" onclick="mostrarDashboardEmpresa()">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg> Volver al Dashboard
                </button>
                <div class="section-title"><span>👤 Perfil del Comercio</span></div>
                <div style="background:#fff; border:1px solid var(--border); border-radius:var(--radius); padding:20px; text-align:center; margin-bottom:15px; box-shadow:var(--shadow-subtle);">
                    ${emp.logo ? `<img src="${emp.logo}" style="width:90px; height:90px; border-radius:50%; object-fit:cover; border:3px solid var(--secondary); margin-bottom:12px;" alt="Logo Empresa">` : '<div style="font-size:40px; margin-bottom:10px;">🏪</div>'}
                    <h3 style="margin:0 0 5px 0; color:var(--primary);">${emp.nombre}</h3>
                    <p style="margin:0 0 4px 0; font-size:13px; color:#666;">RUT: <b>${emp.rut}</b></p>
                    <p style="margin:0 0 4px 0; font-size:13px; color:#666;">Giro: <b>${emp.giro || 'Comercio'}</b></p>
                    <p style="margin:0 0 4px 0; font-size:13px; color:#666;">📞 Tel: <b>${emp.telefono || 'Sin tel'}</b></p>
                    <p style="margin:0; font-size:13px; color:#666;">📍 Dirección: <b>${emp.direccion || 'Montevideo'}</b></p>
                </div>

                <button type="button" onclick="cerrarSesionEmpresa()" style="background:var(--danger); font-weight:bold;">🚪 Cerrar Sesión</button>
            `;
        }

        window.cambiarEstadoPedido = function(idPedido, nuevoEstado) {
            let base = JSON.parse(localStorage.getItem('lt_base_empresas')) || [];
            let sesion = JSON.parse(localStorage.getItem('lt_sesion_empresa'));
            let emp = base.find(e => String(e.rut).trim() === String(sesion.rut).trim());
            let pedido = emp.pedidos.find(p => Number(p.id) === Number(idPedido));

            if (pedido) {
                pedido.estado = nuevoEstado;
                localStorage.setItem('lt_base_empresas', JSON.stringify(base));
                localStorage.setItem('lt_sesion_empresa', JSON.stringify(emp));

                fetch(`${BACKEND_URL}/api/pedidos`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(pedido)
                }).catch(e => {});

                if (socket && socket.connected) {
                    socket.emit('cambiar_estado_pedido', { pedidoId: idPedido, estado: nuevoEstado });
                }

                if (nuevoEstado === 'Listo para Retirar (En Ruta/Cadete)') {
                    let pedidosCadete = JSON.parse(localStorage.getItem('lt_pedidos_cadete')) || [];
                    if (!pedidosCadete.some(p => Number(p.id) === Number(idPedido))) {
                        pedidosCadete.push({
                            id: pedido.id,
                            comercio: emp.nombre,
                            rutComercio: emp.rut,
                            direccionComercio: emp.direccion,
                            telefonoComercio: emp.telefono,
                            cliente: pedido.cliente,
                            direccionCliente: pedido.direccion,
                            telefonoCliente: pedido.telefonoCliente || 'Sin tel',
                            total: pedido.total,
                            codigoVerificacion: pedido.codigoVerificacion,
                            estado: 'Disponible para retirar'
                        });
                        localStorage.setItem('lt_pedidos_cadete', JSON.stringify(pedidosCadete));
                    }
                }

                window.dispatchEvent(new Event('storage'));
                showToast("Estado actualizado");

                if (nuevoEstado === 'Listo para Retirar (En Ruta/Cadete)') {
                    mostrarPedidosEnRutaComercio();
                } else {
                    mostrarPedidosEntrantesComercio();
                }
            }
        };

        function actualizarMenuActivoEmpresa(index) {
            document.querySelectorAll('.bottom-nav .nav-item').forEach((btn, idx) => {
                btn.classList.toggle('active', idx === index);
            });
        }
    </script>
</body>
</html>
