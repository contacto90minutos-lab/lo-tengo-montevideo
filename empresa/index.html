<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LO TENGO - Empresas / Comercios</title>
    <style>
        :root {
            --primary: #002855;
            --secondary: #E85B04;
            --success: #28a745;
            --warning: #ffc107;
            --bg-light: #f8f9fa;
            --border: #e5e7eb;
            --radius: 14px;
            --shadow-subtle: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #eef2f6;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Splash Screen Animado Minimalista */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #002855;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .splash-logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
            animation: logoScale 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .splash-isologo {
            width: 54px;
            height: 54px;
            background: linear-gradient(135deg, #E85B04, #ff8533);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #FFFFFF;
            font-weight: 900;
            font-size: 26px;
            letter-spacing: -1px;
            box-shadow: 0 10px 25px rgba(232, 91, 4, 0.4);
        }

        .splash-texto {
            color: #FFFFFF;
            font-size: 28px;
            font-weight: 900;
            letter-spacing: -1px;
        }

        .splash-sub {
            color: #9CA3AF;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-top: 14px;
            text-transform: uppercase;
        }

        @keyframes logoScale {
            0% { opacity: 0; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }

        #app-container {
            background: #ffffff;
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .header-app {
            background: var(--primary);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
        }

        .header-app h1 {
            margin: 0;
            font-size: 20px;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-badge {
            background: var(--secondary);
            color: #fff;
            width: 28px;
            height: 28px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 900;
        }

        .content-body {
            padding: 15px;
            flex: 1;
            overflow-y: auto;
            padding-bottom: 90px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            margin: 6px 0 12px 0;
            border: 1px solid var(--border);
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 14px;
            background: #fff;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            transition: opacity 0.2s;
        }

        button:hover { opacity: 0.9; }

        .link-btn {
            background: none;
            color: var(--primary);
            border: none;
            text-decoration: underline;
            cursor: pointer;
            margin-top: 10px;
            font-size: 13px;
        }

        .btn-volver-atras {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #FFFFFF;
            color: var(--primary);
            border: 1.5px solid var(--border);
            padding: 10px 16px;
            font-size: 13px;
            font-weight: 700;
            border-radius: var(--radius);
            cursor: pointer;
            width: auto;
            box-shadow: var(--shadow-subtle);
            margin-bottom: 16px;
            transition: all 0.2s;
        }
        .btn-volver-atras:hover { background: #F3F4F6; border-color: var(--secondary); transform: translateY(-1px); }

        .gestion-card {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 12px;
            margin-bottom: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .gestion-avatar {
            width: 55px;
            height: 55px;
            border-radius: 10px;
            object-fit: cover;
            background: #eef2f6;
            flex-shrink: 0;
        }

        .badge-outlet {
            background: var(--secondary);
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
        }

        .badge-destacado {
            background: #7C3AED;
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
        }

        .section-title {
            font-size: 16px;
            font-weight: 800;
            color: var(--primary);
            margin: 0 0 12px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #ffffff;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            box-sizing: border-box;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.03);
            z-index: 10;
        }

        .nav-item {
            background: none;
            border: none;
            color: #666;
            font-size: 10px;
            cursor: pointer;
            width: auto;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .nav-item span { font-size: 16px; margin-bottom: 2px; }
        .nav-item.active { color: var(--secondary); font-weight: bold; }
    </style>
</head>
<body>

    <!-- Splash Screen Animado Minimalista -->
    <div id="splash-screen">
        <div class="splash-logo-container">
            <div class="splash-isologo">L+T</div>
            <div class="splash-texto">LO TENGO</div>
        </div>
        <div class="splash-sub">Panel Empresas</div>
    </div>

    <div id="app-container">
        <!-- Header -->
        <div class="header-app">
            <h1><div class="brand-badge">L+T</div><span style="color:var(--secondary);">LO</span> TENGO <small style="font-size:11px; opacity:0.8;">[Empresas]</small></h1>
            <span id="header-empresa-info" style="font-size: 11px; opacity: 0.9;">Panel Comercio</span>
        </div>
        
        <!-- Contenedor Principal -->
        <div class="content-body" id="main-content-empresa">
            <!-- Login de Empresas -->
            <div id="screen-login-empresa">
                <h3 style="color: var(--primary); margin-top: 0;">Acceso Comercios</h3>
                <label style="font-size: 12px; color: #555;">RUT de la Empresa:</label>
                <input type="text" id="loginRutEmpresa" placeholder="Ej: 219999990012">

                <label style="font-size: 12px; color: #555;">Contraseña:</label>
                <input type="password" id="loginPassEmpresa" placeholder="Contraseña">

                <!-- Checkbox Recordar Usuario -->
                <div style="display: flex; align-items: center; gap: 8px; margin: 10px 0;">
                    <input type="checkbox" id="recordarUsuarioEmpresa" style="width: auto; margin: 0;">
                    <label for="recordarUsuarioEmpresa" style="font-size: 12px; color: #555; margin: 0; cursor: pointer;">Recordar mi RUT en este dispositivo</label>
                </div>

                <button id="btnIngresarEmpresa" type="button" style="background-color: var(--primary); margin-top: 5px;">Ingresar al Panel</button>
                
                <div style="text-align: center;">
                    <p style="margin-top: 15px; font-size: 13px; color: #666;">¿Tu comercio no está registrado?</p>
                    <button id="irARegistroEmpresa" type="button" class="link-btn">Registrar mi Local</button>
                </div>
            </div>

            <!-- Registro de Empresas con Selector de Giro y Carga de Logo -->
            <div id="screen-registro-empresa" style="display: none;">
                <button type="button" class="btn-volver-atras" onclick="irLoginEmpresa()">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg> Volver al login
                </button>
                <h3 style="color: var(--primary); margin-top: 0;">Registro de Local</h3>
                <label>Nombre del Comercio:</label>
                <input type="text" id="regEmpNombre" placeholder="Ej: Tienda Pepito">
                <label>RUT:</label>
                <input type="text" id="regEmpRut" placeholder="RUT de 12 dígitos">
                
                <label>Giro Comercial (Rubro):</label>
                <select id="regEmpGiro">
                    <option value="Gastronomía">🍔 Gastronomía / Alimentos</option>
                    <option value="Supermercado">🛒 Supermercado / Almacén</option>
                    <option value="Farmacia">💊 Farmacia / Salud</option>
                    <option value="Indumentaria">👕 Indumentaria y Moda</option>
                    <option value="Tecnología">⚡ Tecnología y Electrónica</option>
                </select>

                <label>Logo de la Empresa (Cámara o Archivo):</label>
                <input type="file" id="regEmpLogoFile" accept="image/*" capture="environment">

                <label>Teléfono de Contacto:</label>
                <input type="tel" id="regEmpTel" placeholder="099123456">
                <label>Dirección del Local:</label>
                <input type="text" id="regEmpDir" placeholder="Av. 18 de Julio 1234">
                <label>Contraseña:</label>
                <input type="password" id="regEmpPass" placeholder="Contraseña de acceso">
                <button type="button" onclick="completarRegistroEmpresa()" style="background: var(--success); margin-top: 6px;">Crear Cuenta Empresa</button>
            </div>
        </div>

        <!-- Barra de Navegación Inferior del Panel Empresa -->
        <div class="bottom-nav" id="bottom-nav-empresa" style="display: none;">
            <button class="nav-item active" onclick="mostrarDashboardEmpresa()"><span>📊</span>Dash</button>
            <button class="nav-item" onclick="mostrarGestionCatalogo()"><span>📦</span>Catálogo</button>
            <button class="nav-item" onclick="mostrarPedidosEntrantesComercio()"><span>🛎️</span>Cocina <span id="badge-pedidos-count" style="background:var(--secondary); color:white; border-radius:50%; padding:1px 4px; font-size:8px; display:inline-block; vertical-align:top; margin-left:1px;">0</span></button>
            <button class="nav-item" onclick="mostrarPedidosEnRutaComercio()"><span>🛵</span>Envíos</button>
            <button class="nav-item" onclick="mostrarHistorialFinancieroComercio()"><span>💰</span>Historial</button>
            <button class="nav-item" onclick="cerrarSesionEmpresa()"><span>🚪</span>Salir</button>
        </div>
    </div>

    <!-- Script Sincronizado con Render y Alerta Sonora -->
    <script>
        const BACKEND_URL = "https://lo-tengo-montevideo.onrender.com";

        let temporizadoresGlobales = {};
        let ultimoConteoPedidos = 0;

        document.addEventListener("DOMContentLoaded", async () => {
            // Ocultar Splash Screen después de 1.5 segundos
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                if (splash) {
                    splash.style.opacity = '0';
                    splash.style.visibility = 'hidden';
                }
            }, 1500);

            inicializarBaseDatosEmpresasPorDefecto();
            await sincronizarPedidosDesdeServidor();
            verificarSesionEmpresa();
            configurarEventosLoginEmpresa();
            
            setInterval(async () => {
                await sincronizarPedidosDesdeServidor();
                let sesion = localStorage.getItem('lt_sesion_empresa');
                if (sesion) {
                    let empActual = obtenerEmpresaActualizada();
                    if (empActual) {
                        actualizarContadorPedidosBadge(empActual.rut);
                    }
                }
            }, 2000);

            window.addEventListener('storage', () => {
                let emp = obtenerEmpresaActualizada();
                if (emp) {
                    actualizarContadorPedidosBadge(emp.rut);
                    const contenedor = document.getElementById('main-content-empresa');
                    if (contenedor && document.getElementById('bandera-vista-pedidos')) {
                        mostrarPedidosEntrantesComercio();
                    } else if (contenedor && document.getElementById('bandera-vista-envios')) {
                        mostrarPedidosEnRutaComercio();
                    } else if (contenedor && document.getElementById('main-content-empresa') && !document.getElementById('screen-login-empresa')) {
                        mostrarDashboardEmpresa();
                    }
                }
            });
        });

        async function sincronizarPedidosDesdeServidor() {
            try {
                let response = await fetch(`${BACKEND_URL}/api/pedidos`);
                if (response.ok) {
                    let pedidosRemotos = await response.json();
                    if (pedidosRemotos && Array.isArray(pedidosRemotos)) {
                        let base = JSON.parse(localStorage.getItem('lt_base_empresas')) || [];
                        let sesion = JSON.parse(localStorage.getItem('lt_sesion_empresa'));
                        if (base.length > 0 && sesion) {
                            let emp = base.find(e => String(e.rut).trim() === String(sesion.rut).trim());
                            if (emp) {
                                let mapaLocal = new Map();
                                (emp.pedidos || []).forEach(p => mapaLocal.set(String(p.id).trim(), p));
                                
                                let nuevosEntrantes = 0;
                                pedidosRemotos.forEach(pR => {
                                    // Filtrar solo los pedidos correspondientes a este RUT de comercio
                                    if (String(pR.rutComercio || '').trim() === String(emp.rut).trim()) {
                                        if (!mapaLocal.has(String(pR.id).trim())) {
                                            nuevosEntrantes++;
                                        }
                                        mapaLocal.set(String(pR.id).trim(), pR);
                                    }
                                });

                                emp.pedidos = Array.from(mapaLocal.values());
                                localStorage.setItem('lt_base_empresas', JSON.stringify(base));
                                localStorage.setItem('lt_sesion_empresa', JSON.stringify(emp));

                                let pendientesActuales = emp.pedidos.filter(p => {
                                    let st = (p.estado || '').toLowerCase().trim();
                                    return st !== 'listo para retirar (en ruta/cadete)' && !st.includes('entregado') && !st.includes('cerrado');
                                }).length;

                                if (pendientesActuales > ultimoConteoPedidos && nuevosEntrantes > 0) {
                                    reproducirAlertaNuevaComanda();
                                }
                                ultimoConteoPedidos = pendientesActuales;
                                actualizarContadorPedidosBadge(emp.rut);
                            }
                        }
                    }
                }
            } catch (e) {
                // Modo offline respaldado por localStorage
            }
        }

        function reproducirAlertaNuevaComanda() {
            try {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    let utterance = new SpeechSynthesisUtterance("¡Nuevo pedido recibido en cocina!");
                    utterance.lang = 'es-UY';
                    utterance.rate = 1.0;
                    window.speechSynthesis.speak(utterance);
                }
            } catch (err) {
                console.error("Error voz:", err);
            }
        }

        function inicializarBaseDatosEmpresasPorDefecto() {
            let base = JSON.parse(localStorage.getItem('lt_base_empresas')) || [];
            if (base.length === 0) {
                const empresasDemo = [
                    {
                        rut: '219999990012',
                        nombre: 'Lo Tengo Chivitería Central',
                        giro: 'Gastronomía',
                        logo: 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=400&q=80',
                        telefono: '099000000',
                        direccion: 'Av. 18 de Julio 1300',
                        password: '123',
                        productos: [
                            { id: 101, nombre: "Chivito al Plato Clásico", precio: 480, imagen: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=400&q=80", outlet: false, destacado: true },
                            { id: 102, nombre: "Empanadas de Carne (Docena)", precio: 520, imagen: "https://images.unsplash.com/photo-1608897013039-887f21d8c804?auto=format&fit=crop&w=400&q=80", outlet: true, destacado: false }
                        ],
                        pedidos: []
                    },
                    {
                        rut: '218888880014',
                        nombre: 'Supermercado El Dorado Express',
                        giro: 'Supermercado',
                        logo: 'https://images.unsplash.com/photo-1578916171728-46686eac8d58?auto=format&fit=crop&w=400&q=80',
                        telefono: '099111111',
                        direccion: 'Bv. General Artigas 1800',
                        password: '123',
                        productos: [
                            { id: 201, nombre: "Canasta Básica de Alimentos", precio: 890, imagen: "https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=400&q=80", outlet: false, destacado: true },
                            { id: 202, nombre: "Pack Leche Descremada x6", precio: 290, imagen: "https://images.unsplash.com/photo-1550583724-b2692b85b150?auto=format&fit=crop&w=400&q=80", outlet: true, destacado: false }
                        ],
                        pedidos: []
                    },
                    {
                        rut: '217777770016',
                        nombre: 'Farmacia San Roque 24hs',
                        giro: 'Farmacia',
                        logo: 'https://images.unsplash.com/photo-1584308666744-24d5c474f2ae?auto=format&fit=crop&w=400&q=80',
                        telefono: '099222222',
                        direccion: 'Av. 21 de Setiembre 2400',
                        password: '123',
                        productos: [
                            { id: 301, nombre: "Protector Solar SPF 50+", precio: 750, imagen: "https://images.unsplash.com/photo-1598440947619-2c35fc9aa908?auto=format&fit=crop&w=400&q=80", outlet: false, destacado: true },
                            { id: 302, nombre: "Kit Primeros Auxilios Completo", precio: 450, imagen: "https://images.unsplash.com/photo-1603398938378-e54eab446dde?auto=format&fit=crop&w=400&q=80", outlet: true, destacado: false }
                        ],
                        pedidos: []
                    }
                ];
                localStorage.setItem('lt_base_empresas', JSON.stringify(empresasDemo));
            }
        }

        function verificarSesionEmpresa() {
            const sesion = localStorage.getItem('lt_sesion_empresa');
            if (sesion) {
                try {
                    const empresa = JSON.parse(sesion);
                    let empresaReal = obtenerEmpresaActualizadaPorRut(empresa.rut);
                    if (empresaReal) {
                        document.getElementById('header-empresa-info').innerText = empresaReal.nombre;
                        document.getElementById('bottom-nav-empresa').style.display = 'flex';
                        actualizarContadorPedidosBadge(empresaReal.rut);
                        mostrarDashboardEmpresa();
                    }
                } catch (e) { console.error(e); }
            }
        }

        function configurarEventosLoginEmpresa() {
            const btnReg = document.getElementById('irARegistroEmpresa');
            if (btnReg) {
                btnReg.onclick = () => {
                    document.getElementById('screen-login-empresa').style.display = 'none';
                    document.getElementById('screen-registro-empresa').style.display = 'block';
                };
            }

            const rutGuardado = localStorage.getItem('lt_recordar_rut_empresa');
            if (rutGuardado) {
                const inputRut = document.getElementById('loginRutEmpresa');
                const checkRecordar = document.getElementById('recordarUsuarioEmpresa');
                if (inputRut) inputRut.value = rutGuardado;
                if (checkRecordar) checkRecordar.checked = true;
            }

            const btnIng = document.getElementById('btnIngresarEmpresa');
            if (btnIng) {
                btnIng.onclick = ejecutarLoginEmpresa;
            }
        }

        async function ejecutarLoginEmpresa() {
            const rutInput = document.getElementById('loginRutEmpresa').value.trim();
            const passInput = document.getElementById('loginPassEmpresa').value.trim();
            const recordar = document.getElementById('recordarUsuarioEmpresa').checked;

            if (!rutInput || !passInput) {
                alert("⚠️ Ingresá tu RUT y contraseña.");
                return;
            }

            let base = JSON.parse(localStorage.getItem('lt_base_empresas')) || [];
            let emp = base.find(e => String(e.rut).trim() === rutInput && String(e.password || '123').trim() === passInput);

            if (!emp) {
                if (rutInput === '219999990012' && passInput === '123') {
                    inicializarBaseDatosEmpresasPorDefecto();
                    base = JSON.parse(localStorage.getItem('lt_base_empresas')) || [];
                    emp = base.find(e => String(e.rut).trim() === '219999990012');
                } else {
                    alert("❌ RUT o contraseña incorrectos. Verificá los datos ingresados.");
                    return;
                }
            }

            if (recordar) {
                localStorage.setItem('lt_recordar_rut_empresa', rutInput);
            } else {
                localStorage.removeItem('lt_recordar_rut_empresa');
            }

            try {
                await fetch(`${BACKEND_URL}/api/usuarios/registro`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ rol: 'empresa', nombre: emp.nombre, identificador: emp.rut, giroComercial: emp.giro })
                });
            } catch(e) {}

            localStorage.setItem('lt_sesion_empresa', JSON.stringify(emp));
            location.reload();
        }

        async function completarRegistroEmpresa() {
            let nombre = document.getElementById('regEmpNombre').value.trim();
            let rut = document.getElementById('regEmpRut').value.trim();
            let giro = document.getElementById('regEmpGiro').value;
            let telefono = document.getElementById('regEmpTel').value.trim();
            let direccion = document.getElementById('regEmpDir').value.trim();
            let password = document.getElementById('regEmpPass').value.trim();
            let fileInput = document.getElementById('regEmpLogoFile');

            if (!nombre || !rut || !password) { alert("⚠️ Completá los campos obligatorios."); return; }

            let base = JSON.parse(localStorage.getItem('lt_base_empresas')) || [];
            if (base.some(e => String(e.rut).trim() === rut)) { alert("⚠️ Ya existe un local registrado con este RUT."); return; }

            if (fileInput.files && fileInput.files[0]) {
                let reader = new FileReader();
                reader.onload = function(e) {
                    guardarEmpresaConLogo(base, { rut, nombre, giro, logo: e.target.result, telefono, direccion, password, productos: [], pedidos: [] });
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                guardarEmpresaConLogo(base, { rut, nombre, giro, logo: '', telefono, direccion, password, productos: [], pedidos: [] });
            }
        }

        async function guardarEmpresaConLogo(base, nuevaEmpresa) {
            base.push(nuevaEmpresa);
            localStorage.setItem('lt_base_empresas', JSON.stringify(base));

            // Sincronización REST con el servidor en Render
            try {

        function guardarNuevoProducto() {
            let nombre = document.getElementById('nuevoProdNombre').value.trim();
            let precio = parseFloat(document.getElementById('nuevoProdPrecio').value);
            let fileInput = document.getElementById('nuevoProdFile');
            let outlet = document.getElementById('nuevoProdOutlet').checked;
            let destacado = document.getElementById('nuevoProdDestacado').checked;

            if (!nombre || !precio) { alert("⚠️ Completá el nombre y el precio."); return; }

            if (fileInput.files && fileInput.files[0]) {
                let reader = new FileReader();
                reader.onload = function(e) {
                    procesarGuardadoProducto(nombre, precio, e.target.result, outlet, destacado);
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                procesarGuardadoProducto(nombre, precio, 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=400&q=80', outlet, destacado);
            }
        }

        async function procesarGuardadoProducto(nombre, precio, imagen, outlet, destacado) {
            let base = JSON.parse(localStorage.getItem('lt_base_empresas')) || [];
            let sesion = JSON.parse(localStorage.getItem('lt_sesion_empresa'));
            let emp = base.find(e => String(e.rut).trim() === String(sesion.rut).trim());

            if (!emp.productos) emp.productos = [];
            let nuevoP = {
                id: Date.now(),
                nombre,
                precio,
                outlet,
                destacado,
                imagen
            };

            emp.productos.push(nuevoP);
            localStorage.setItem('lt_base_empresas', JSON.stringify(base));
            localStorage.setItem('lt_sesion_empresa', JSON.stringify(emp));

            try {
                await fetch(`${BACKEND_URL}/api/empresas/${emp.rut}/catalogo`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ productos: emp.productos })
                });
            } catch(e) {}

            alert("✅ ¡Producto agregado con éxito y sincronizado con la App Cliente!");
            mostrarGestionCatalogo();
        }

            let base = JSON.parse(localStorage.getItem('lt_base_empresas')) || [];
            let sesion = JSON.parse(localStorage.getItem('lt_sesion_empresa'));
            let emp = base.find(e => String(e.rut).trim() === String(sesion.rut).trim());

            emp.productos = emp.productos.filter(p => p.id !== idProd);
            localStorage.setItem('lt_base_empresas', JSON.stringify(base));
            localStorage.setItem('lt_sesion_empresa', JSON.stringify(emp));

            mostrarGestionCatalogo();

                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg> Volver al Dashboard
                </button>
                <div class="section-title"><span>💰 Historial y Liquidación</span></div>
                <div style="background:linear-gradient(135deg, #137333, #0d5123); color:white; padding:15px; border-radius:var(--radius); margin-bottom:15px;">
                    <h4 style="margin:0 0 8px 0; font-size:14px;">Resumen Financiero Acumulado</h4>
                    <p style="margin:2px 0; font-size:12px; opacity:0.9;">Total Bruto Ventas: $${brutoTotal.toFixed(2)}</p>
                    <p style="margin:2px 0; font-size:12px; opacity:0.9;">Total Comisiones: -$${comisionesTotal.toFixed(2)}</p>
                    <h3 style="margin:8px 0 0 0; font-size:18px; border-top:1px solid rgba(255,255,255,0.3); padding-top:6px;">Neto Líquido: $${netoTotal.toFixed(2)}</h3>
                </div>
                ${htmlHistorial}
            `;
        }

        function iniciarCronometroEnVivo(idPedido, timestampInicio) {
            const elCronometro = document.getElementById(`cronometro-${idPedido}`);
            if (!elCronometro) return;

            function actualizarReloj() {
                let ahora = Date.now();
                let segundosTotales = Math.floor((ahora - timestampInicio) / 1000);
                if (segundosTotales < 0) segundosTotales = 0;
                let mins = Math.floor(segundosTotales / 60);
                let secs = segundosTotales % 60;
                elCronometro.innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            }

            actualizarReloj();
            temporizadoresGlobales[idPedido] = setInterval(actualizarReloj, 1000);
        }

        window.cambiarEstadoPedido = function(idPedido, nuevoEstado) {
            let base = JSON.parse(localStorage.getItem('lt_base_empresas')) || [];
            let sesion = JSON.parse(localStorage.getItem('lt_sesion_empresa'));
            if (!sesion) return;

            let empIndex = base.findIndex(e => String(e.rut).trim() === String(sesion.rut).trim());
            if (empIndex === -1) return;

            let emp = base[empIndex];
            if (!emp.pedidos) emp.pedidos = [];

            let pedido = emp.pedidos.find(p => Number(p.id) === Number(idPedido));
            if (pedido) {
                pedido.estado = nuevoEstado;
                pedido.tiempoInicioEstado = Date.now();
                pedido.rutComercio = emp.rut;

                localStorage.setItem('lt_base_empresas', JSON.stringify(base));
                localStorage.setItem('lt_sesion_empresa', JSON.stringify(emp));

                fetch(`${BACKEND_URL}/api/pedidos`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(pedido)
                }).catch(e => console.warn("Modo offline en cambio de estado", e));

                let pedidosCliente = JSON.parse(localStorage.getItem('lt_pedidos_cliente')) || [];
                let pCliente = pedidosCliente.find(p => Number(p.id) === Number(idPedido));
                if (pCliente) {
                    pCliente.estado = nuevoEstado;
                    localStorage.setItem('lt_pedidos_cliente', JSON.stringify(pedidosCliente));
                }

                if (nuevoEstado === 'Listo para Retirar (En Ruta/Cadete)') {
                    let pedidosCadete = JSON.parse(localStorage.getItem('lt_pedidos_cadete')) || [];
                    if (!pedidosCadete.some(p => Number(p.id) === Number(idPedido))) {
                        pedidosCadete.push({
                            id: pedido.id,
                            comercio: emp.nombre,
                            rutComercio: emp.rut,
                            direccionComercio: emp.direccion,
                            telefonoComercio: emp.telefono,
                            cliente: pedido.cliente,
                            direccionCliente: pedido.direccion,
                            telefonoCliente: pedido.telefonoCliente || 'Sin tel',
                            total: pedido.total,
                            codigoVerificacion: pedido.codigoVerificacion,
                            tipoEntrega: pedido.tipoEntrega || 'domicilio',
                            estado: 'Disponible para retirar'
                        });
                        localStorage.setItem('lt_pedidos_cadete', JSON.stringify(pedidosCadete));
                    }
                }

                window.dispatchEvent(new Event('storage'));

                alert(`✅ Pedido #${idPedido} actualizado a:\n"${nuevoEstado}"`);

                if (nuevoEstado === 'Listo para Retirar (En Ruta/Cadete)') {
                    mostrarPedidosEnRutaComercio();
                } else {
                    mostrarPedidosEntrantesComercio();
                }
            } else {
                alert("⚠️ No se encontró el pedido a modificar.");
            }
        };

        window.imprimirTicketPedido = function(idPedido) {
            let emp = obtenerEmpresaActualizada();
            if (!emp || !emp.pedidos) { alert("⚠️ No hay sesión activa."); return; }

            let pedido = emp.pedidos.find(p => Number(p.id) === Number(idPedido));
            if (!pedido) { alert("⚠️ No se encontró el pedido #" + idPedido); return; }

            let itemsTicket = (pedido.items || []).map(i => `
                <tr>
                    <td>${i.cantidad || 1}x ${i.nombre}</td>
                    <td style="text-align:right;">$${(i.precio * (i.cantidad || 1))}</td>
                </tr>
            `).join('') || `<tr><td colspan="2">${pedido.descripcion || 'Pedido de catálogo'}</td></tr>`;

            let ventana = window.open('', '_blank', 'width=400,height=600');
            ventana.document.write(`
                <html>
                <head><title>Ticket Pedido #${pedido.id}</title></head>
                <body style="font-family: monospace; padding: 15px; font-size: 14px;">
                    <h3 style="text-align:center; margin:0;">LO TENGO</h3>
                    <p style="text-align:center; font-size:11px; margin:2px 0;">Comprobante para Comercio</p>
                    <hr>
                    <p><b>Comercio:</b> ${emp.nombre}</p>
                    <p><b>Pedido ID:</b> #${pedido.id}</p>
                    <p><b>Cliente:</b> ${pedido.cliente} (${pedido.telefonoCliente || 'Sin tel'})</p>
                    <p><b>Modalidad:</b> ${pedido.tipoEntrega === 'mostrador' ? 'Retirar en Local (Pickup)' : 'Envío a Domicilio'}</p>
                    <hr>
                    <table style="width:100%; border-collapse: collapse;">
                        <thead>
                            <tr style="border-bottom: 1px solid #000;">
                                <th style="text-align:left;">Ítem</th>
                                <th style="text-align:right;">Subtotal</th>
                            </tr>
                        </thead>
                        <tbody>${itemsTicket}</tbody>
                    </table>
                    <hr>
                    <h3 style="text-align:right;">Total: $${pedido.total}</h3>
                    <hr>
                    <h2 style="text-align:center; margin:10px 0;">PIN: ${pedido.codigoVerificacion}</h2>
                    <script>window.onload = function() { window.print(); }<\/script>
                </body>
                </html>
            `);
            ventana.document.close();
        };

        function actualizarMenuActivoEmpresa(index) {
            const botones = document.querySelectorAll('.bottom-nav .nav-item');
            botones.forEach((btn, idx) => {
                if (idx === index) btn.classList.add('active');
                else btn.classList.remove('active');
            });
        }
    </script>
</body>
