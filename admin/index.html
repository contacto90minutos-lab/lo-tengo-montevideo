<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LO TENGO - Panel de Administración Central</title>
    <style>
        :root {
            --primary: #0F172A;
            --secondary: #E85B04;
            --success: #10B981;
            --warning: #F59E0B;
            --danger: #EF4444;
            --bg-light: #F8FAFC;
            --border: #E2E8F0;
            --radius: 14px;
            --shadow-subtle: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #F1F5F9;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #1E293B;
        }

        #app-container {
            background: #ffffff;
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .header-app {
            background: var(--primary);
            color: white;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
        }

        .header-app h1 {
            margin: 0;
            font-size: 18px;
            letter-spacing: 0.5px;
            font-weight: 900;
        }

        .content-body {
            padding: 16px;
            flex: 1;
            overflow-y: auto;
            padding-bottom: 90px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            margin: 6px 0 12px 0;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 14px;
            background: #F8FAFC;
        }
        input:focus { outline: none; border-color: var(--secondary); background: #fff; }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 800;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        button:hover { opacity: 0.95; transform: translateY(-1px); }

        .btn-volver-atras {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #FFFFFF;
            color: var(--primary);
            border: 1.5px solid var(--border);
            padding: 10px 16px;
            font-size: 13px;
            font-weight: 700;
            border-radius: var(--radius);
            cursor: pointer;
            width: auto;
            box-shadow: var(--shadow-subtle);
            margin-bottom: 16px;
        }
        .btn-volver-atras:hover { background: #F1F5F9; border-color: var(--secondary); }

        .card-item {
            background: #fff;
            border: 1.5px solid var(--border);
            border-radius: var(--radius);
            padding: 14px;
            margin-bottom: 12px;
            box-shadow: var(--shadow-subtle);
        }

        .section-title {
            font-size: 16px;
            font-weight: 900;
            color: var(--primary);
            margin: 0 0 14px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 800;
            display: inline-block;
        }
        .badge-admin { background: #EEF2FF; color: #4338CA; }
        .badge-giro { background: #FEF3C7; color: #B45309; }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 18px;
        }
        .stat-card {
            background: #F8FAFC;
            border: 1.5px solid var(--border);
            border-radius: var(--radius);
            padding: 14px;
            text-align: center;
        }

        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #ffffff;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            box-sizing: border-box;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.03);
            z-index: 10;
        }

        .nav-item {
            background: none;
            border: none;
            color: #64748B;
            font-size: 10px;
            cursor: pointer;
            width: auto;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-weight: 700;
        }
        .nav-item span { font-size: 18px; margin-bottom: 2px; }
        .nav-item.active { color: var(--secondary); }
    </style>
</head>
<body>

    <div id="app-container">
        <!-- Header -->
        <div class="header-app">
            <h1><span style="color:var(--secondary);">LO</span> TENGO <small style="font-size:11px; opacity:0.8;">[Admin]</small></h1>
            <span id="header-admin-info" style="font-size: 11px; opacity: 0.9; font-weight: 700;">Panel Central</span>
        </div>
        
        <!-- Contenedor Principal -->
        <div class="content-body" id="main-content-admin">
            <!-- Pantalla Login Admin -->
            <div id="screen-login-admin">
                <h3 style="color: var(--primary); margin-top: 0; font-weight: 900; font-size: 20px;">Acceso Administración</h3>
                <p style="font-size: 13px; color: #64748B; margin-bottom: 20px;">Control total de bases de datos de comercios, cadetes y clientes.</p>

                <label>Usuario Administrador:</label>
                <input type="text" id="loginAdminUser" placeholder="Ej: admin">

                <label>Contraseña:</label>
                <input type="password" id="loginAdminPass" placeholder="Contraseña">

                <button type="button" onclick="ejecutarLoginAdmin()" style="background-color: var(--secondary); margin-top: 10px;">Ingresar al Sistema</button>
            </div>
        </div>

        <!-- Barra de Navegación Inferior Admin -->
        <div class="bottom-nav" id="bottom-nav-admin" style="display: none;">
            <button class="nav-item active" onclick="mostrarDashboardAdmin()"><span>📊</span>Panel</button>
            <button class="nav-item" onclick="mostrarListaEmpresasAdmin()"><span>🏪</span>Empresas</button>
            <button class="nav-item" onclick="mostrarListaCadetesAdmin()"><span>🛵</span>Cadetes</button>
            <button class="nav-item" onclick="mostrarListaClientesAdmin()"><span>👥</span>Clientes</button>
            <button class="nav-item" onclick="cerrarSesionAdmin()"><span>🚪</span>Salir</button>
        </div>
    </div>

    <script>
        const BACKEND_URL = "https://lo-tengo-montevideo.onrender.com";

        document.addEventListener("DOMContentLoaded", () => {
            verificarSesionAdmin();
        });

        function verificarSesionAdmin() {
            let sesion = localStorage.getItem('lt_sesion_admin');
            if (sesion) {
                document.getElementById('bottom-nav-admin').style.display = 'flex';
                mostrarDashboardAdmin();
            }
        }

        function ejecutarLoginAdmin() {
            let user = document.getElementById('loginAdminUser').value.trim();
            let pass = document.getElementById('loginAdminPass').value.trim();

            if (user === "admin" && pass === "1234") {
                localStorage.setItem('lt_sesion_admin', JSON.stringify({ user: "Administrador General" }));
                location.reload();
            } else {
                alert("❌ Credenciales incorrectas. Probá admin / 1234");
            }
        }

        function cerrarSesionAdmin() {
            localStorage.removeItem('lt_sesion_admin');
            location.reload();
        }

        function actualizarMenuActivoAdmin(index) {
            document.querySelectorAll('.bottom-nav .nav-item').forEach((btn, idx) => {
                btn.classList.toggle('active', idx === index);
            });
        }

        // ==========================================
        // DASHBOARD PRINCIPAL ADMIN
        // ==========================================
        function mostrarDashboardAdmin() {
            actualizarMenuActivoAdmin(0);
            let empresas = JSON.parse(localStorage.getItem('lt_base_empresas')) || [];
            let cadetes = JSON.parse(localStorage.getItem('lt_base_cadetes')) || [];
            let clientes = JSON.parse(localStorage.getItem('lt_base_usuarios')) || [];

            let totalProductos = empresas.reduce((acc, emp) => acc + (emp.productos ? emp.productos.length : 0), 0);

            const container = document.getElementById('main-content-admin');
            container.innerHTML = `
                <h3 style="margin-top:0; font-weight:900; font-size:18px;">📊 Resumen de Base de Datos</h3>
                <p style="font-size:13px; color:#64748B; margin-bottom:16px;">Control centralizado de activos de la plataforma en Montevideo.</p>

                <div class="stats-grid">
                    <div class="stat-card" onclick="mostrarListaEmpresasAdmin()" style="cursor:pointer;">
                        <span style="font-size:24px;">🏪</span>
                        <h2 style="margin:6px 0 2px 0; color:var(--primary);">${empresas.length}</h2>
                        <p style="margin:0; font-size:12px; color:#64748B; font-weight:700;">Empresas / Locales</p>
                    </div>
                    <div class="stat-card" onclick="mostrarListaCadetesAdmin()" style="cursor:pointer;">
                        <span style="font-size:24px;">🛵</span>
                        <h2 style="margin:6px 0 2px 0; color:var(--secondary);">${cadetes.length}</h2>
                        <p style="margin:0; font-size:12px; color:#64748B; font-weight:700;">Cadetes Registrados</p>
                    </div>
                    <div class="stat-card" onclick="mostrarListaClientesAdmin()" style="cursor:pointer;">
                        <span style="font-size:24px;">👥</span>
                        <h2 style="margin:6px 0 2px 0; color:var(--success);">${clientes.length}</h2>
                        <p style="margin:0; font-size:12px; color:#64748B; font-weight:700;">Clientes Activos</p>
                    </div>
                    <div class="stat-card">
                        <span style="font-size:24px;">📦</span>
                        <h2 style="margin:6px 0 2px 0; color:#4338CA;">${totalProductos}</h2>
                        <p style="margin:0; font-size:12px; color:#64748B; font-weight:700;">Productos en Catálogo</p>
                    </div>
                </div>

                <div style="background:#FEE2E2; border:1.5px solid #FCA5A5; padding:16px; border-radius:var(--radius); margin-top:20px;">
                    <h4 style="margin:0 0 6px 0; color:#991B1B; font-size:14px;">🗄️ Valor Estratégico de Datos</h4>
                    <p style="margin:0; font-size:12px; color:#7F1D1D; line-height:1.4;">Toda la información recopilada de comercios, cadetes y hábitos de clientes queda almacenada de forma estructurada para auditorías, análisis comercial o monetización de bases de datos.</p>
                </div>
            `;
        }

        // ==========================================
        // GESTIÓN DE EMPRESAS (CON BASE DE DATOS PROFUNDA)
        // ==========================================
        function mostrarListaEmpresasAdmin() {
            actualizarMenuActivoAdmin(1);
            let empresas = JSON.parse(localStorage.getItem('lt_base_empresas')) || [];

            let html = empresas.map((emp, index) => `
                <div class="card-item" onclick="verDetalleEmpresaAdmin('${emp.rut}')" style="cursor:pointer;">
                    <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px;">
                        <h4 style="margin:0; font-size:15px; font-weight:900; color:var(--primary);">${emp.nombre}</h4>
                        <span class="badge badge-giro">${emp.giro || 'Comercio'}</span>
                    </div>
                    <p style="margin:2px 0; font-size:12px; color:#64748B;">RUT: <b>${emp.rut}</b> | Tel: ${emp.telefono || 'Sin tel'}</p>
                    <p style="margin:2px 0; font-size:12px; color:#64748B;">📍 ${emp.direccion || 'Montevideo'}</p>
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:8px; border-top:1px solid var(--border); padding-top:6px; font-size:12px;">
                        <span>📦 Productos: <b>${emp.productos ? emp.productos.length : 0}</b></span>
                        <span style="color:var(--secondary); font-weight:800;">Ver Planilla y Movimientos ›</span>
                    </div>
                </div>
            `).join('') || '<p style="text-align:center; color:#64748B;">No hay empresas registradas.</p>';

            const container = document.getElementById('main-content-admin');
            container.innerHTML = `
                <div class="section-title">
                    <span>🏪 Base de Datos de Empresas</span>
                    <span style="font-size:12px; color:#64748B; font-weight:700;">Total: ${empresas.length}</span>
                </div>
                ${html}
            `;
        }

        function verDetalleEmpresaAdmin(rut) {
            let empresas = JSON.parse(localStorage.getItem('lt_base_empresas')) || [];
            let emp = empresas.find(e => String(e.rut).trim() === String(rut).trim());
            if (!emp) return;

            let productosHtml = (emp.productos || []).map(p => `
                <div style="display:flex; justify-content:space-between; font-size:12px; border-bottom:1px dashed var(--border); padding:6px 0;">
                    <span><b>${p.nombre}</b> ${p.outlet ? '🔥(Outlet)' : ''}</span>
                    <b style="color:var(--success);">$${p.precio}</b>
                </div>
            `).join('') || '<p style="font-size:12px; color:#64748B;">Sin productos cargados.</p>';

            let pedidosHtml = (emp.pedidos || []).map(p => `
                <div style="font-size:12px; border-bottom:1px solid var(--border); padding:6px 0;">
                    <div style="display:flex; justify-content:space-between;">
                        <b>Pedido #${p.id}</b>
                        <span style="color:var(--secondary); font-weight:bold;">${p.estado || 'Recibido'}</span>
                    </div>
                    <span>Cliente: ${p.cliente} | Total: <b>$${p.total}</b></span>
                </div>
            `).join('') || '<p style="font-size:12px; color:#64748B;">Sin pedidos registrados.</p>';

            const container = document.getElementById('main-content-admin');
            container.innerHTML = `
                <button type="button" class="btn-volver-atras" onclick="mostrarListaEmpresasAdmin()">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg> Volver al Listado
                </button>
                
                <div style="background:#F8FAFC; border:1.5px solid var(--border); border-radius:var(--radius); padding:16px; margin-bottom:16px;">
                    <h3 style="margin:0 0 6px 0; font-size:18px; font-weight:900; color:var(--primary);">${emp.nombre}</h3>
                    <p style="margin:2px 0; font-size:13px; color:#64748B;">🏷️ Giro: <b>${emp.giro}</b> | RUT: <b>${emp.rut}</b></p>
                    <p style="margin:2px 0; font-size:13px; color:#64748B;">📞 Teléfono: ${emp.telefono} | 📍 ${emp.direccion}</p>
                </div>

                <h4 style="font-size:15px; font-weight:900; color:var(--primary); margin:14px 0 8px 0;">📦 Catálogo de Productos (${emp.productos ? emp.productos.length : 0})</h4>
                <div style="background:#fff; border:1.5px solid var(--border); border-radius:var(--radius); padding:12px; margin-bottom:16px; max-height:180px; overflow-y:auto;">
                    ${productosHtml}
                </div>

                <h4 style="font-size:15px; font-weight:900; color:var(--primary); margin:14px 0 8px 0;">📊 Movimientos y Pedidos (${emp.pedidos ? emp.pedidos.length : 0})</h4>
                <div style="background:#fff; border:1.5px solid var(--border); border-radius:var(--radius); padding:12px; max-height:200px; overflow-y:auto;">
                    ${pedidosHtml}
                </div>
            `;
        }

        // ==========================================
        // GESTIÓN DE CADETES (CON ID ÚNICO Y PLANILLA)
        // ==========================================
        function mostrarListaCadetesAdmin() {
            actualizarMenuActivoAdmin(2);
            let cadetes = JSON.parse(localStorage.getItem('lt_base_cadetes')) || [];

            let html = cadetes.map((c, index) => {
                let idCadete = c.idCadete || `CAD-00${index + 1}`;
                return `
                    <div class="card-item">
                        <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px;">
                            <h4 style="margin:0; font-size:15px; font-weight:900; color:var(--primary);">${c.nombre}</h4>
                            <span class="badge" style="background:#E0F2FE; color:#0369A1;">${idCadete}</span>
                        </div>
                        <p style="margin:2px 0; font-size:12px; color:#64748B;">🪪 CI: <b>${c.ci || 'No especificada'}</b> | Tel: ${c.telefono}</p>
                        <p style="margin:2px 0; font-size:12px; color:#64748B;">✉️ Email: ${c.email || 'No registrado'}</p>
                        <p style="margin:2px 0; font-size:12px; color:#64748B;">🛵 Vehículo: <b>${c.vehiculo || 'Moto'}</b></p>
                    </div>
                `;
            }).join('') || '<p style="text-align:center; color:#64748B;">No hay cadetes registrados en la base de datos.</p>';

            const container = document.getElementById('main-content-admin');
            container.innerHTML = `
                <div class="section-title">
                    <span>🛵 Planilla de Cadetes</span>
                    <span style="font-size:12px; color:#64748B; font-weight:700;">Total: ${cadetes.length}</span>
                </div>
                ${html}
            `;
        }

        // ==========================================
        // GESTIÓN DE CLIENTES
        // ==========================================
        function mostrarListaClientesAdmin() {
            actualizarMenuActivoAdmin(3);
            let clientes = JSON.parse(localStorage.getItem('lt_base_usuarios')) || [];

            let html = clientes.map(cli => `
                <div class="card-item">
                    <h4 style="margin:0 0 4px 0; font-size:15px; font-weight:900; color:var(--primary);">${cli.nombre}</h4>
                    <p style="margin:2px 0; font-size:12px; color:#64748B;">📞 Teléfono / WhatsApp: <b>${cli.telefono}</b></p>
                    <p style="margin:2px 0; font-size:12px; color:#64748B;">📍 Dirección: ${cli.direccion || 'Montevideo'}</p>
                </div>
            `).join('') || '<p style="text-align:center; color:#64748B;">No hay clientes registrados.</p>';

            const container = document.getElementById('main-content-admin');
            container.innerHTML = `
                <div class="section-title">
                    <span>👥 Base de Datos de Clientes</span>
                    <span style="font-size:12px; color:#64748B; font-weight:700;">Total: ${clientes.length}</span>
                </div>
                ${html}
            `;
        }
    </script>
</body>
</html>
