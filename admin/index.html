<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Administración - LO TENGO (MVP)</title>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body style="font-family: monospace; padding: 20px; background: #fff0f0;">
  <h1>Administración LO TENGO (Uso Interno)</h1>
  <p>Monitoreo General del Ecosistema</p>
  <hr>

  <h3>Alertas del Sistema:</h3>
  <div id="alertasBox" style="background: #222; color: #ff5555; padding: 10px; margin-bottom: 20px;">
    Sin alertas críticas.
  </div>

  <h3>Pedidos Globales Activos (Carril B / Tres Cruces / Express):</h3>
  <div id="pedidosGlobalesBox" style="background: #fff; padding: 10px; border: 1px solid #ccc;">
    Cargando pedidos globales...
  </div>

  <script>
    const socket = io('http://localhost:3000');

    // Escuchar alertas de cadetes agotados o sin respuesta
    socket.on('alerta_admin_sin_cadetes', (data) => {
      document.getElementById('alertasBox').innerHTML = `⚠️ ALERTA: Pedido ${data.pedidoId} sin cadetes libres disponibles.`;
    });

    socket.on('pedido_sin_respuesta_flota', (data) => {
      document.getElementById('alertasBox').innerHTML = `⚠️ ALERTA: La flota no respondió al pedido ${data.id}.`;
    });

    // Cargar lista inicial de pedidos globales
    async function cargarPedidosGlobales() {
      try {
        const res = await fetch('http://localhost:3000/api/pedidos/globales');
        const globales = await res.json();
        
        let html = "";
        if (globales.length === 0) {
          html = "No hay pedidos globales activos en este momento.";
        } else {
          globales.forEach(p => {
            html += `[ID: ${p.id}] - Tipo: ${p.tipoServicio} - Estado: ${p.estado} - Origen: ${p.origen} ➔ Destino: ${p.destino}<br>`;
          });
        }
        document.getElementById('pedidosGlobalesBox').innerHTML = html;
      } catch (err) {
        console.error("Error cargando globales", err);
      }
    }

    // Actualizar cada pocos segundos o al recibir eventos
    setInterval(cargarPedidosGlobales, 3000);
    cargarPedidosGlobales();
  </script>
</body>
</html>
