<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LO TENGO - Clientes</title>
    <style>
        :root {
            --primary: #FF5722;
            --primary-gradient: linear-gradient(135deg, #FF5722, #FF7043);
            --outlet-gradient: linear-gradient(135deg, #7C3AED, #EC4899);
            --success: #10B981;
            --bg-body: #F3F4F6;
            --card-bg: #FFFFFF;
            --card-border: #E5E7EB;
            --text-main: #111827;
            --text-muted: #6B7280;
            --radius-lg: 20px;
            --radius-md: 14px;
            --shadow-subtle: 0 4px 20px rgba(0, 0, 0, 0.05);
            --shadow-outlet: 0 10px 25px rgba(124, 58, 237, 0.25);
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-body);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-main);
            overflow-x: hidden;
        }

        /* Sistema de Toasts Elegantes */
        #toast-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 90%;
            max-width: 400px;
            pointer-events: none;
        }
        .toast-msg {
            background: #111827;
            color: #FFF;
            padding: 14px 18px;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 700;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            gap: 12px;
            animation: fadeInOut 3s ease forwards;
            pointer-events: auto;
        }
        .toast-msg.success { background: #059669; }
        .toast-msg.error { background: #DC2626; }
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateY(-10px); }
            15% { opacity: 1; transform: translateY(0); }
            85% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-10px); }
        }

        /* Spinner de Carga */
        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid #FFF;
            border-top: 2px solid transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: inline-block;
            vertical-align: middle;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Splash Screen Animado Minimalista */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #111827;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .splash-logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
            animation: logoScale 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .splash-isologo {
            width: 54px;
            height: 54px;
            background: var(--primary-gradient);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #FFFFFF;
            font-weight: 900;
            font-size: 26px;
            letter-spacing: -1px;
            box-shadow: 0 10px 25px rgba(255, 87, 34, 0.4);
        }

        .splash-texto {
            color: #FFFFFF;
            font-size: 28px;
            font-weight: 900;
            letter-spacing: -1px;
        }

        .splash-sub {
            color: #9CA3AF;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-top: 14px;
            text-transform: uppercase;
        }

        @keyframes logoScale {
            0% { opacity: 0; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }

        #app-container {
            background: #FFFFFF;
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            position: relative;
            border-left: 1px solid var(--card-border);
            border-right: 1px solid var(--card-border);
        }

        .header-app {
            background: #FFFFFF;
            color: var(--text-main);
            padding: 18px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--card-border);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .header-app h1 { margin: 0; font-size: 20px; font-weight: 900; letter-spacing: -0.5px; display: flex; align-items: center; gap: 8px; }

        .brand-badge {
            background: var(--primary-gradient);
            color: #fff;
            width: 28px;
            height: 28px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 900;
        }

        .content-body { padding: 20px; flex: 1; overflow-y: auto; padding-bottom: 110px; }

        label { font-size: 13px; font-weight: 700; color: var(--text-muted); display: block; margin-bottom: 6px; }

        input, select, textarea {
            width: 100%; padding: 14px 16px; margin: 0 0 16px 0; border: 1.5px solid var(--card-border); border-radius: var(--radius-md); box-sizing: border-box; font-size: 15px; background: #F9FAFB; color: var(--text-main); font-family: inherit;
        }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); background: #FFFFFF; box-shadow: 0 0 0 4px rgba(255, 87, 34, 0.1); }

        button {
            width: 100%; padding: 15px; background: var(--primary-gradient); color: white; border: none; border-radius: var(--radius-md); font-weight: 800; cursor: pointer; font-size: 15px; box-shadow: 0 4px 14px rgba(255, 87, 34, 0.3); transition: all 0.2s;
        }
        button:hover { opacity: 0.95; transform: translateY(-1px); }

        .link-btn { background: none; color: var(--primary); border: none; text-decoration: underline; cursor: pointer; margin-top: 8px; font-size: 13px; font-weight: 600; box-shadow: none; }
        
        .btn-volver-atras {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #FFFFFF;
            color: var(--text-main);
            border: 1.5px solid var(--card-border);
            padding: 10px 16px;
            font-size: 13px;
            font-weight: 700;
            border-radius: var(--radius-md);
            cursor: pointer;
            width: auto;
            box-shadow: var(--shadow-subtle);
            margin-bottom: 16px;
            transition: all 0.2s;
        }
        .btn-volver-atras:hover { background: #F3F4F6; border-color: var(--text-muted); transform: translateY(-1px); }

        .search-container { background: #F9FAFB; padding: 12px 18px; border-radius: var(--radius-md); display: flex; align-items: center; gap: 12px; margin-bottom: 20px; border: 1.5px solid var(--card-border); }
        .search-container input { border: none; background: transparent; margin: 0; padding: 0; outline: none; font-size: 15px; color: var(--text-main); }

        .categorias-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 22px; }
        .cat-card { background: var(--card-bg); border: 1.5px solid var(--card-border); border-radius: var(--radius-md); padding: 12px 4px; text-align: center; cursor: pointer; box-shadow: var(--shadow-subtle); transition: all 0.2s; }
        .cat-card:hover { transform: translateY(-2px); border-color: var(--primary); }
        .cat-card.outlet-cat { border-color: #C084FC; background: linear-gradient(135deg, #FAF5FF, #F3E8FF); }

        .outlet-banner { background: var(--outlet-gradient); color: white; padding: 22px; border-radius: var(--radius-lg); margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; box-shadow: var(--shadow-outlet); cursor: pointer; }
        .section-title { font-size: 17px; font-weight: 900; color: var(--text-main); margin: 0 0 16px 0; display: flex; align-items: center; justify-content: space-between; }

        .vehiculo-selector-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
        .vehiculo-card-opcion { background: #F9FAFB; border: 2px solid var(--card-border); border-radius: var(--radius-md); padding: 16px; text-align: center; cursor: pointer; transition: all 0.2s; }
        .vehiculo-card-opcion.seleccionado { border-color: var(--primary); background: rgba(255, 87, 34, 0.05); box-shadow: 0 0 0 4px rgba(255, 87, 34, 0.1); }

        .comercio-card { background: var(--card-bg); border: 1.5px solid var(--card-border); border-radius: var(--radius-lg); padding: 16px; margin-bottom: 14px; display: flex; align-items: center; gap: 16px; box-shadow: var(--shadow-subtle); }
        .comercio-avatar { width: 75px; height: 75px; border-radius: var(--radius-md); object-fit: cover; background: #E5E7EB; flex-shrink: 0; }

        .badge-estado { padding: 6px 12px; border-radius: 8px; font-size: 11px; font-weight: 800; display: inline-block; }
        .estado-recibido { background: #E0F2FE; color: #0369A1; }
        .estado-preparacion { background: #FFEDD5; color: #C2410C; }
        .estado-listo { background: #FEF3C7; color: #B45309; }
        .estado-camino { background: #DBEAFE; color: #1D4ED8; animation: pulse 1.5s infinite; }
        .estado-entregado { background: #D1FAE5; color: #047857; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        .btn-propina-opcion { padding: 8px; font-size: 12px; font-weight: 700; border-radius: 8px; border: 1.5px solid var(--card-border); background: #E5E7EB; color: var(--text-main); cursor: pointer; box-shadow: none; transition: all 0.2s; }
        .btn-propina-opcion.activo { background: var(--primary); color: #fff; border-color: var(--primary); }

        /* Pestañas de Pedidos */
        .pestañas-pedidos { display: flex; gap: 10px; margin-bottom: 16px; border-bottom: 2px solid var(--card-border); padding-bottom: 10px; }
        .tab-btn { flex: 1; padding: 10px; background: #E5E7EB; color: var(--text-muted); border: none; border-radius: var(--radius-md); font-weight: 800; font-size: 13px; cursor: pointer; box-shadow: none; transition: all 0.2s; }
        .tab-btn.activo { background: var(--primary); color: #FFF; }

        .bottom-nav { position: absolute; bottom: 0; left: 0; width: 100%; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-top: 1px solid var(--card-border); display: flex; justify-content: space-around; padding: 12px 0; z-index: 10; }
        .nav-item { background: none; border: none; color: var(--text-muted); font-size: 11px; cursor: pointer; display: flex; flex-direction: column; align-items: center; font-weight: 600; }
        .nav-item svg { width: 22px; height: 22px; margin-bottom: 4px; fill: currentColor; }
        .nav-item.active { color: var(--primary); font-weight: 800; }
    </style>
</head>
<body>

    <div id="toast-container"></div>

    <!-- Splash Screen Inicial -->
    <div id="splash-screen">
        <div class="splash-logo-container">
            <div class="splash-isologo">L+T</div>
            <div class="splash-texto">LO TENGO</div>
        </div>
        <div class="splash-sub">Ecosistema Logístico</div>
    </div>

    <div id="app-container">
        <div class="header-app">
            <h1><div class="brand-badge">L+T</div><span style="color: var(--primary);">LO</span> TENGO</h1>
            <span id="header-user-info" style="font-size: 12px; font-weight: 700; background: #F3F4F6; padding: 6px 12px; border-radius: 20px; border: 1px solid var(--card-border); cursor: pointer;" onclick="mostrarMiPerfil()">📍 Montevideo</span>
        </div>
        
        <div class="content-body" id="main-content">
            <!-- Pantalla Login -->
            <div id="screen-login">
                <h3 style="color: var(--text-main); margin-top: 0; font-size: 22px; font-weight: 900;">Iniciar Sesión</h3>
                <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 24px;">Ingresá a tu cuenta para pedir en Montevideo.</p>
                
                <button type="button" onclick="loginConGoogle()" style="background: #FFFFFF; color: #374151; border: 1.5px solid var(--card-border); margin-bottom: 16px; display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 700; box-shadow: var(--shadow-subtle);">
                    <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.19v3.15C3.17 21.32 7.23 24 12 24z"/><path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.19C.43 8.12 0 9.87 0 11.7s.43 3.58 1.19 5.12l4.09-2.55z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.23 0 3.17 2.68 1.19 6.58l4.09 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/></svg>
                    Continuar con Google
                </button>

                <label>Número de WhatsApp:</label>
                <input type="tel" id="loginTelefono" placeholder="Ej: 099123456">

                <label>Contraseña:</label>
                <input type="password" id="loginPassword" placeholder="Tu contraseña">

                <button id="btnIniciarSesion" type="button">Ingresar al Sistema</button>
                
                <div style="text-align: center; margin-top: 20px;">
                    <button id="irARegistro" type="button" class="link-btn" style="font-size:14px; text-decoration:underline;">¿No tenés cuenta? Registrate acá</button>
                </div>
            </div>

            <!-- Pantalla Registro -->
            <div id="screen-registro" style="display: none;">
                <button type="button" class="btn-volver-atras" onclick="irLogin()">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg> Volver al login
                </button>
                <h3 style="color: var(--text-main); margin-top: 0; font-size: 22px; font-weight: 900;">Crear Cuenta</h3>
                <label>Nombre y Apellido:</label>
                <input type="text" id="regNombre" placeholder="Tu nombre">
                <label>WhatsApp:</label>
                <input type="tel" id="regTelefono" placeholder="Ej: 099123456">
                <label>Correo Electrónico:</label>
                <input type="email" id="regEmail" placeholder="correo@ejemplo.com">
                <label>Dirección principal en Montevideo:</label>
                <input type="text" id="regDireccion" placeholder="Calle, número y barrio">
                <label>Contraseña:</label>
                <input type="password" id="regPassword" placeholder="Contraseña segura">
                <button type="button" onclick="completarRegistroCliente()" style="background: var(--success); margin-top: 10px;">Completar Registro</button>
            </div>
        </div>

        <!-- Barra Navegación Inferior -->
        <div class="bottom-nav" id="bottom-nav" style="display: none;">
            <button class="nav-item active" onclick="mostrarHome()">
                <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>Inicio
            </button>
            <button class="nav-item" onclick="mostrarZonaOutlet()">
                <svg viewBox="0 0 24 24"><path d="M21.41 11.58l-9-9C12.05 2.22 11.55 2 11 2H4c-1.1 0-2 .9-2 2v7c0 .55.22 1.05.59 1.42l9 9c.36.36.86.58 1.41.58.55 0 1.05-.22 1.41-.59l7-7c.37-.36.59-.86.59-1.41 0-.55-.23-1.06-.59-1.42zM5.5 7C4.67 7 4 6.33 4 5.5S4.67 4 5.5 4 7 4.67 7 5.5 6.33 7 5.5 7z"/></svg>Outlet
            </button>
            <button class="nav-item" onclick="mostrarFormularioCadeteria()">
                <svg viewBox="0 0 24 24"><path d="M19 7h-3V5.5C16 4.12 14.88 3 13.5 3h-3C9.12 3 8 4.12 8 5.5V7H5c-1.1 0-2 .9-2 2v9c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V9c0-1.1-.9-2-2-2zm-9-1.5c0-.28.22-.5.5-.5h3c.28 0 .5.22.5.5V7H10V5.5zm9 12.5H5V9h14v9z"/></svg>Cadetería
            </button>
            <button class="nav-item" onclick="mostrarPedidosActivos()">
                <svg viewBox="0 0 24 24"><path d="M20 6h-4V4c0-1.1-.9-2-2-2h-4c-1.1 0-2 .9-2 2v2H4c-1.1 0-2 .9-2 2v11c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zM10 4h4v2h-4V4zm10 15H4V8h16v11z"/></svg>Pedidos
            </button>
            <button class="nav-item" onclick="mostrarMiPerfil()">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>Perfil
            </button>
        </div>
    </div>
    <script>
        const BACKEND_URL = "https://lo-tengo-montevideo.onrender.com";

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = `toast-msg ${type}`;
            toast.innerHTML = `<span>${type === 'success' ? '✅' : '⚠️'}</span> <span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => { toast.remove(); }, 3500);
        }

        document.addEventListener("DOMContentLoaded", () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                if (splash) {
                    splash.style.opacity = '0';
                    splash.style.visibility = 'hidden';
                }
            }, 1500);

            verificarSesionCliente();
            configurarEventosLogin();
            inicializarDatosDemoSiEsNecesario();
            sincronizarEmpresasYPedidosDesdeServidor();

            window.addEventListener('storage', () => {
                if (document.getElementById('contenedor-cards-pedidos')) renderizarListaPedidos();
            });

            setInterval(() => {
                sincronizarEmpresasYPedidosDesdeServidor();
                if (document.getElementById('contenedor-cards-pedidos')) renderizarListaPedidos();
            }, 2000);
        });

        async function sincronizarEmpresasYPedidosDesdeServidor() {
            try {
                let resEmp = await fetch(`${BACKEND_URL}/api/empresas`);
                if (resEmp.ok) {
                    let empresasRemotas = await resEmp.json();
                    if (empresasRemotas && Array.isArray(empresasRemotas) && empresasRemotas.length > 0) {
                        localStorage.setItem('lt_base_empresas', JSON.stringify(empresasRemotas));
                    }
                }

                let response = await fetch(`${BACKEND_URL}/api/pedidos`);
                if (response.ok) {
                    let pedidosRemotos = await response.json();
                    if (pedidosRemotos && Array.isArray(pedidosRemotos)) {
                        let base = JSON.parse(localStorage.getItem('lt_base_empresas')) || [];
                        if (base.length > 0) {
                            let mapaLocal = new Map();
                            (base[0].pedidos || []).forEach(p => mapaLocal.set(String(p.id).trim(), p));
                            
                            pedidosRemotos.forEach(pR => {
                                mapaLocal.set(String(pR.id).trim(), pR);
                            });

                            base[0].pedidos = Array.from(mapaLocal.values());
                            localStorage.setItem('lt_base_empresas', JSON.stringify(base));
                        }
                    }
                }
            } catch (e) {}
        }

        function inicializarDatosDemoSiEsNecesario() {
            let base = JSON.parse(localStorage.getItem('lt_base_empresas')) || [];
            if (base.length === 0) {
                base = [{
                    nombre: "Lo Tengo Central Montevideo",
                    rut: "219999990012",
                    telefono: "099000000",
                    direccion: "Av. 18 de Julio 1300",
                    giro: "Gastronomía",
                    pedidos: [],
                    productos: [
                        { id: 1, nombre: "Chivito al Plato Clásico", precio: 480, imagen: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=400&q=80", outlet: false },
                        { id: 2, nombre: "Empanadas de Carne (Docena)", precio: 520, imagen: "https://images.unsplash.com/photo-1608897013039-887f21d8c804?auto=format&fit=crop&w=400&q=80", outlet: true }
                    ]
                }];
                localStorage.setItem('lt_base_empresas', JSON.stringify(base));
            }
        }

        function verificarSesionCliente() {
            const sesion = localStorage.getItem('lt_sesion_activa');
            if (sesion) {
                try {
                    const usuario = JSON.parse(sesion);
                    document.getElementById('header-user-info').innerText = `📍 ${usuario.direccion || 'Montevideo'}`;
                    document.getElementById('bottom-nav').style.display = 'flex';
                    mostrarHome();
                } catch (e) { console.error(e); }
            }
        }

        function configurarEventosLogin() {
            const btnReg = document.getElementById('irARegistro');
            if (btnReg) {
                btnReg.onclick = () => {
                    document.getElementById('screen-login').style.display = 'none';
                    document.getElementById('screen-registro').style.display = 'block';
                };
            }

            const btnIng = document.getElementById('btnIniciarSesion');
            if (btnIng) {
                btnIng.onclick = async () => {
                    const tel = document.getElementById('loginTelefono').value.trim();
                    const pass = document.getElementById('loginPassword').value.trim();
                    const usuarios = JSON.parse(localStorage.getItem('lt_base_usuarios')) || [];
                    let usr = usuarios.find(u => String(u.telefono).trim() === tel && String(u.password || '').trim() === pass);

                    if (!usr && tel === "099123456" && pass === "1234") {
                        usr = { nombre: "Cliente Demo Montevideo", telefono: "099123456", email: "demo@lotengo.uy", direccion: "Pocitos, Montevideo", password: "1234", tarjetas: [{ id: 1, banco: "Itau", enmascarada: "•••• •••• •••• 4021" }] };
                        usuarios.push(usr);
                        localStorage.setItem('lt_base_usuarios', JSON.stringify(usuarios));
                    }

                items: [

        function actualizarCalculoCadeteria() {
            let origen = document.getElementById('cadOrigen').value.trim();
            let inputsDestino = document.querySelectorAll('.input-destino-cadete');
            let destinoValido = inputsDestino.length > 0 ? inputsDestino[0].value.trim() : '';

                return;

            let costoBaseEnvio = tipoVehiculoCadete === 'moto' ? 190 : 390;
            if (retornoOrigenActivo) costoBaseEnvio *= 1.4;
            let costoTotalEnvio = Math.round(costoBaseEnvio);
            let tarifaTotalFinal = costoTotalEnvio + propina;

            if(panel) {
                panel.innerHTML = `

            let costoEnvio = tipoVehiculoCadete === 'moto' ? 190 : 390;

                hojaDeRuta += ` ➔ Retorno a Origen: [${origenPuntoA}]`;

                direccion: destinoPuntoB,
                retornoOrigen: retornoOrigenActivo,
                valorEnvio: costoEnvio,
                propina: propina,
                total: totalFinal,
                estado: 'Recibido',
                descripcion: `Cadetería (${tipoVehiculoCadete.toUpperCase()}) | ${hojaDeRuta} | Detalle: ${desc}`,
                items: [
                    { nombre: `Envío Express (${tipoVehiculoCadete})`, precio: costoEnvio, cantidad: 1 },
                    ...(propina > 0 ? [{ nombre: 'Propina Cadete', precio: propina, cantidad: 1 }] : [])
                ],
                codigoVerificacion: Math.floor(1000 + Math.random() * 9000).toString()
            };

            let base = JSON.parse(localStorage.getItem('lt_base_empresas')) || [];
            if (base.length === 0) { showToast("Error de central.", "error"); return; }
            if (!base[0].pedidos) base[0].pedidos = [];
            base[0].pedidos.push(nuevoPedido);
            
            localStorage.setItem('lt_base_empresas', JSON.stringify(base));
            window.dispatchEvent(new Event('storage'));

            try {
                await fetch(`${BACKEND_URL}/api/pedidos`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(nuevoPedido)
                });
            } catch (e) {}

            showToast(`¡Envío solicitado por $${totalFinal}! PIN: ${nuevoPedido.codigoVerificacion}`);
            mostrarPedidosActivos();
        }

        // ==========================================
        // PANEL DE PEDIDOS CON PESTAÑAS Y COMPARTIR RECORRIDO
        // ==========================================
        let pestañaPedidosActual = 'activos';

        function mostrarPedidosActivos() {
            actualizarMenuActivo(3);
            renderizarListaPedidos();
        }

        function cambiarPestañaPedidos(pestania) {
            pestañaPedidosActual = pestania;
            renderizarListaPedidos();
        }

        function renderizarListaPedidos() {
            const container = document.getElementById('main-content');
            let base = JSON.parse(localStorage.getItem('lt_base_empresas')) || [];
            let sesion = JSON.parse(localStorage.getItem('lt_sesion_activa')) || {};
            let misPedidos = [];

            base.forEach(emp => {
                (emp.pedidos || []).forEach(p => {
                    if (!sesion.nombre || p.cliente === sesion.nombre || sesion.nombre === 'Cliente Montevideo') {
                        misPedidos.push({ ...p, empresaNombre: emp.nombre });
                    }
                });
            });

            misPedidos.sort((a, b) => b.id - a.id);

            let pedidosFiltrados = misPedidos.filter(p => {
                let st = (p.estado || 'Recibido').toLowerCase();
                let esFinalizado = st.includes('entregado') || st.includes('cancelado') || st.includes('cerrado');
                return pestañaPedidosActual === 'activos' ? !esFinalizado : esFinalizado;
            });

            let html = pedidosFiltrados.map(p => {
                let st = (p.estado || 'Recibido').toLowerCase();
                let claseBadge = 'estado-recibido';
                let textoEstado = p.estado;

                if (st.includes('preparación') || st.includes('proceso')) { claseBadge = 'estado-preparacion'; textoEstado = '👨‍🍳 En preparación'; }
                else if (st.includes('listo') || st.includes('retirar')) { claseBadge = 'estado-listo'; textoEstado = '📦 Listo para retiro'; }
                else if (st.includes('camino') || st.includes('ruta')) { claseBadge = 'estado-camino'; textoEstado = '🛵 En camino'; }
                else if (st.includes('entregado') || st.includes('cerrado')) { claseBadge = 'estado-entregado'; textoEstado = '✅ Entregado'; }
                else { textoEstado = '⏳ ' + p.estado; }

                let itemsTexto = (p.items || []).map(i => `${i.cantidad}x ${i.nombre}`).join(', ');
                let esCerrado = st.includes('entregado') || st.includes('cerrado');
                let seccionCalificacion = '';

                if (esCerrado && !p.calificadoCliente) {
                    seccionCalificacion = `
                        <div style="background:#F0FDF4; border:1px solid #BBF7D0; padding:14px; border-radius:var(--radius-md); margin-top:12px; text-align:center;">
                            <span style="font-size:13px; font-weight:800; color:#15803D; display:block; margin-bottom:8px;">😊 ¿Cómo estuvo tu experiencia?</span>
                            <div style="display:flex; justify-content:center; gap:8px;">
                                <button type="button" onclick="calificarPedido('${p.id}', 5)" style="width:auto; padding:8px 12px; font-size:14px; background:#059669; box-shadow:none;">🌟 Excelente</button>
                            </div>
                        </div>
                    `;
                }

                let seccionCompartir = '';
                if (!esCerrado) {
                    seccionCompartir = `
                        <button type="button" onclick="compartirRecorridoPedido('${p.id}')" style="background:#0284C7; font-size:12px; padding:10px; margin-top:10px; box-shadow:none;">🔗 Compartir Recorrido en Vivo</button>
                    `;
                }

                return `
                    <div class="comercio-card" style="display:block; border-left: 5px solid var(--primary); margin-bottom: 14px;">
                        <div style="display:flex; justify-content:space-between; margin-bottom:8px; align-items:center;">
                            <strong style="color:var(--text-main); font-size:14px; font-weight:900;">Pedido #${p.id.toString().slice(-4)}</strong>
                            <span class="badge-estado ${claseBadge}">${textoEstado}</span>
                        </div>
                        <p style="margin:4px 0; font-size:13px; color:var(--text-muted);">🏪 Origen/Local: <b>${p.empresaNombre}</b></p>
                        <p style="margin:4px 0; font-size:13px; color:var(--text-muted);">📍 ${p.descripcion ? '<b>' + p.descripcion + '</b>' : 'Destino: <b>' + p.direccion + '</b>'}</p>
                        <p style="margin:4px 0; font-size:13px; color:var(--text-muted);">📦 ${itemsTexto}</p>
                        <p style="margin:4px 0; font-size:13px; color:var(--text-muted);">💳 Total: <b>$${p.total}</b></p>
                        
                        ${seccionCompartir}

                        {!esCerrado ? `
                            <div style="background:#FFF7ED; padding:12px; border-radius:var(--radius-md); text-align:center; margin-top:12px; border: 1.5px solid #FDBA74;">
                                <span style="font-size:12px; color:#C2410C; font-weight:700;">🔑 PIN de seguridad para entregar al cadete:</span>
                                <div style="font-size:22px; font-weight:900; color:#C2410C; letter-spacing:2px; margin-top:4px;">${p.codigoVerificacion}</div>
                            </div>
                        ` : ''}

                        ${seccionCalificacion}
                    </div>
                `;
            }).join('') || `<p style="text-align:center; color:var(--text-muted); margin-top:40px;">No hay pedidos en esta sección.</p>`;

            if(container) {
                container.innerHTML = `
                    <button type="button" class="btn-volver-atras" onclick="mostrarHome()">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg> Volver al Inicio
                    </button>
                    <h3 style="color:var(--text-main); margin-top:0; font-size:20px; font-weight:900;">📦 Mis Pedidos y Seguimiento</h3>
                    
                    <div class="pestañas-pedidos">
                        <button type="button" class="tab-btn ${pestañaPedidosActual === 'activos' ? 'activo' : ''}" onclick="cambiarPestañaPedidos('activos')">Activos</button>
                        <button type="button" class="tab-btn ${pestañaPedidosActual === 'finalizados' ? 'activo' : ''}" onclick="cambiarPestañaPedidos('finalizados')">Finalizados</button>
                    </div>

                    <div id="contenedor-cards-pedidos">${html}</div>
                `;
            }
        }

        function compartirRecorridoPedido(id) {
            let urlCompartir = `https://lotengo.uy/seguimiento?pedido=${id}`;
            if (navigator.clipboard) {
                navigator.clipboard.writeText(urlCompartir);
                showToast("¡Enlace de seguimiento copiado al portapapeles!");
            } else {
                prompt("Copiá el link de seguimiento:", urlCompartir);
            }
        }

        window.calificarPedido = function(idPedido, valor) {
            let base = JSON.parse(localStorage.getItem('lt_base_empresas')) || [];
            base.forEach(emp => {
                if (emp.pedidos) {
                    emp.pedidos.forEach(p => {
                        if (String(p.id).trim() === String(idPedido).trim()) {
                            p.calificadoCliente = true;
                            p.estrellasCliente = valor;
                        }
                    });
                }
            });
            localStorage.setItem('lt_base_empresas', JSON.stringify(base));
            window.dispatchEvent(new Event('storage'));
            showToast("¡Gracias por tu calificación!");
            renderizarListaPedidos();
        };

        // ==========================================
        // MÓDULO "MI PERFIL"
        // ==========================================
        function mostrarMiPerfil() {
            actualizarMenuActivo(4);
            let sesion = JSON.parse(localStorage.getItem('lt_sesion_activa')) || {};
            const container = document.getElementById('main-content');

            let tarjetasHtml = (sesion.tarjetas || []).map(t => `
                <div style="background:#F9FAFB; padding:10px 14px; border-radius:8px; border:1.5px solid var(--card-border); margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; font-size:13px;">
                    <span>💳 <b>${t.banco}</b> (${t.enmascarada})</span>
                </div>
            `).join('') || '<p style="font-size:12px; color:var(--text-muted);">No hay tarjetas asociadas.</p>';

            container.innerHTML = `
                <button type="button" class="btn-volver-atras" onclick="mostrarHome()">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg> Volver al Inicio
                </button>
                <div style="text-align:center; margin-bottom:20px;">
                    <div style="width:70px; height:70px; background:var(--primary-gradient); color:#FFF; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:28px; font-weight:900; margin:0 auto 10px auto;">${(sesion.nombre || 'U')[0]}</div>
                    <h3 style="margin:0; font-size:18px; font-weight:900;">${sesion.nombre || 'Usuario'}</h3>
                    <p style="margin:4px 0 0 0; font-size:12px; color:var(--text-muted);">${sesion.telefono || 'Sin teléfono'}</p>
                </div>

                <label>Nombre Completo:</label>
                <input type="text" id="perfilNombre" value="${sesion.nombre || ''}">

                <label>Correo Electrónico:</label>
                <input type="email" id="perfilEmail" value="${sesion.email || ''}">

                <label>Dirección:</label>
                <input type="text" id="perfilDireccion" value="${sesion.direccion || ''}">

                <label>Nueva Contraseña (Opcional):</label>
                <input type="password" id="perfilPassword" placeholder="Dejar en blanco para mantener actual">

                <h4 style="margin:16px 0 8px 0; font-size:15px; font-weight:900;">Tarjetas Seguras Asociadas</h4>
                ${tarjetasHtml}
                <button type="button" onclick="agregarTarjetaPerfil()" style="background:#4B5563; font-size:12px; padding:10px; margin-bottom:16px; box-shadow:none;">➕ Agregar Tarjeta</button>

                <button type="button" onclick="guardarPerfilCliente()" style="background:var(--success); font-weight:800; margin-bottom:10px;">Guardar Cambios</button>
                <button type="button" onclick="cerrarSesionUniversal()" style="background:#EF4444; font-weight:800;">Cerrar Sesión</button>
            `;
        }

        function agregarTarjetaPerfil() {
            let banco = prompt("Ingresá el banco emisor (Ej: Itau, BROU, Santander):");
            let numero = prompt("Ingresá los 16 números de tu tarjeta:");
            if (!banco || !numero || numero.length < 4) { showToast("Datos de tarjeta inválidos.", "error"); return; }
            
            let sesion = JSON.parse(localStorage.getItem('lt_sesion_activa')) || {};
            if (!sesion.tarjetas) sesion.tarjetas = [];
            
            let ultimos4 = numero.slice(-4);
            sesion.tarjetas.push({ id: Date.now(), banco, enmascarada: `•••• •••• •••• ${ultimos4}` });
            localStorage.setItem('lt_sesion_activa', JSON.stringify(sesion));
            showToast("¡Tarjeta agregada de forma segura!");
            mostrarMiPerfil();
        }

        function guardarPerfilCliente() {
            let nombre = document.getElementById('perfilNombre').value.trim();
            let email = document.getElementById('perfilEmail').value.trim();
            let direccion = document.getElementById('perfilDireccion').value.trim();
            let pass = document.getElementById('perfilPassword').value.trim();

            let sesion = JSON.parse(localStorage.getItem('lt_sesion_activa')) || {};
            sesion.nombre = nombre;
            sesion.email = email;
            sesion.direccion = direccion;
            if (pass) sesion.password = pass;

            localStorage.setItem('lt_sesion_activa', JSON.stringify(sesion));
            showToast("¡Perfil actualizado con éxito!");
            mostrarMiPerfil();
        }

        function cerrarSesionUniversal() {
            localStorage.removeItem('lt_sesion_activa');
            showToast("Sesión cerrada correctamente.");
            setTimeout(() => location.reload(), 800);
        }

        function actualizarMenuActivo(index) {
            document.querySelectorAll('.bottom-nav .nav-item').forEach((btn, idx) => {
                btn.classList.toggle('active', idx === index);
            });
        }
    </script>
</body>
</html>
