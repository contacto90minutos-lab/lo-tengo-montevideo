<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Leaflet Map CSS y JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LO TENGO - Clientes</title>
    <!-- Cliente Socket.io para tiempo real -->
    <script src="https://sdk.mercadopago.com/js/v2"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        :root {
            --primary: #FF5722;
            --primary-gradient: linear-gradient(135deg, #FF5722, #FF7043);
            --outlet-gradient: linear-gradient(135deg, #7C3AED, #EC4899);
            --success: #10B981;
            --danger: #DC2626;
            --warning: #F59E0B;
            --bg-body: #F3F4F6;
            --card-bg: #FFFFFF;
            --card-border: #E5E7EB;
            --text-main: #111827;
            --text-muted: #6B7280;
            --radius-lg: 20px;
            --radius-md: 14px;
            --shadow-subtle: 0 4px 20px rgba(0, 0, 0, 0.05);
            --shadow-outlet: 0 10px 25px rgba(124, 58, 237, 0.25);
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-body);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-main);
            overflow-x: hidden;
        }

        #toast-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 90%;
            max-width: 400px;
            pointer-events: none;
        }
        .toast-msg {
            background: #111827;
            color: #FFF;
            padding: 14px 18px;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 700;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            gap: 12px;
            animation: fadeInOut 3s ease forwards;
            pointer-events: auto;
        }
        .toast-msg.success { background: #059669; }
        .toast-msg.error { background: #DC2626; }
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateY(-10px); }
            15% { opacity: 1; transform: translateY(0); }
            85% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-10px); }
        }

        #splash-screen {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #111827;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .splash-logo-container {
            display: flex; align-items: center; gap: 12px;
            animation: logoScale 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .splash-isologo {
            width: 54px; height: 54px;
            background: var(--primary-gradient);
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            color: #FFFFFF; font-weight: 900; font-size: 26px; letter-spacing: -1px;
            box-shadow: 0 10px 25px rgba(255, 87, 34, 0.4);
        }

        .splash-texto { color: #FFFFFF; font-size: 28px; font-weight: 900; letter-spacing: -1px; }
        .splash-sub { color: #9CA3AF; font-size: 11px; font-weight: 700; letter-spacing: 2px; margin-top: 14px; text-transform: uppercase; }

        @keyframes logoScale {
            0% { opacity: 0; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }

        #app-container {
            background: #FFFFFF;
            width: 100%; max-width: 480px; min-height: 100vh;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            box-sizing: border-box;
            display: flex; flex-direction: column; position: relative;
            border-left: 1px solid var(--card-border);
            border-right: 1px solid var(--card-border);
        }

        .header-app {
            background: #FFFFFF; color: var(--text-main); padding: 18px 24px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--card-border);
            position: sticky; top: 0; z-index: 10;
        }

        .header-app h1 { margin: 0; font-size: 20px; font-weight: 900; letter-spacing: -0.5px; display: flex; align-items: center; gap: 8px; }

        .brand-badge {
            background: var(--primary-gradient); color: #fff;
            width: 28px; height: 28px; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 13px; font-weight: 900;
        }

        .content-body { padding: 20px; flex: 1; overflow-y: auto; padding-bottom: 110px; }

        label { font-size: 13px; font-weight: 700; color: var(--text-muted); display: block; margin-bottom: 6px; }

        input, select, textarea {
            width: 100%; padding: 14px 16px; margin: 0 0 16px 0;
            border: 1.5px solid var(--card-border); border-radius: var(--radius-md);
            box-sizing: border-box; font-size: 15px; background: #F9FAFB; color: var(--text-main); font-family: inherit;
        }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); background: #FFFFFF; box-shadow: 0 0 0 4px rgba(255, 87, 34, 0.1); }

        button {
            width: 100%; padding: 15px; background: var(--primary-gradient); color: white;
            border: none; border-radius: var(--radius-md); font-weight: 800; cursor: pointer; font-size: 15px;
            box-shadow: 0 4px 14px rgba(255, 87, 34, 0.3); transition: all 0.2s;
        }
        button:hover { opacity: 0.95; transform: translateY(-1px); }

        .link-btn { background: none; color: var(--primary); border: none; text-decoration: underline; cursor: pointer; margin-top: 8px; font-size: 13px; font-weight: 600; box-shadow: none; }
        
        .btn-volver-atras {
            display: inline-flex; align-items: center; gap: 8px;
            background: #FFFFFF; color: var(--text-main); border: 1.5px solid var(--card-border);
            padding: 10px 16px; font-size: 13px; font-weight: 700; border-radius: var(--radius-md);
            cursor: pointer; width: auto; box-shadow: var(--shadow-subtle); margin-bottom: 16px; transition: all 0.2s;
        }
        .btn-volver-atras:hover { background: #F3F4F6; border-color: var(--text-muted); transform: translateY(-1px); }

        .search-container { background: #F9FAFB; padding: 12px 18px; border-radius: var(--radius-md); display: flex; align-items: center; gap: 12px; margin-bottom: 20px; border: 1.5px solid var(--card-border); }
        .search-container input { border: none; background: transparent; margin: 0; padding: 0; outline: none; font-size: 15px; color: var(--text-main); }

        .categorias-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 22px; }
        .cat-card { background: var(--card-bg); border: 1.5px solid var(--card-border); border-radius: var(--radius-md); padding: 12px 4px; text-align: center; cursor: pointer; box-shadow: var(--shadow-subtle); transition: all 0.2s; }
        .cat-card:hover { transform: translateY(-2px); border-color: var(--primary); }
        .cat-card.outlet-cat { border-color: #C084FC; background: linear-gradient(135deg, #FAF5FF, #F3E8FF); }

        .outlet-banner { background: var(--outlet-gradient); color: white; padding: 22px; border-radius: var(--radius-lg); margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; box-shadow: var(--shadow-outlet); cursor: pointer; }
        .section-title { font-size: 17px; font-weight: 900; color: var(--text-main); margin: 0 0 16px 0; display: flex; align-items: center; justify-content: space-between; }

        .vehiculo-selector-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
        .vehiculo-card-opcion { background: #F9FAFB; border: 2px solid var(--card-border); border-radius: var(--radius-md); padding: 16px; text-align: center; cursor: pointer; transition: all 0.2s; }
        .vehiculo-card-opcion.seleccionado { border-color: var(--primary); background: rgba(255, 87, 34, 0.05); box-shadow: 0 0 0 4px rgba(255, 87, 34, 0.1); }

        .comercio-card { background: var(--card-bg); border: 1.5px solid var(--card-border); border-radius: var(--radius-lg); padding: 16px; margin-bottom: 14px; display: flex; align-items: center; gap: 16px; box-shadow: var(--shadow-subtle); }
        .comercio-avatar { width: 75px; height: 75px; border-radius: var(--radius-md); object-fit: cover; background: #E5E7EB; flex-shrink: 0; }

        .badge-estado { padding: 6px 12px; border-radius: 8px; font-size: 11px; font-weight: 800; display: inline-block; }
        .estado-recibido { background: #E0F2FE; color: #0369A1; }
        .estado-preparacion { background: #FFEDD5; color: #C2410C; }
        .estado-listo { background: #FEF3C7; color: #B45309; }
        .estado-camino { background: #DBEAFE; color: #1D4ED8; animation: pulse 1.5s infinite; }
        .estado-entregado { background: #D1FAE5; color: #047857; }
        .estado-cancelado { background: #FEE2E2; color: #B91C1C; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        .btn-propina-opcion { padding: 8px; font-size: 12px; font-weight: 700; border-radius: 8px; border: 1.5px solid var(--card-border); background: #E5E7EB; color: var(--text-main); cursor: pointer; box-shadow: none; transition: all 0.2s; }
        .btn-propina-opcion.activo { background: var(--primary); color: #fff; border-color: var(--primary); }

        .bottom-nav { position: absolute; bottom: 0; left: 0; width: 100%; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-top: 1px solid var(--card-border); display: flex; justify-content: space-around; padding: 12px 0; z-index: 10; }
        .nav-item { background: none; border: none; color: var(--text-muted); font-size: 11px; cursor: pointer; display: flex; flex-direction: column; align-items: center; font-weight: 600; }
        .nav-item svg { width: 22px; height: 22px; margin-bottom: 4px; fill: currentColor; }
        .nav-item.active { color: var(--primary); font-weight: 800; }
    </style>
</head>
<body>

    <div id="toast-container"></div>

    <div id="splash-screen">
        <div class="splash-logo-container">
            <div class="splash-isologo">L+T</div>
            <div class="splash-texto">LO TENGO</div>
        </div>
        <div class="splash-sub">Ecosistema Logístico</div>
    </div>

    <div id="app-container">
        <div class="header-app">
            <h1><div class="brand-badge">L+T</div><span style="color: var(--primary);">LO</span> TENGO</h1>
            <span id="header-user-info" style="font-size: 12px; font-weight: 700; background: #F3F4F6; padding: 6px 12px; border-radius: 20px; border: 1px solid var(--card-border);">📍 Montevideo</span>
        </div>
        
        <div class="content-body" id="main-content">
            <!-- Pantalla Login -->
            <div id="screen-login">
                <h3 style="color: var(--text-main); margin-top: 0; font-size: 22px; font-weight: 900;">Iniciar Sesión</h3>
                <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 24px;">Ingresá a tu cuenta para pedir en Montevideo.</p>
                
                <button type="button" onclick="loginConGoogle()" style="background: #FFFFFF; color: #374151; border: 1.5px solid var(--card-border); margin-bottom: 16px; display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 700; box-shadow: var(--shadow-subtle);">
                    <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.19v3.15C3.17 21.32 7.23 24 12 24z"/><path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.19C.43 8.12 0 9.87 0 11.7s.43 3.58 1.19 5.12l4.09-2.55z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.23 0 3.17 2.68 1.19 6.58l4.09 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/></svg>
                    Continuar con Google
                </button>

                <label>Número de WhatsApp:</label>
                <input type="tel" id="loginTelefono" placeholder="Ej: 099123456">

                <label>Contraseña:</label>
                <input type="password" id="loginPassword" placeholder="Tu contraseña">

                <button id="btnIniciarSesion" type="button">Ingresar al Sistema</button>
                
                <div style="text-align: center; margin-top: 20px;">
                    <button id="irARegistro" type="button" class="link-btn" style="font-size:14px; text-decoration:underline;">¿No tenés cuenta? Registrate acá</button>
                </div>
            </div>

            <!-- Pantalla Registro -->
            <div id="screen-registro" style="display: none;">
                <button type="button" class="btn-volver-atras" onclick="irLogin()">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg> Volver al login
                </button>
                <h3 style="color: var(--text-main); margin-top: 0; font-size: 22px; font-weight: 900;">Crear Cuenta</h3>
                <label>Nombre y Apellido:</label>
                <input type="text" id="regNombre" placeholder="Tu nombre">
                <label>WhatsApp:</label>
                <input type="tel" id="regTelefono" placeholder="Ej: 099123456">
                <label>Foto de Perfil:</label>
                <input type="file" id="regFotoInput" accept="image/*" onchange="procesarYComprimirFoto(event)">
                <input type="hidden" id="regFotoBase64">
                <div id="previewFotoContainer" style="display:none; text-align:center; margin-bottom:12px;">
                    <img id="previewFotoImg" style="width:80px; height:80px; border-radius:50%; object-fit:cover; border:2px solid var(--primary);">
                </div>
                <label>Dirección principal en Montevideo:</label>
                <input type="text" id="regDireccion" placeholder="Calle, número y barrio">
                <label>Contraseña:</label>
                <input type="password" id="regPassword" placeholder="Contraseña segura">
                <button type="button" onclick="completarRegistroCliente()" style="background: var(--success); margin-top: 10px;">Completar Registro</button>
            </div>
        </div>

        <div class="bottom-nav" id="bottom-nav" style="display: none;">
            <button class="nav-item active" onclick="mostrarHome()">
                <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>Inicio
            </button>
            <button class="nav-item" onclick="mostrarZonaOutlet()">
                <svg viewBox="0 0 24 24"><path d="M21.41 11.58l-9-9C12.05 2.22 11.55 2 11 2H4c-1.1 0-2 .9-2 2v7c0 .55.22 1.05.59 1.42l9 9c.36.36.86.58 1.41.58.55 0 1.05-.22 1.41-.59l7-7c.37-.36.59-.86.59-1.41 0-.55-.23-1.06-.59-1.42zM5.5 7C4.67 7 4 6.33 4 5.5S4.67 4 5.5 4 7 4.67 7 5.5 6.33 7 5.5 7z"/></svg>Outlet
            </button>
            <button class="nav-item" onclick="mostrarFormularioCadeteria()">
                <svg viewBox="0 0 24 24"><path d="M19 7h-3V5.5C16 4.12 14.88 3 13.5 3h-3C9.12 3 8 4.12 8 5.5V7H5c-1.1 0-2 .9-2 2v9c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V9c0-1.1-.9-2-2-2zm-9-1.5c0-.28.22-.5.5-.5h3c.28 0 .5.22.5.5V7H10V5.5zm9 12.5H5V9h14v9z"/></svg>Cadetería
            </button>
            <button class="nav-item" onclick="mostrarPedidosActivos()">
                <svg viewBox="0 0 24 24"><path d="M20 6h-4V4c0-1.1-.9-2-2-2h-4c-1.1 0-2 .9-2 2v2H4c-1.1 0-2 .9-2 2v11c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zM10 4h4v2h-4V4zm10 15H4V8h16v11z"/></svg>Pedidos
            </button>
            <button class="nav-item" onclick="mostrarPerfilCliente()">
                <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>Perfil
            </button>
        </div>
    </div>

    <script>
        const BACKEND_URL = "https://lo-tengo-montevideo.onrender.com";
        let socket = null;

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = `toast-msg ${type}`;
            toast.innerHTML = `<span>${type === 'success' ? '✅' : '⚠️'}</span> <span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => { toast.remove(); }, 3500);
        }

        document.addEventListener("DOMContentLoaded", () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                if (splash) {
                    splash.style.opacity = '0';
                    splash.style.visibility = 'hidden';
                }
            }, 1200);

            inicializarSocketIO();
            verificarSesionCliente();
            configurarEventosLogin();
            inicializarDatosDemoSiEsNecesario();
            sincronizarPedidosDesdeServidor();

            window.addEventListener('storage', () => {
                if (document.getElementById('contenedor-cards-pedidos')) {
                    renderizarListaPedidos();
                }
            });

            setInterval(() => {
                sincronizarPedidosDesdeServidor();
                if (document.getElementById('contenedor-cards-pedidos')) {
                    renderizarListaPedidos();
                }
            }, 3000);
        });

        function inicializarSocketIO() {
            socket = io(BACKEND_URL);
            socket.on('connect', () => {
                console.log("⚡ Cliente conectado al WebSocket LO TENGO");
            });

            socket.on('actualizacion_pedido', (data) => {
                sincronizarPedidosDesdeServidor();
                if (document.getElementById('contenedor-cards-pedidos')) {
                    renderizarListaPedidos();
                }
            });
        }

        function procesarYComprimirFoto(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX = 400;
                    let w = img.width, h = img.height;
                    if (w > h) { if (w > MAX) { h *= MAX / w; w = MAX; } }
                    else { if (h > MAX) { w *= MAX / h; h = MAX; } }
                    canvas.width = w; canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, w, h);

                    const b64 = canvas.toDataURL('image/jpeg', 0.7);
                    document.getElementById('regFotoBase64').value = b64;
                    document.getElementById('previewFotoImg').src = b64;
                    document.getElementById('previewFotoContainer').style.display = 'block';
                    showToast("Foto optimizada correctamente");
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        async function sincronizarPedidosDesdeServidor() {
            try {
                let response = await fetch(`${BACKEND_URL}/api/pedidos`);
                if (response.ok) {
                    let remotos = await response.json();
                    if (remotos && Array.isArray(remotos)) {
                        let base = JSON.parse(localStorage.getItem('lt_base_empresas')) || [];
                        if (base.length > 0) {
                            let mapa = new Map();
                            (base[0].pedidos || []).forEach(p => mapa.set(String(p.id).trim(), p));
                            remotos.forEach(r => mapa.set(String(r.id).trim(), r));
                            base[0].pedidos = Array.from(mapa.values());
                            localStorage.setItem('lt_base_empresas', JSON.stringify(base));
                        }
                    }
                }
            } catch(e) {}
        }

        function inicializarDatosDemoSiEsNecesario() {
            let base = JSON.parse(localStorage.getItem('lt_base_empresas')) || [];
            if (base.length === 0) {
                base = [{
                    nombre: "Lo Tengo Central Montevideo",
                    rut: "219999990012",
                    telefono: "099000000",
                    direccion: "Av. 18 de Julio 1300",
                    giro: "Gastronomía",
                    pedidos: [],
                    productos: [
                        { id: 1, nombre: "Chivito al Plato Clásico", precio: 480, imagen: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=400&q=80", outlet: false },
                        { id: 2, nombre: "Empanadas de Carne (Docena)", precio: 520, imagen: "https://images.unsplash.com/photo-1608897013039-887f21d8c804?auto=format&fit=crop&w=400&q=80", outlet: true }
                    ]
                }];
                localStorage.setItem('lt_base_empresas', JSON.stringify(base));
            }
        }

        function verificarSesionCliente() {
            const sesion = localStorage.getItem('lt_sesion_activa');
            if (sesion) {
                try {
                    const usuario = JSON.parse(sesion);
                    document.getElementById('header-user-info').innerText = `📍 ${usuario.direccion || 'Montevideo'}`;
                    document.getElementById('bottom-nav').style.display = 'flex';
                    mostrarHome();
                } catch (e) {}
            }
        }

        function configurarEventosLogin() {
            const btnReg = document.getElementById('irARegistro');
            if (btnReg) {
                btnReg.onclick = () => {
                    document.getElementById('screen-login').style.display = 'none';
                    document.getElementById('screen-registro').style.display = 'block';
                };
            }

            const btnIng = document.getElementById('btnIniciarSesion');
            if (btnIng) {
                btnIng.onclick = async () => {
                    const tel = document.getElementById('loginTelefono').value.trim();
                    const pass = document.getElementById('loginPassword').value.trim();
                    let usuarios = JSON.parse(localStorage.getItem('lt_base_usuarios')) || [];
                    let usr = usuarios.find(u => String(u.telefono).trim() === tel && String(u.password || '').trim() === pass);

                    if (!usr && tel === "099123456" && pass === "1234") {
                        usr = { nombre: "Cliente Demo Montevideo", telefono: "099123456", direccion: "Pocitos, Montevideo", password: "1234" };
                        usuarios.push(usr);
                        localStorage.setItem('lt_base_usuarios', JSON.stringify(usuarios));

        function setPropina(m, precioProd) {
            document.getElementById('inputPropina').value = m;
            document.querySelectorAll('.btn-propina-opcion').forEach(btn => btn.classList.remove('activo'));
            let btnActivo = document.getElementById(`btn-prop-${m}`);
            if (btnActivo) btnActivo.classList.add('activo');
            actualizarTotal(precioProd);
        }

        function actualizarTotal(precioProd) {
            let propina = Number(document.getElementById('inputPropina').value) || 0;
            let subtotal = precioProd + 90 + propina;
            let recargoMP = subtotal * 0.07;
            let totalFinal = subtotal + recargoMP;

            document.getElementById('lblRecargoMP').innerText = `$${recargoMP.toFixed(2)}`;
            document.getElementById('lblTotal').innerText = `$${totalFinal.toFixed(2)}`;
        }

        async function confirmarPedidoCompra(rut, productoId) {
            let dir = document.getElementById('dirEntregaFinal').value;
            let propina = Number(document.getElementById('inputPropina').value) || 0;
            let base = JSON.parse(localStorage.getItem('lt_base_empresas')) || [];
            let emp = base.find(e => String(e.rut).trim() === String(rut).trim());
            let p = emp.productos.find(prod => Number(prod.id) === Number(productoId));
            let sesion = JSON.parse(localStorage.getItem('lt_sesion_activa')) || {};
            
            let subtotal = p.precio + 90 + propina;
            let recargoMP = subtotal * 0.07;
            let totalFinal = Math.round((subtotal + recargoMP) * 100) / 100;
            let pinGenerado = Math.floor(1000 + Math.random() * 9000).toString();

            let nuevoPedido = {
                id: Date.now(),
                rutComercio: rut,
                cliente: sesion.nombre || 'Cliente Montevideo',
                telefonoCliente: sesion.telefono || '099000000',
                direccion: dir,
                valorProducto: p.precio,
                valorEnvio: 90,
                propina: propina,
                total: totalFinal,
                estado: emp.giro === 'Gastronomía' ? 'Recibido' : 'Recibido - Preparación',
                items: [
                    { nombre: p.nombre, precio: p.precio, cantidad: 1 },
                    { nombre: 'Costo de Envío', precio: 90, cantidad: 1 },
                    ...(propina > 0 ? [{ nombre: 'Propina Cadete', precio: propina, cantidad: 1 }] : []),
                    { nombre: 'Recargo Pasarela MP (7%)', precio: Math.round(recargoMP * 100) / 100, cantidad: 1 }
                ],
                pinSeguridad: pinGenerado,
                codigoVerificacion: pinGenerado
            };

            // Guardar localmente y sincronizar pedidos activos
            let pedidosActivos = JSON.parse(localStorage.getItem('lt_pedidos_activos')) || [];
            pedidosActivos.push(nuevoPedido);
            localStorage.setItem('lt_pedidos_activos', JSON.stringify(pedidosActivos));

            if (!emp.pedidos) emp.pedidos = [];
            emp.pedidos.push(nuevoPedido);
            localStorage.setItem('lt_base_empresas', JSON.stringify(base));
            window.dispatchEvent(new Event('storage'));

            try {
                await fetch(`${BACKEND_URL}/api/pedidos`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(nuevoPedido)
                });
            } catch (e) {}

            showToast(`¡Pedido creado con éxito! PIN: ${pinGenerado}`);
            mostrarPedidosActivos();
        }

                dest.disabled = false;
            }
            actualizarCalculoConMapa();
        }

        function obtenerUbicacionGPSOrigen() {
            if (navigator.geolocation) {
                showToast("Obteniendo GPS...");
                navigator.geolocation.getCurrentPosition((pos) => {
                    let lat = pos.coords.latitude;
                    let lon = pos.coords.longitude;
                    document.getElementById('cadOrigen').value = `GPS (${lat.toFixed(4)}, ${lon.toFixed(4)})`;
                    
                    if (mapaExpress) {
                        if (markerOrigen) mapaExpress.removeLayer(markerOrigen);
                        markerOrigen = L.marker([lat, lon]).addTo(mapaExpress).bindPopup("Origen (Retiro)").openPopup();
                        mapaExpress.setView([lat, lon], 14);
                    }
                    actualizarCalculoConMapa();
                    showToast("Ubicación GPS establecida");
                }, () => showToast("GPS no disponible", "error"));
            }
        }

        function actualizarCalculoConMapa() {
            let origen = document.getElementById('cadOrigen').value.trim();
            let destino = document.getElementById('cadDestino').value.trim();
            let panel = document.getElementById('panel-tarifa-cadete');
            let propina = Number(document.getElementById('inputPropinaCadete').value) || 0;

            if (!origen || !destino) {
                if (panel) panel.innerHTML = `📍 Completá origen y destino para calcular la distancia y tarifa.`;
                return;
            }

            let distanciaKm = 5; 
            if (origen.toLowerCase().includes('pocitos') && destino.toLowerCase().includes('carrasco')) distanciaKm = 9;
            else if (origen.toLowerCase().includes('centro') && destino.toLowerCase().includes('tres cruces')) distanciaKm = 3;
            else if (origen.length > 15 && destino.length > 15) distanciaKm = 6;

            let tarifaBase = tipoVehiculoCadete === 'moto' ? 290 : 550;
            let kmIncluidos = tipoVehiculoCadete === 'moto' ? 8 : 10;
            let costoAdicionalKm = 0;

            if (distanciaKm > kmIncluidos) {
                let kmExtras = distanciaKm - kmIncluidos;
                costoAdicionalKm = kmExtras * 20;
            }

            let subtotal = tarifaBase + costoAdicionalKm + propina;
            let recargoMP = subtotal * 0.07;
            let tarifaTotalFinal = Math.round((subtotal + recargoMP) * 100) / 100;

            if (panel) {
                panel.innerHTML = `
                    <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
                        <span>Distancia estimada:</span>
                        <b>~${distanciaKm} km (${kmIncluidos} km incluidos)</b>
                    </div>
                    <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
                        <span>Tarifa Base (${tipoVehiculoCadete}):</span>
                        <b>$${tarifaBase}</b>
                    </div>
                    ${costoAdicionalKm > 0 ? `<div style="display:flex; justify-content:space-between; margin-bottom:4px; color:var(--warning);"><span>Adicional por km extra:</span><b>+$${costoAdicionalKm}</b></div>` : ''}
                    <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
                        <span>Propina cadete:</span>
                        <b>$${propina}</b>
                    </div>
                    <div style="display:flex; justify-content:space-between; margin-bottom:4px; color:var(--text-muted); font-size:12px;">
                        <span>Recargo Pasarela MP (7%):</span>
                        <span>$${recargoMP.toFixed(2)}</span>
                    </div>
                    <div style="display:flex; justify-content:space-between; font-size:14px; font-weight:900; color:var(--success); border-top:1px solid var(--card-border); padding-top:6px; margin-top:6px;">
                        <span>Total a abonar:</span>
                        <span>$${tarifaTotalFinal}</span>
                    </div>
                `;
            }
        }

        async function solicitarCadeteriaExpressFinal() {
            let origen = document.getElementById('cadOrigen').value.trim();
            let destino = document.getElementById('cadDestino').value.trim();
            let nomRecibe = document.getElementById('destinatarioNombre').value.trim();
            let telRecibe = document.getElementById('destinatarioTelefono').value.trim();
            let desc = document.getElementById('cadDescripcion').value.trim();
            let propina = Number(document.getElementById('inputPropinaCadete').value) || 0;
            let sesion = JSON.parse(localStorage.getItem('lt_sesion_activa')) || {};

            if (!origen || !destino || !nomRecibe || !telRecibe) {
                showToast("Completá origen, destino y datos de quien recibe", "error");
                return;
            }

            let tarifaBase = tipoVehiculoCadete === 'moto' ? 290 : 550;
            let kmIncluidos = tipoVehiculoCadete === 'moto' ? 8 : 10;
            let distanciaKm = 5;
            let costoAdicionalKm = distanciaKm > kmIncluidos ? (distanciaKm - kmIncluidos) * 20 : 0;
            let subtotal = tarifaBase + costoAdicionalKm + propina;
            let recargoMP = subtotal * 0.07;
            let totalFinal = Math.round((subtotal + recargoMP) * 100) / 100;
            let pinGenerado = Math.floor(1000 + Math.random() * 9000).toString();

            let nuevoPedido = {
                id: Date.now(),
                empresaNombre: `Cadeteria Express (${tipoVehiculoCadete.toUpperCase()})`,
                cliente: sesion.nombre || 'Cliente Montevideo',
                telefonoCliente: sesion.telefono || '099000000',
                direccion: `Origen: ${origen} ➔ Destino: ${destino}`,
                descripcion: desc || 'Encomienda / Paquete Express',
                destinatario: nomRecibe,
                telefonoDestinatario: telRecibe,
                total: totalFinal,
                estado: 'Recibido - En espera de cadete',
                pinSeguridad: pinGenerado
            };

            let pedidosActivos = JSON.parse(localStorage.getItem('lt_pedidos_activos')) || [];
            pedidosActivos.push(nuevoPedido);
            localStorage.setItem('lt_pedidos_activos', JSON.stringify(pedidosActivos));
            window.dispatchEvent(new Event('storage'));

            try {
                await fetch(`${BACKEND_URL}/api/pedidos`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(nuevoPedido)
                });
            } catch (e) {}

            showToast(`¡Envío Express solicitado! PIN: ${pinGenerado}`);
            mostrarPedidosActivos();
        }

        function mostrarPedidosActivos() {
            actualizarMenuActivo(3);
            let pedidos = JSON.parse(localStorage.getItem('lt_pedidos_activos')) || [];

            let contenidoHTML = pedidos.map(p => {
                let st = p.estado || '';
                let claseBadge = 'estado-recibido';
                if (st.includes('Preparación')) claseBadge = 'estado-preparacion';
                else if (st.includes('camino')) claseBadge = 'estado-camino';
                else if (st.includes('Entregado')) claseBadge = 'estado-entregado';
                else if (st.includes('Cancelado')) claseBadge = 'estado-cancelado';

                let itemsTexto = p.items ? p.items.map(i => i.nombre).join(', ') : (p.descripcion || 'Encomienda Express');
                let esFinalizado = st.toLowerCase().includes('entregado') || st.toLowerCase().includes('cancelado');
                let puedeCancelar = !esFinalizado && (st.toLowerCase().includes('recibido') || st.toLowerCase().includes('pendiente'));

                return `
                <div class="comercio-card" style="display:block; border-left: 5px solid ${st.includes('Cancelado') ? 'var(--danger)' : 'var(--primary)'}; margin-bottom: 14px;">
                    <div style="display:flex; justify-content:space-between; margin-bottom:8px; align-items:center;">
                        <strong style="color:var(--text-main); font-size:14px; font-weight:900;">Pedido #${p.id ? p.id.toString().slice(-4) : '0000'}</strong>
                        <span class="badge-estado ${claseBadge}">${st}</span>
                    </div>
                    <p style="margin:4px 0; font-size:13px; color:var(--text-muted);">🏪 Servicio: <b>${p.empresaNombre || 'LO TENGO'}</b></p>
                    <p style="margin:4px 0; font-size:13px; color:var(--text-muted);">📍 Destino: <b>${p.direccion || ''}</b></p>
                    <p style="margin:4px 0; font-size:13px; color:var(--text-muted);">📦 ${itemsTexto}</p>
                    <p style="margin:4px 0; font-size:13px; color:var(--text-muted);">💳 Total: <b>$${p.total || 0}</b></p>

                    ${!esFinalizado && p.pinSeguridad ? `
                        <div style="background:#FFF7ED; padding:12px; border-radius:var(--radius-md); text-align:center; margin-top:12px; border: 1.5px solid #FDBA74;">
                            <span style="font-size:12px; color:#C2410C; font-weight:700;">🔑 PIN de seguridad (Entregá al cadete):</span>
                            <div style="font-size:22px; font-weight:900; color:#C2410C; letter-spacing:2px; margin-top:4px;">${p.pinSeguridad}</div>
                        </div>
                    ` : ''}

                    ${puedeCancelar ? `
                        <div style="margin-top:12px; border-top:1px dashed var(--card-border); padding-top:10px; text-align:right;">
                            <button type="button" onclick="mostrarModalCancelarPedido('${p.id}')" style="background:var(--danger); font-size:12px; padding:10px 14px; width:auto; display:inline-block; box-shadow:none;">❌ Cancelar Pedido</button>
                        </div>
                    ` : ''}
                </div>
                `;
            }).join('') || '<p style="text-align:center; color:var(--text-muted); margin-top:40px;">No hay pedidos activos.</p>';

            const container = document.getElementById('main-content');
            if (container) {
                container.innerHTML = `
                    <button type="button" class="btn-volver-atras" onclick="mostrarHome()">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg> Volver al Inicio
                    </button>
                    <h3 style="color:var(--text-main); margin-top:0; font-size:20px; font-weight:900;">📦 Mis Pedidos y Seguimiento</h3>
                    <div id="contenedor-cards-pedidos">${contenidoHTML}</div>
                `;
            }
        }

        window.mostrarModalCancelarPedido = function(idPedido) {
            let razones = [
                "Demora excesiva del cadete o local",
                "Me equivoqué de dirección o artículos",
                "Ya no necesito el pedido",
                "Problema con el medio de pago",
                "Otro motivo"
            ];
            let sel = prompt("Seleccioná la razón de cancelación:\n\n1. Demora excesiva del cadete o local\n2. Me equivoqué de dirección o artículos\n3. Ya no necesito el pedido\n4. Problema con el medio de pago\n5. Otro motivo", "1");
            if (sel !== null) {
                let motivo = razones[Number(sel) - 1] || "Cancelado por el cliente";
                cancelarPedidoClientePorMotivo(idPedido, motivo);
            }
        };

        window.cancelarPedidoClientePorMotivo = function(idPedido, motivo) {
            let pedidos = JSON.parse(localStorage.getItem('lt_pedidos_activos')) || [];
            pedidos.forEach(p => {
                if (String(p.id).trim() === String(idPedido).trim()) {
                    p.estado = `Cancelado por Cliente (${motivo})`;
                    fetch(`${BACKEND_URL}/api/pedidos`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(p)
                    }).catch(e => {});
                }
            });
            localStorage.setItem('lt_pedidos_activos', JSON.stringify(pedidos));
            window.dispatchEvent(new Event('storage'));
            showToast("Pedido cancelado", "error");
            mostrarPedidosActivos();
        };

        function mostrarPerfilCliente() {
            actualizarMenuActivo(4);
            let sesion = JSON.parse(localStorage.getItem('lt_sesion_activa')) || {};

            const container = document.getElementById('main-content');
            container.innerHTML = `
                <button type="button" class="btn-volver-atras" onclick="mostrarHome()">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg> Volver al Inicio
                </button>
                <div class="section-title"><span>👤 Mi Perfil de Cliente</span></div>
                <div style="background:#fff; border:1.5px solid var(--card-border); border-radius:var(--radius-lg); padding:24px; text-align:center; margin-bottom:18px; box-shadow:var(--shadow-subtle);">
                    ${sesion.foto ? `<img src="${sesion.foto}" style="width:90px; height:90px; border-radius:50%; object-fit:cover; border:3px solid var(--primary); margin-bottom:12px;" alt="Perfil">` : '<div style="font-size:45px; margin-bottom:10px;">👤</div>'}
                    <h3 style="margin:0 0 6px 0; font-size:18px; font-weight:900; color:var(--text-main);">${sesion.nombre || 'Cliente Montevideo'}</h3>
                    <p style="margin:0 0 6px 0; font-size:13px; color:var(--text-muted);">WhatsApp: <b>${sesion.telefono || '099000000'}</b></p>
                    <p style="margin:0; font-size:13px; color:var(--text-muted);">Dirección predeterminada: <b>${sesion.direccion || 'Montevideo'}</b></p>
                </div>
                <button type="button" onclick="cerrarSesionCliente()" style="background:var(--danger); font-weight:800;">🚪 Cerrar Sesión</button>
            `;
        }

        function actualizarMenuActivo(index) {
            document.querySelectorAll('.bottom-nav .nav-item').forEach((btn, idx) => {
                btn.classList.toggle('active', idx === index);
            });
        }
    </script>
</body>
</html>
