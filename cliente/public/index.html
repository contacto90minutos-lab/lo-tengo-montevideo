<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LO TENGO - Montevideo</title>
    <style>
        :root {
            --primary: #FF5722;
            --primary-gradient: linear-gradient(135deg, #FF5722, #FF7043);
            --outlet-gradient: linear-gradient(135deg, #7C3AED, #EC4899);
            --success: #10B981;
            --bg-body: #F3F4F6;
            --card-bg: #FFFFFF;
            --card-border: #E5E7EB;
            --text-main: #111827;
            --text-muted: #6B7280;
            --radius-lg: 20px;
            --radius-md: 14px;
            --shadow-subtle: 0 4px 20px rgba(0, 0, 0, 0.05);
            --shadow-outlet: 0 10px 25px rgba(124, 58, 237, 0.25);
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-body);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-main);
        }

        #app-container {
            background: #FFFFFF;
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            position: relative;
            border-left: 1px solid var(--card-border);
            border-right: 1px solid var(--card-border);
        }

        .header-app {
            background: #FFFFFF;
            color: var(--text-main);
            padding: 18px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--card-border);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .header-app h1 { margin: 0; font-size: 20px; font-weight: 900; letter-spacing: -0.5px; }

        .content-body { padding: 20px; flex: 1; overflow-y: auto; padding-bottom: 110px; }

        label { font-size: 13px; font-weight: 700; color: var(--text-muted); display: block; margin-bottom: 6px; }

        input, select, textarea {
            width: 100%; padding: 14px 16px; margin: 0 0 16px 0; border: 1.5px solid var(--card-border); border-radius: var(--radius-md); box-sizing: border-box; font-size: 15px; background: #F9FAFB; color: var(--text-main); font-family: inherit;
        }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); background: #FFFFFF; box-shadow: 0 0 0 4px rgba(255, 87, 34, 0.1); }

        button {
            width: 100%; padding: 15px; background: var(--primary-gradient); color: white; border: none; border-radius: var(--radius-md); font-weight: 800; cursor: pointer; font-size: 15px; box-shadow: 0 4px 14px rgba(255, 87, 34, 0.3); transition: all 0.2s;
        }
        button:hover { opacity: 0.95; transform: translateY(-1px); }

        .link-btn { background: none; color: var(--primary); border: none; text-decoration: underline; cursor: pointer; margin-top: 8px; font-size: 13px; font-weight: 600; box-shadow: none; }
        
        .btn-volver-atras {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #E5E7EB;
            color: var(--text-main);
            border: none;
            padding: 8px 14px;
            font-size: 12px;
            font-weight: 700;
            border-radius: var(--radius-md);
            cursor: pointer;
            width: auto;
            box-shadow: none;
            margin-bottom: 16px;
        }
        .btn-volver-atras:hover { background: #D1D5DB; transform: none; }

        .search-container { background: #F9FAFB; padding: 12px 18px; border-radius: var(--radius-md); display: flex; align-items: center; gap: 12px; margin-bottom: 20px; border: 1.5px solid var(--card-border); }
        .search-container input { border: none; background: transparent; margin: 0; padding: 0; outline: none; font-size: 15px; color: var(--text-main); }

        .categorias-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 22px; }
        .cat-card { background: var(--card-bg); border: 1.5px solid var(--card-border); border-radius: var(--radius-md); padding: 12px 4px; text-align: center; cursor: pointer; box-shadow: var(--shadow-subtle); transition: all 0.2s; }
        .cat-card:hover { transform: translateY(-2px); border-color: var(--primary); }
        .cat-card.outlet-cat { border-color: #C084FC; background: linear-gradient(135deg, #FAF5FF, #F3E8FF); }

        .outlet-banner { background: var(--outlet-gradient); color: white; padding: 22px; border-radius: var(--radius-lg); margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; box-shadow: var(--shadow-outlet); cursor: pointer; }
        .section-title { font-size: 17px; font-weight: 900; color: var(--text-main); margin: 0 0 16px 0; display: flex; align-items: center; justify-content: space-between; }

        .vehiculo-selector-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
        .vehiculo-card-opcion { background: #F9FAFB; border: 2px solid var(--card-border); border-radius: var(--radius-md); padding: 16px; text-align: center; cursor: pointer; transition: all 0.2s; }
        .vehiculo-card-opcion.seleccionado { border-color: var(--primary); background: rgba(255, 87, 34, 0.05); box-shadow: 0 0 0 4px rgba(255, 87, 34, 0.1); }

        .comercio-card { background: var(--card-bg); border: 1.5px solid var(--card-border); border-radius: var(--radius-lg); padding: 16px; margin-bottom: 14px; display: flex; align-items: center; gap: 16px; box-shadow: var(--shadow-subtle); }
        .comercio-avatar { width: 75px; height: 75px; border-radius: var(--radius-md); object-fit: cover; background: #E5E7EB; flex-shrink: 0; }

        .badge-estado { padding: 5px 10px; border-radius: 6px; font-size: 11px; font-weight: 800; display: inline-block; }
        .estado-buscando { background: #FEF3C7; color: #B45309; animation: pulse 1.5s infinite; }
        .estado-proceso { background: #FFEDD5; color: #C2410C; }
        .estado-pronto { background: #D1FAE5; color: #047857; }
        .estado-camino { background: #DBEAFE; color: #1D4ED8; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        .bottom-nav { position: absolute; bottom: 0; left: 0; width: 100%; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-top: 1px solid var(--card-border); display: flex; justify-content: space-around; padding: 12px 0; z-index: 10; }
        .nav-item { background: none; border: none; color: var(--text-muted); font-size: 11px; cursor: pointer; display: flex; flex-direction: column; align-items: center; font-weight: 600; }
        .nav-item svg { width: 22px; height: 22px; margin-bottom: 4px; fill: currentColor; }
        .nav-item.active { color: var(--primary); font-weight: 800; }
    </style>
</head>
<body>

    <div id="app-container">
        <div class="header-app">
            <h1><span style="color: var(--primary);">LO</span> TENGO</h1>
            <span id="header-user-info" style="font-size: 12px; font-weight: 700; background: #F3F4F6; padding: 6px 12px; border-radius: 20px; border: 1px solid var(--card-border);">📍 Montevideo</span>
        </div>
        
        <div class="content-body" id="main-content">
            <!-- Pantalla Login -->
            <div id="screen-login">
                <h3 style="color: var(--text-main); margin-top: 0; font-size: 22px; font-weight: 900;">Iniciar Sesión</h3>
                <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 24px;">Ingresá a tu cuenta para pedir en Montevideo.</p>
                
                <button type="button" onclick="loginConGoogle()" style="background: #FFFFFF; color: #374151; border: 1.5px solid var(--card-border); margin-bottom: 16px; display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 700; box-shadow: var(--shadow-subtle);">
                    <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.19v3.15C3.17 21.32 7.23 24 12 24z"/><path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.19C.43 8.12 0 9.87 0 11.7s.43 3.58 1.19 5.12l4.09-2.55z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.23 0 3.17 2.68 1.19 6.58l4.09 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/></svg>
                    Continuar con Google
                </button>

                <label>Número de WhatsApp:</label>
                <input type="tel" id="loginTelefono" placeholder="Ej: 099123456">

                <label>Contraseña:</label>
                <input type="password" id="loginPassword" placeholder="Tu contraseña">

                <button id="btnIniciarSesion" type="button">Ingresar al Sistema</button>
                
                <div style="text-align: center; margin-top: 20px;">
                    <button id="irARegistro" type="button" class="link-btn" style="font-size:14px; text-decoration:underline;">¿No tenés cuenta? Registrate acá</button>
                </div>
            </div>

            <!-- Pantalla Registro -->
            <div id="screen-registro" style="display: none;">
                <button type="button" class="btn-volver-atras" onclick="irLogin()">← Volver al login</button>
                <h3 style="color: var(--text-main); margin-top: 0; font-size: 22px; font-weight: 900;">Crear Cuenta</h3>
                <label>Nombre y Apellido:</label>
                <input type="text" id="regNombre" placeholder="Tu nombre">
                <label>WhatsApp:</label>
                <input type="tel" id="regTelefono" placeholder="Ej: 099123456">
                <label>Dirección principal en Montevideo:</label>
                <input type="text" id="regDireccion" placeholder="Calle, número y barrio">
                <label>Contraseña:</label>
                <input type="password" id="regPassword" placeholder="Contraseña segura">
                <button type="button" onclick="completarRegistroCliente()" style="background: var(--success); margin-top: 10px;">Completar Registro</button>
            </div>
        </div>

        <!-- Barra Navegación Inferior -->
        <div class="bottom-nav" id="bottom-nav" style="display: none;">
            <button class="nav-item active" onclick="mostrarHome()">
                <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>Inicio
            </button>
            <button class="nav-item" onclick="mostrarZonaOutlet()">
                <svg viewBox="0 0 24 24"><path d="M21.41 11.58l-9-9C12.05 2.22 11.55 2 11 2H4c-1.1 0-2 .9-2 2v7c0 .55.22 1.05.59 1.42l9 9c.36.36.86.58 1.41.58.55 0 1.05-.22 1.41-.59l7-7c.37-.36.59-.86.59-1.41 0-.55-.23-1.06-.59-1.42zM5.5 7C4.67 7 4 6.33 4 5.5S4.67 4 5.5 4 7 4.67 7 5.5 6.33 7 5.5 7z"/></svg>Outlet
            </button>
            <button class="nav-item" onclick="mostrarFormularioCadeteria()">
                <svg viewBox="0 0 24 24"><path d="M19 7h-3V5.5C16 4.12 14.88 3 13.5 3h-3C9.12 3 8 4.12 8 5.5V7H5c-1.1 0-2 .9-2 2v9c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V9c0-1.1-.9-2-2-2zm-9-1.5c0-.28.22-.5.5-.5h3c.28 0 .5.22.5.5V7H10V5.5zm9 12.5H5V9h14v9z"/></svg>Cadetería
            </button>
            <button class="nav-item" onclick="mostrarPedidosActivos()">
                <svg viewBox="0 0 24 24"><path d="M20 6h-4V4c0-1.1-.9-2-2-2h-4c-1.1 0-2 .9-2 2v2H4c-1.1 0-2 .9-2 2v11c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zM10 4h4v2h-4V4zm10 15H4V8h16v11z"/></svg>Pedidos
            </button>
        </div>
    </div>
    <script>
        // URL del backend configurada en Render
        const BACKEND_URL = "https://lo-tengo-montevideo.onrender.com";

        document.addEventListener("DOMContentLoaded", () => {
            verificarSesionCliente();
            configurarEventosLogin();
            inicializarDatosDemoSiEsNecesario();

            window.addEventListener('storage', () => {
                if (document.getElementById('contenedor-cards-pedidos')) renderizarListaPedidos();
            });

            setInterval(() => {
                if (document.getElementById('contenedor-cards-pedidos')) renderizarListaPedidos();
            }, 2000);
        });

        function inicializarDatosDemoSiEsNecesario() {
            let base = JSON.parse(localStorage.getItem('lt_base_empresas')) || [];
            if (base.length === 0) {
                base = [{
                    nombre: "Lo Tengo Central Montevideo",
                    rut: "219999990012",
                    telefono: "099000000",
                    direccion: "Av. 18 de Julio 1300",
                    giro: "Gastronomía",
                    pedidos: [],
                    productos: [
                        { id: 1, nombre: "Chivito al Plato Clásico", precio: 480, imagen: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=400&q=80", outlet: false },
                        { id: 2, nombre: "Empanadas de Carne (Docena)", precio: 520, imagen: "https://images.unsplash.com/photo-1608897013039-887f21d8c804?auto=format&fit=crop&w=400&q=80", outlet: true }
                    ]
                }];
                localStorage.setItem('lt_base_empresas', JSON.stringify(base));
            }
        }

        function verificarSesionCliente() {
            const sesion = localStorage.getItem('lt_sesion_activa');
            if (sesion) {
                try {
                    const usuario = JSON.parse(sesion);
                    document.getElementById('header-user-info').innerText = `📍 ${usuario.direccion || 'Montevideo'}`;
                    document.getElementById('bottom-nav').style.display = 'flex';
                    mostrarHome();
                } catch (e) { console.error(e); }
            }
        }

        function configurarEventosLogin() {
            const btnReg = document.getElementById('irARegistro');
            if (btnReg) {
                btnReg.onclick = () => {
                    document.getElementById('screen-login').style.display = 'none';
                    document.getElementById('screen-registro').style.display = 'block';
                };
            }

            const btnIng = document.getElementById('btnIniciarSesion');
            if (btnIng) {
                btnIng.onclick = () => {
                    const tel = document.getElementById('loginTelefono').value;
                    const pass = document.getElementById('loginPassword').value;
                    const usuarios = JSON.parse(localStorage.getItem('lt_base_usuarios')) || [];
                    let usr = usuarios.find(u => u.telefono === tel && u.password === pass);

                    if (!usr && tel === "099123456" && pass === "1234") {
                        usr = { nombre: "Cliente Demo Montevideo", telefono: "099123456", direccion: "Pocitos, Montevideo", password: "1234" };
                        usuarios.push(usr);
                        localStorage.setItem('lt_base_usuarios', JSON.stringify(usuarios));
                    }
                    if (!usr) { alert("❌ Credenciales incorrectas. Probá 099123456 / 1234"); return; }

                    localStorage.setItem('lt_sesion_activa', JSON.stringify(usr));
                    location.reload();
                };
            }
        }

        function loginConGoogle() {
            let usuarioGoogle = { nombre: "Francisco Claudino", telefono: "099000000", direccion: "Montevideo", email: "francisco@lotengo.uy" };
            localStorage.setItem('lt_sesion_activa', JSON.stringify(usuarioGoogle));
            alert("✅ ¡Sesión iniciada con Google!");
            location.reload();
        }

        function completarRegistroCliente() {
            let nombre = document.getElementById('regNombre').value;
            let telefono = document.getElementById('regTelefono').value;
            let direccion = document.getElementById('regDireccion').value;
            let password = document.getElementById('regPassword').value;

            if (!nombre || !telefono || !password) { alert("⚠️ Completá los campos obligatorios."); return; }

            let usuarios = JSON.parse(localStorage.getItem('lt_base_usuarios')) || [];
            let nuevoU = { nombre, telefono, direccion: direccion || 'Montevideo', password };
            usuarios.push(nuevoU);
            localStorage.setItem('lt_base_usuarios', JSON.stringify(usuarios));
            localStorage.setItem('lt_sesion_activa', JSON.stringify(nuevoU));
            alert("✅ ¡Registro exitoso!");
            location.reload();
        }

        function irLogin() {
            document.getElementById('screen-registro').style.display = 'none';
            document.getElementById('screen-login').style.display = 'block';
        }

        function mostrarHome(filtroGiro = 'todos') {
            actualizarMenuActivo(0);
            const container = document.getElementById('main-content');
            let baseEmpresas = JSON.parse(localStorage.getItem('lt_base_empresas')) || [];
            let comerciosFiltrados = baseEmpresas.filter(emp => filtroGiro === 'todos' || emp.giro === filtroGiro);

            let htmlComercios = comerciosFiltrados.map(emp => `
                <div class="comercio-card" onclick="verCatalogoComercio('${emp.rut}')">
                    <img src="${emp.logo || 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=400&q=80'}" class="comercio-avatar">
                    <div style="flex:1;">
                        <h4 style="margin:0 0 4px 0; font-size:16px; font-weight:900;">${emp.nombre}</h4>
                        <p style="margin:0; font-size:12px; color:var(--text-muted);">📍 ${emp.direccion || 'Montevideo'} • ⭐ 4.9</p>
                        <span style="font-size:10px; color:var(--primary); font-weight:800; background:rgba(255,87,34,0.1); padding:3px 8px; border-radius:6px; display:inline-block; margin-top:6px;">${emp.giro}</span>
                    </div>
                    <span style="color:var(--text-muted); font-size:22px; font-weight:bold;">›</span>
                </div>
            `).join('') || '<p style="text-align:center; color:var(--text-muted); padding:30px;">No hay comercios disponibles.</p>';

            container.innerHTML = `
                <div class="search-container">
                    <span>🔍</span>
                    <input type="text" placeholder="Buscar hamburguesas, supermercados...">
                </div>

                <div class="categorias-grid">
                    <div class="cat-card" onclick="mostrarHome('Gastronomía')"><div style="font-size:22px;">🍔</div><p style="margin:0; font-size:11px; font-weight:800;">Comida</p></div>
                    <div class="cat-card" onclick="mostrarHome('Supermercado')"><div style="font-size:22px;">🛒</div><p style="margin:0; font-size:11px; font-weight:800;">Super</p></div>
                    <div class="cat-card outlet-cat" onclick="mostrarZonaOutlet()"><div style="font-size:22px;">🏷️</div><p style="margin:0; font-size:11px; font-weight:900; color:#7C3AED;">Outlet</p></div>
                    <div class="cat-card" onclick="mostrarHome('Farmacia')"><div style="font-size:22px;">💊</div><p style="margin:0; font-size:11px; font-weight:800;">Farmacia</p></div>
                </div>

                <div class="outlet-banner" onclick="mostrarZonaOutlet()">
                    <div>
                        <div style="font-size:10px; font-weight:900; background:rgba(255,255,255,0.25); padding:3px 8px; border-radius:6px; display:inline-block; margin-bottom:6px;">OFERTAS FLASH</div>
                        <h3 style="margin:0; font-size:18px; font-weight:900;">ZONA OUTLET DESTACADO</h3>
                    </div>
                    <span style="font-size:32px;">🔥</span>
                </div>

                <div class="section-title">Comercios Aliados 🏪</div>
                ${htmlComercios}
            `;
        }

        function mostrarZonaOutlet() {
            actualizarMenuActivo(1);
            const container = document.getElementById('main-content');
            let base = JSON.parse(localStorage.getItem('lt_base_empresas')) || [];
            let prodsOutlet = [];
            base.forEach(emp => {
                (emp.productos || []).forEach(p => {
                    if (p.outlet) prodsOutlet.push({ ...p, empresaRut: emp.rut, empresaNombre: emp.nombre });
                });
            });

            let html = prodsOutlet.map(p => `
                <div class="comercio-card">
                    <img src="${p.imagen}" class="comercio-avatar">
                    <div style="flex:1;">
                        <h4 style="margin:0 0 4px 0; font-size:15px; font-weight:900;">${p.nombre}</h4>
                        <p style="margin:0; font-size:11px; color:var(--text-muted);">De: ${p.empresaNombre}</p>
                        <p style="margin:4px 0 0 0; font-size:15px; font-weight:900; color:var(--success);">$${p.precio}</p>
                    </div>
                    <button type="button" onclick="iniciarSeleccionUbicacionPedido('${p.empresaRut}', ${p.id})" style="width:auto; padding:10px 14px; font-size:12px;">Pedir</button>
                </div>
            `).join('') || '<p style="text-align:center; color:var(--text-muted); padding:30px;">No hay productos en outlet.</p>';

            container.innerHTML = `
                <button type="button" class="btn-volver-atras" onclick="mostrarHome()">← Volver al Inicio</button>
                <div class="outlet-banner" style="margin-bottom:22px;">
                    <div>
                        <h3 style="margin:0; font-size:20px; font-weight:900;">🔥 ZONA OUTLET EXCLUSIVA</h3>
                        <p style="margin:4px 0 0 0; font-size:13px; opacity:0.95;">Liquidaciones con stock limitado.</p>
                    </div>
                    <span style="font-size:28px;">⚡</span>
                </div>
                ${html}
            `;
        }

        function verCatalogoComercio(rut) {
            let base = JSON.parse(localStorage.getItem('lt_base_empresas')) || [];
            let emp = base.find(e => e.rut === rut);
            if (!emp) return;

            const container = document.getElementById('main-content');
            let prods = (emp.productos || []).map(p => `
                <div class="comercio-card">
                    <img src="${p.imagen || 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=400&q=80'}" class="comercio-avatar">
                    <div style="flex:1;">
                        <h4 style="margin:0 0 4px 0; font-size:15px; font-weight:900;">${p.nombre}</h4>
                        <p style="margin:0; font-size:15px; font-weight:900; color:var(--success);">$${p.precio}</p>
                    </div>
                    <button type="button" onclick="iniciarSeleccionUbicacionPedido('${emp.rut}', ${p.id})" style="width:auto; padding:10px 16px; font-size:13px;">Pedir</button>
                </div>
            `).join('') || '<p style="text-align:center; color:var(--text-muted); padding:20px;">Sin productos.</p>';

            container.innerHTML = `
                <button type="button" class="btn-volver-atras" onclick="mostrarHome()">← Volver al Inicio</button>
                <div style="display:flex; align-items:center; gap:12px; margin-bottom:18px;">
                    <h3 style="margin:0; font-size:18px; font-weight:900;">${emp.nombre}</h3>
                </div>
                <div style="background:#F9FAFB; padding:14px; border-radius:var(--radius-md); margin-bottom:20px; font-size:13px; color:var(--text-muted); border: 1.5px solid var(--card-border);">
                    📍 <b>${emp.direccion}</b> | 📞 ${emp.telefono}
                </div>
                <h4 style="margin-bottom:12px; font-size:16px; font-weight:900;">Catálogo Disponible (Costo de envío: $90)</h4>
                ${prods}
            `;
        }

        function iniciarSeleccionUbicacionPedido(rut, productoId) {
            let sesion = JSON.parse(localStorage.getItem('lt_sesion_activa'));
            let base = JSON.parse(localStorage.getItem('lt_base_empresas')) || [];
            let emp = base.find(e => e.rut === rut);
            let p = emp.productos.find(prod => prod.id === productoId);
            let totalBase = p.precio + 90;

            const container = document.getElementById('main-content');
            container.innerHTML = `
                <button type="button" class="btn-volver-atras" onclick="verCatalogoComercio('${rut}')">← Volver al Catálogo</button>
                <div style="display:flex; align-items:center; gap:12px; margin-bottom:18px;">
                    <h3 style="margin:0; font-size:18px; font-weight:900;">💳 Resumen y Pago</h3>
                </div>

                <label>Dirección de Entrega:</label>
                <input type="text" id="dirEntregaFinal" value="${sesion.direccion}" placeholder="Dirección en Montevideo">

                <div style="background:#F9FAFB; padding:14px; border-radius:var(--radius-md); margin-bottom:16px; border:1.5px solid var(--card-border); font-size:13px;">
                    <div style="display:flex; justify-content:space-between; margin-bottom:4px;"><span>${p.nombre}:</span> <b>$${p.precio}</b></div>
                    <div style="display:flex; justify-content:space-between; margin-bottom:12px;"><span>Costo de envío:</span> <b>$90</b></div>
                    
                    <label style="font-size:12px; margin-bottom:6px; color:var(--primary);">🪙 Propina 100% para el cadete:</label>
                    <div style="display:flex; gap:6px; margin-bottom:10px;">
                        <button type="button" onclick="setPropina(0)" style="padding:6px; font-size:12px; background:#E5E7EB; color:var(--text-main); box-shadow:none;">$0</button>
                        <button type="button" onclick="setPropina(35)" style="padding:6px; font-size:12px; background:var(--primary); color:#fff; box-shadow:none;">$35</button>
                        <button type="button" onclick="setPropina(55)" style="padding:6px; font-size:12px; background:#E5E7EB; color:var(--text-main); box-shadow:none;">$55</button>
                    </div>
                    <input type="number" id="inputPropina" value="35" min="0" step="5" oninput="actualizarTotal(${totalBase})" style="margin:0; padding:8px;">

                    <div style="display:flex; justify-content:space-between; margin-top:12px; border-top:1px solid var(--card-border); padding-top:8px; font-size:15px; font-weight:900; color:var(--success);">
                        <span>Total a Pagar:</span>
                        <span id="lblTotal">$${totalBase + 35}</span>
                    </div>
                </div>

                <button type="button" onclick="confirmarPedidoCompra('${rut}', ${productoId})" style="background:#0284C7; font-weight:800;">💙 Pagar con Mercado Pago</button>
            `;
        }

        function setPropina(m) {
            document.getElementById('inputPropina').value = m;
            document.getElementById('inputPropina').dispatchEvent(new Event('input'));
        }

        function actualizarTotal(base) {
            let p = Number(document.getElementById('inputPropina').value) || 0;
            document.getElementById('lblTotal').innerText = `$${base + p}`;
        }

        async function confirmarPedidoCompra(rut, productoId) {
            let dir = document.getElementById('dirEntregaFinal').value;
            let propina = Number(document.getElementById('inputPropina').value) || 0;
            let base = JSON.parse(localStorage.getItem('lt_base_empresas')) || [];
            let emp = base.find(e => e.rut === rut);
            let p = emp.productos.find(prod => prod.id === productoId);
            let sesion = JSON.parse(localStorage.getItem('lt_sesion_activa'));
            let total = p.precio + 90 + propina;

            let nuevoPedido = {
                id: Date.now(),
                cliente: sesion.nombre,
                telefonoCliente: sesion.telefono,
                direccion: dir,
                total: total,
                estado: 'Buscando cadete más cercano a origen',
                items: [
                    { nombre: p.nombre, precio: p.precio, cantidad: 1 },
                    { nombre: 'Costo de Envío', precio: 90, cantidad: 1 },
                    ...(propina > 0 ? [{ nombre: 'Propina Cadete', precio: propina, cantidad: 1 }] : [])
                ],
                codigoVerificacion: Math.floor(1000 + Math.random() * 9000).toString()
            };

            // Guardado local y sincronización para pruebas offline
            if (!emp.pedidos) emp.pedidos = [];
            emp.pedidos.push(nuevoPedido);
            localStorage.setItem('lt_base_empresas', JSON.stringify(base));
            window.dispatchEvent(new Event('storage'));

            // Intentar sincronizar con el backend en Render
            try {
                await fetch(`${BACKEND_URL}/api/pedidos`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(nuevoPedido)
                });
            } catch (e) {
                console.warn("No se pudo conectar con Render, respaldado localmente.", e);
            }

            alert(`✅ ¡Pedido confirmado por $${total}!\n🔑 PIN de seguridad: [ ${nuevoPedido.codigoVerificacion} ]`);
            mostrarPedidosActivos();
        }

        // ==========================================
        // MÓDULO DE CADETERÍA EXPRESS (CON PROPINA)
        // ==========================================
        let tipoVehiculoCadete = 'moto';
        let contadorDestinosCadete = 1;

        function mostrarFormularioCadeteria() {
            actualizarMenuActivo(2);
            document.getElementById('main-content').innerHTML = `
                <button type="button" class="btn-volver-atras" onclick="mostrarHome()">← Volver al Inicio</button>
                <h3 style="color:var(--text-main); margin-top:0; font-size:20px; font-weight:900;">🛵 Cadetería Express</h3>
                <p style="font-size:13px; color:var(--text-muted); margin-bottom:16px;">Punto A a B con múltiples paradas y mapa en Montevideo.</p>

                <label>Seleccionar Vehículo:</label>
                <div class="vehiculo-selector-grid">
                    <div id="card-moto" class="vehiculo-card-opcion seleccionado" onclick="setVehiculoCadete('moto')">
                        <div style="font-size:26px; margin-bottom:4px;">🏍️</div>
                        <div style="font-size:14px; font-weight:900;">Moto</div>
                        <div style="font-size:11px; color:var(--text-muted); margin-top:2px;">Base $290</div>
                    </div>
                    <div id="card-camioneta" class="vehiculo-card-opcion" onclick="setVehiculoCadete('camioneta')">
                        <div style="font-size:26px; margin-bottom:4px;">🚐</div>
                        <div style="font-size:14px; font-weight:900;">Camioneta</div>
                        <div style="font-size:11px; color:var(--text-muted); margin-top:2px;">Base $550</div>
                    </div>
                </div>

                <label>Origen (Retiro):</label>
                <input type="text" id="cadOrigen" placeholder="Ej: Av. 18 de Julio 1200" oninput="actualizarCalculoCadeteria()">

                <div id="contenedor-destinos-cadete">
                    <label>Destino 1 (Entrega):</label>
                    <input type="text" class="input-destino-cadete" placeholder="Ej: Bv. General Artigas 2500" oninput="actualizarCalculoCadeteria()">
                </div>

                <button type="button" onclick="agregarDestinoCadete()" style="background:#4B5563; font-size:13px; padding:10px; margin-bottom:14px; box-shadow:none;">➕ Agregar otra parada</button>

                <label>Descripción detallada de la carga:</label>
                <textarea id="cadDescripcion" rows="2" placeholder="Ej: Paquete frágil / Documentación..."></textarea>

                <div style="background:#F9FAFB; padding:14px; border-radius:var(--radius-md); margin-bottom:16px; border:1.5px solid var(--card-border);">
                    <label style="font-size:12px; margin-bottom:6px; color:var(--primary);">🪙 Propina 100% para el cadete:</label>
                    <div style="display:flex; gap:6px; margin-bottom:10px;">
                        <button type="button" onclick="setPropinaCadete(0)" style="padding:6px; font-size:12px; background:#E5E7EB; color:var(--text-main); box-shadow:none;">$0</button>
                        <button type="button" onclick="setPropinaCadete(35)" style="padding:6px; font-size:12px; background:var(--primary); color:#fff; box-shadow:none;">$35</button>
                        <button type="button" onclick="setPropinaCadete(55)" style="padding:6px; font-size:12px; background:#E5E7EB; color:var(--text-main); box-shadow:none;">$55</button>
                    </div>
                    <input type="number" id="inputPropinaCadete" value="35" min="0" step="5" oninput="actualizarCalculoCadeteria()" style="margin:0; padding:8px;">
                </div>

                <label>Vista del Recorrido Vial en Mapa:</label>
                <div style="height: 160px; background: #E5E7EB; border-radius: var(--radius-md); overflow: hidden; margin-bottom: 14px; border: 1.5px solid var(--card-border);">
                    <iframe id="iframeMapaCadete" src="https://maps.google.com/maps?q=Montevideo,Uruguay&t=&z=13&ie=UTF8&iwloc=&output=embed" style="width:100%; height:100%; border:0;" allowfullscreen></iframe>
                </div>

                <div id="panel-tarifa-cadete" style="background:#F9FAFB; border:1.5px solid var(--card-border); border-radius:var(--radius-md); padding:14px; margin-bottom:16px; font-size:13px;">
                    📍 Ingresá origen y destino para calcular la ruta vial.
                </div>

                <button type="button" onclick="solicitarCadeteriaExpressFinal()" style="background:var(--success); font-weight:800;">Solicitar Envío</button>
            `;
            actualizarCalculoCadeteria();
        }

        function setVehiculoCadete(tipo) {
            tipoVehiculoCadete = tipo;
            document.getElementById('card-moto').classList.toggle('seleccionado', tipo === 'moto');
            document.getElementById('card-camioneta').classList.toggle('seleccionado', tipo === 'camioneta');
            actualizarCalculoCadeteria();
        }

        function setPropinaCadete(m) {
            document.getElementById('inputPropinaCadete').value = m;
            actualizarCalculoCadeteria();
        }

        function agregarDestinoCadete() {
            contadorDestinosCadete++;
            const contenedor = document.getElementById('contenedor-destinos-cadete');
            const div = document.createElement('div');
            div.style.marginTop = "10px";
            div.innerHTML = `
                <label>Destino ${contadorDestinosCadete} (Entrega):</label>
                <input type="text" class="input-destino-cadete" placeholder="Calle y número de destino" oninput="actualizarCalculoCadeteria()">
            `;
            contenedor.appendChild(div);
        }

        function actualizarCalculoCadeteria() {
            let origen = document.getElementById('cadOrigen').value.trim();
            let inputsDestino = document.querySelectorAll('.input-destino-cadete');
            let destinosValidos = Array.from(inputsDestino).filter(i => i.value.trim().length > 2);
            let panel = document.getElementById('panel-tarifa-cadete');
            let iframe = document.getElementById('iframeMapaCadete');
            let propina = Number(document.getElementById('inputPropinaCadete').value) || 0;

            if (!origen || destinosValidos.length === 0) {
                if(panel) panel.innerHTML = `📍 Completá origen y al menos un destino para ver la tarifa y la ruta.`;
                return;
            }

            let ultimoDestino = destinosValidos[destinosValidos.length - 1].value.trim();
            if(iframe) {
                let query = encodeURIComponent(`${origen}, Montevideo to ${ultimoDestino}, Montevideo`);
                iframe.src = `https://maps.google.com/maps?q=${query}&t=&z=13&ie=UTF8&iwloc=&output=embed`;
            }

            let tarifaBase = tipoVehiculoCadete === 'moto' ? 290 : 550;
            let extraParadas = (destinosValidos.length - 1) * 90;
            let tarifaServicio = tarifaBase + extraParadas;
            let tarifaTotalFinal = tarifaServicio + propina;

            if(panel) {
                panel.innerHTML = `
                    <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
                        <span>Servicio (${tipoVehiculoCadete} + ${destinosValidos.length} parada/s):</span>
                        <b>$${tarifaServicio}</b>
                    </div>
                    <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
                        <span>Propina cadete:</span>
                        <b>$${propina}</b>
                    </div>
                    <div style="display:flex; justify-content:space-between; font-size:14px; font-weight:900; color:var(--success); border-top:1px solid var(--card-border); padding-top:6px; margin-top:6px;">
                        <span>Total a abonar:</span>
                        <span>$${tarifaTotalFinal}</span>
                    </div>
                `;
            }
        }

        async function solicitarCadeteriaExpressFinal() {
            let origen = document.getElementById('cadOrigen').value.trim();
            let inputsDestino = document.querySelectorAll('.input-destino-cadete');
            let destinosValidos = Array.from(inputsDestino).filter(i => i.value.trim().length > 2);
            let desc = document.getElementById('cadDescripcion').value.trim();
            let propina = Number(document.getElementById('inputPropinaCadete').value) || 0;
            let sesion = JSON.parse(localStorage.getItem('lt_sesion_activa')) || {};

            if (!origen || destinosValidos.length === 0 || !desc) {
                alert("⚠️ Completá origen, al menos un destino y la descripción detallada de la carga.");
                return;
            }

            let tarifaBase = tipoVehiculoCadete === 'moto' ? 290 : 550;
            let subtotalServicio = tarifaBase + ((destinosValidos.length - 1) * 90);
            let totalFinal = subtotalServicio + propina;
            let primerDestino = destinosValidos[0].value.trim();

            let nuevoPedido = {
                id: Date.now(),
                cliente: sesion.nombre || 'Cliente',
                telefonoCliente: sesion.telefono || '099000000',
                direccion: primerDestino,
                total: totalFinal,
                estado: 'Buscando cadete más cercano a origen',
                descripcion: `Cadetería (${tipoVehiculoCadete}) desde [${origen}] con ${destinosValidos.length} destino(s) - ${desc}`,
                items: [
                    { nombre: `Envío Express (${tipoVehiculoCadete})`, precio: subtotalServicio, cantidad: 1 },
                    ...(propina > 0 ? [{ nombre: 'Propina Cadete', precio: propina, cantidad: 1 }] : [])
                ],
                codigoVerificacion: Math.floor(1000 + Math.random() * 9000).toString()
            };

            let base = JSON.parse(localStorage.getItem('lt_base_empresas')) || [];
            if (base.length === 0) { alert("⚠️ Configurar central primero."); return; }
            if (!base[0].pedidos) base[0].pedidos = [];
            base[0].pedidos.push(nuevoPedido);
            
            localStorage.setItem('lt_base_empresas', JSON.stringify(base));
            window.dispatchEvent(new Event('storage'));

            try {
                await fetch(`${BACKEND_URL}/api/pedidos`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(nuevoPedido)
                });
            } catch (e) {
                console.warn("No se pudo conectar con Render, respaldado localmente.", e);
            }

            alert(`✅ ¡Buscando cadete más cercano a origen por $${totalFinal}!\n🔑 PIN de seguridad obligatorio: [ ${nuevoPedido.codigoVerificacion} ]`);
            mostrarPedidosActivos();
        }

        function mostrarPedidosActivos() {
            actualizarMenuActivo(3);
            renderizarListaPedidos();
        }

        function renderizarListaPedidos() {
            const container = document.getElementById('main-content');
            let base = JSON.parse(localStorage.getItem('lt_base_empresas')) || [];
            let sesion = JSON.parse(localStorage.getItem('lt_sesion_activa')) || {};
            let misPedidos = [];

            base.forEach(emp => {
                (emp.pedidos || []).forEach(p => {
                    if (p.cliente === sesion.nombre) misPedidos.push({ ...p, empresaNombre: emp.nombre });
                });
            });

            misPedidos.sort((a, b) => b.id - a.id);

            let html = misPedidos.map(p => {
                let claseBadge = p.estado.includes('Buscando') ? 'estado-buscando' : (p.estado.includes('Entregado') ? 'estado-pronto' : 'estado-proceso');
                let itemsTexto = (p.items || []).map(i => `${i.cantidad}x ${i.nombre}`).join(', ');

                let esCerrado = p.estado.includes('Entregado') || p.estado.includes('Cerrado');
                let seccionCalificacion = '';

                if (esCerrado) {
                    if (!p.calificadoCliente) {
                        seccionCalificacion = `
                            <div style="background:#F0FDF4; border:1px solid #BBF7D0; padding:12px; border-radius:var(--radius-md); margin-top:12px; text-align:center;">
                                <span style="font-size:12px; font-weight:800; color:#15803D; display:block; margin-bottom:6px;">⭐ ¡Calificá tu experiencia!</span>
                                <div style="display:flex; justify-content:center; gap:8px; margin-bottom:8px;">
                                    <button type="button" onclick="calificarPedido('${p.id}', 5)" style="width:auto; padding:6px 12px; font-size:12px; background:#22C55E; box-shadow:none;">⭐⭐⭐⭐⭐</button>
                                    <button type="button" onclick="calificarPedido('${p.id}', 3)" style="width:auto; padding:6px 12px; font-size:12px; background:#EAB308; box-shadow:none;">⭐⭐⭐</button>
                                </div>
                            </div>
                        `;
                    } else {
                        seccionCalificacion = `<p style="text-align:center; font-size:12px; color:var(--success); font-weight:bold; margin-top:8px;">⭐ ¡Gracias por calificar este pedido!</p>`;
                    }
                }

                return `
                    <div class="comercio-card" style="display:block; border-left: 5px solid var(--primary); margin-bottom: 14px;">
                        <div style="display:flex; justify-content:space-between; margin-bottom:8px; align-items:center;">
                            <strong style="color:var(--text-main); font-size:14px; font-weight:900;">Pedido #${p.id.toString().slice(-4)}</strong>
                            <span class="badge-estado ${claseBadge}">${p.estado}</span>
                        </div>
                        <p style="margin:4px 0; font-size:13px; color:var(--text-muted);">🏪 Local/Servicio: <b>${p.empresaNombre}</b></p>
                        <p style="margin:4px 0; font-size:13px; color:var(--text-muted);">📍 ${p.descripcion ? '<b>' + p.descripcion + '</b>' : 'Destino: <b>' + p.direccion + '</b>'}</p>
                        <p style="margin:4px 0; font-size:13px; color:var(--text-muted);">📦 ${itemsTexto}</p>
                        <p style="margin:4px 0; font-size:13px; color:var(--text-muted);">💳 Total: <b>$${p.total}</b></p>
                        
                        ${!esCerrado ? `
                            <div style="background:#FFF7ED; padding:12px; border-radius:var(--radius-md); text-align:center; margin-top:12px; border: 1.5px solid #FDBA74;">
                                <span style="font-size:12px; color:#C2410C; font-weight:700;">🔑 PIN de seguridad para entregar al cadete:</span>
                                <div style="font-size:22px; font-weight:900; color:#C2410C; letter-spacing:2px; margin-top:4px;">${p.codigoVerificacion}</div>
                            </div>
                        ` : ''}

                        ${seccionCalificacion}</div>
                `;
            }).join('') || '<p style="text-align:center; color:var(--text-muted); margin-top:40px;">No tenés pedidos activos.</p>';

            if(container) {
                container.innerHTML = `
                    <button type="button" class="btn-volver-atras" onclick="mostrarHome()">← Volver al Inicio</button>
                    <h3 style="color:var(--text-main); margin-top:0; font-size:20px; font-weight:900;">📦 Mis Pedidos y Seguimiento</h3>
                    <div id="contenedor-cards-pedidos">${html}</div>
                `;
            }
        }

        window.calificarPedido = function(idPedido, estrellas) {
            let base = JSON.parse(localStorage.getItem('lt_base_empresas')) || [];
            base.forEach(emp => {
                if (emp.pedidos) {
                    emp.pedidos.forEach(p => {
                        if (String(p.id).trim() === String(idPedido).trim()) {
                            p.calificadoCliente = true;
                            p.estrellasCliente = estrellas;
                        }
                    });
                }
            });
            localStorage.setItem('lt_base_empresas', JSON.stringify(base));
            window.dispatchEvent(new Event('storage'));
            alert(`⭐ ¡Gracias! Has calificado este pedido con ${estrellas} estrellas.`);
            renderizarListaPedidos();
        };

        function actualizarMenuActivo(index) {
            document.querySelectorAll('.bottom-nav .nav-item').forEach((btn, idx) => {
                btn.classList.toggle('active', idx === index);
            });
        }
    </script>
</body>
</html>
