<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LO TENGO - Cadetes / Delivery</title>
    <style>
        :root {
            --primary: #002855;
            --secondary: #E85B04;
            --success: #28a745;
            --warning: #ffc107;
            --danger: #DC2626;
            --mp-blue: #009ee3;
            --bg-light: #f8f9fa;
            --border: #e5e7eb;
            --radius: 14px;
            --shadow-subtle: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #eef2f6;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #app-container {
            background: #ffffff;
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .header-app {
            background: var(--primary);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
        }

        .header-app h1 {
            margin: 0;
            font-size: 20px;
            letter-spacing: 0.5px;
        }

        .content-body {
            padding: 15px;
            flex: 1;
            overflow-y: auto;
            padding-bottom: 90px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            margin: 6px 0 12px 0;
            border: 1px solid var(--border);
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 14px;
            background: #fff;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            transition: opacity 0.2s;
            margin-top: 5px;
        }

        button:hover { opacity: 0.9; }

        .link-btn {
            background: none;
            color: var(--primary);
            border: none;
            text-decoration: underline;
            cursor: pointer;
            margin-top: 10px;
            font-size: 13px;
        }

        .btn-volver-atras {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #FFFFFF;
            color: var(--primary);
            border: 1.5px solid var(--border);
            padding: 10px 16px;
            font-size: 13px;
            font-weight: 700;
            border-radius: var(--radius);
            cursor: pointer;
            width: auto;
            box-shadow: var(--shadow-subtle);
            margin-bottom: 16px;
            transition: all 0.2s;
        }
        .btn-volver-atras:hover { background: #F3F4F6; border-color: var(--secondary); transform: translateY(-1px); }

        .section-title {
            font-size: 16px;
            font-weight: 800;
            color: var(--primary);
            margin: 0 0 12px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #ffffff;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            box-sizing: border-box;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.03);
            z-index: 10;
        }

        .nav-item {
            background: none;
            border: none;
            color: #666;
            font-size: 10px;
            cursor: pointer;
            width: auto;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .nav-item span { font-size: 16px; margin-bottom: 2px; }
        .nav-item.active { color: var(--secondary); font-weight: bold; }

        #banner-notificacion-flotante {
            position: fixed;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 440px;
            background: #137333;
            color: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.25);
            z-index: 9999;
            transition: top 0.4s ease-in-out;
            box-sizing: border-box;
        }
        #banner-notificacion-flotante.mostrar {
            top: 20px;
        }

        .btn-whatsapp {
            background-color: #25D366 !important;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 6px;
        }
    </style>
</head>
<body>

    <!-- Notificación Flotante -->
    <div id="banner-notificacion-flotante">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <b id="titulo-burbuja" style="font-size:15px;">📦 ¡Nuevo Pedido Disponible!</b>
            <button type="button" onclick="cerrarBurbujaFlotante()" style="background:none; border:none; color:white; font-size:16px; cursor:pointer; width:auto; padding:0;">✕</button>
        </div>
        <p id="texto-burbuja" style="margin:6px 0 0 0; font-size:13px; opacity:0.95;">Un comercio o servicio liberó un pedido para retirar en Montevideo.</p>
    </div>

    <div id="app-container">
        <!-- Header -->
        <div class="header-app">
            <h1><span style="color:var(--secondary);">LO</span> TENGO <small style="font-size:11px; opacity:0.8;">[Cadetes Mvd]</small></h1>
            <span id="header-cadete-info" style="font-size: 11px; opacity: 0.9;">Panel Delivery</span>
        </div>
        
        <!-- Contenido Principal -->
        <div class="content-body" id="main-content-cadete">
            
            <!-- 1. LOGIN DE CADETES -->
            <div id="screen-login-cadete">
                <h3 style="color: var(--primary); margin-top: 0;">Acceso Cadetes</h3>
                <label style="font-size: 12px; color: #555;">Cédula de Identidad (CI):</label>
                <input type="text" id="loginCiCadete" placeholder="Ej: 45678912">

                <label style="font-size: 12px; color: #555;">Contraseña:</label>
                <input type="password" id="loginPassCadete" placeholder="Contraseña">

                <div style="display: flex; align-items: center; margin-bottom: 10px; font-size: 13px;">
                    <input type="checkbox" id="recordarSesionCadete" style="width: auto; margin: 0 8px 0 0;" checked>
                    <label for="recordarSesionCadete" style="color: #555; cursor: pointer;">Recordar sesión en este dispositivo</label>
                </div>

                <button id="btnIngresarCadete" type="button" style="background-color: var(--primary);">Ingresar como Cadete</button>
                
                <div style="text-align: center; margin: 10px 0;">
                    <button type="button" onclick="mostrarRecuperarPass()" class="link-btn">¿Olvidaste tu contraseña?</button>
                </div>

                <div style="text-align: center;">
                    <p style="margin-top: 15px; font-size: 13px; color: #666;">¿No estás registrado como cadete?</p>
                    <button id="irARegistroCadete" type="button" class="link-btn">Registrarme como Cadete</button>
                </div>
            </div>

            <!-- 2. REGISTRO DE CADETES -->
            <div id="screen-registro-cadete" style="display: none;">
                <button type="button" class="btn-volver-atras" onclick="irLoginCadete()">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg> Volver al login
                </button>
                <h3 style="color: var(--primary); margin-top: 0;">Registro de Cadete</h3>
                <label>Nombre Completo:</label>
                <input type="text" id="regCadNombre" placeholder="Ej: Carlos Gómez">
                <label>Cédula de Identidad (CI):</label>
                <input type="text" id="regCadCi" placeholder="Sin puntos ni guiones">
                <label>Teléfono de Contacto:</label>
                <input type="tel" id="regCadTel" placeholder="099123456">
                <label>Vehículo:</label>
                <select id="regCadVehiculo">
                    <option value="Moto">🏍️ Moto</option>
                    <option value="Bicicleta">🚲 Bicicleta</option>
                    <option value="Camioneta">🚐 Camioneta</option>
                    <option value="Auto">🚗 Automóvil</option>
                </select>
                <label>Contraseña:</label>
                <input type="password" id="regCadPass" placeholder="Contraseña de acceso">
                <button type="button" onclick="completarRegistroCadete()" style="background: var(--success); margin-top: 6px;">Crear Cuenta Cadete</button>
            </div>

            <!-- 3. RECUPERAR CONTRASEÑA -->
            <div id="screen-recuperar-cadete" style="display: none;">
                <button type="button" class="btn-volver-atras" onclick="irLoginCadete()">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg> Volver al login
                </button>
                <h3 style="color: var(--primary); margin-top: 0;">Recuperar Contraseña</h3>
                <p style="font-size: 13px; color: #666;">Ingresá tu Cédula de Identidad (CI) para restablecer tu contraseña.</p>
                <label>Cédula de Identidad:</label>
                <input type="text" id="recuperarDato" placeholder="CI sin puntos">
                <button type="button" onclick="enviarRecuperacionPass()" style="background: var(--secondary);">Enviar Instrucciones</button>
            </div>

        </div>

        <!-- Barra de Navegación Inferior -->
        <div class="bottom-nav" id="bottom-nav-cadete" style="display: none;">
            <button class="nav-item active" onclick="mostrarDisponiblesCadete()"><span>📦</span>Disponibles <span id="badge-cadete-disponibles" style="background:var(--secondary); color:white; border-radius:50%; padding:1px 4px; font-size:8px; display:inline-block; vertical-align:top; margin-left:1px;">0</span></button>
            <button class="nav-item" onclick="mostrarEnCursoCadete()"><span>🛵</span>En Curso</button>
            <button class="nav-item" onclick="mostrarHistorialCadete()"><span>💰</span>Historial</button>
            <button class="nav-item" onclick="cerrarSesionCadete()"><span>🚪</span>Salir</button>
        </div>
    </div>

    <!-- Script Sincronizado y Robusto para Cadetes -->
    <script>
        const BACKEND_URL = "https://lo-tengo-montevideo.onrender.com";

        let ultimoConteoPedidosCadete = 0;

        document.addEventListener("DOMContentLoaded", () => {
            verificarSesionCadete();
            configurarEventosLoginCadete();
            sincronizarPedidosDesdeServidor();
            
            window.addEventListener('storage', () => {
                let cadete = obtenerCadeteActualizado();
                if (cadete) {
                    revisarNuevosPedidosCadete(true);
                    if (document.getElementById('bandera-vista-disponibles')) mostrarDisponiblesCadete();
                    else if (document.getElementById('bandera-vista-curso')) mostrarEnCursoCadete();
                }
            });

            setInterval(() => {
                sincronizarPedidosDesdeServidor();
                let cadete = obtenerCadeteActualizado();
                if (cadete) {
                    revisarNuevosPedidosCadete(false);
                }
            }, 2000);
        });

        async function sincronizarPedidosDesdeServidor() {
            try {
                let response = await fetch(`${BACKEND_URL}/api/pedidos`);
                if (response.ok) {
                    let pedidosRemotos = await response.json();
                    if (pedidosRemotos && Array.isArray(pedidosRemotos) && pedidosRemotos.length > 0) {
                        let baseEmpresas = JSON.parse(localStorage.getItem('lt_base_empresas')) || [];
                        if (baseEmpresas.length > 0) {
                            let emp = baseEmpresas[0];
                            let mapaLocal = new Map();
                            (emp.pedidos || []).forEach(p => mapaLocal.set(String(p.id).trim(), p));
                            
                            pedidosRemotos.forEach(pR => {
                                mapaLocal.set(String(pR.id).trim(), pR);
                            });

                            emp.pedidos = Array.from(mapaLocal.values());
                            localStorage.setItem('lt_base_empresas', JSON.stringify(baseEmpresas));

                            let cadete = obtenerCadeteActualizado();
                            if (cadete) {
                                revisarNuevosPedidosCadete(true);
                            }
                        }
                    }
                }
            } catch (e) {
                // Modo offline respaldado por localStorage
            }
        }

        function reproducirAlertaVoz(mensaje) {
            try {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    let utterance = new SpeechSynthesisUtterance(mensaje);
                    utterance.lang = 'es-UY';
                    utterance.rate = 1.0;
                    utterance.pitch = 1.0;
                    window.speechSynthesis.speak(utterance);
                }
            } catch (err) {
                console.error("Error voz:", err);
            }
        }

        function mostrarBurbujaEmergente(titulo, texto) {
            const banner = document.getElementById('banner-notificacion-flotante');
            const tit = document.getElementById('titulo-burbuja');
            const txt = document.getElementById('texto-burbuja');

            if (banner && tit && txt) {
                tit.innerText = titulo;
                txt.innerText = texto;
                banner.classList.add('mostrar');
                setTimeout(() => cerrarBurbujaFlotante(), 6000);
            }
        }

        function cerrarBurbujaFlotante() {
            const banner = document.getElementById('banner-notificacion-flotante');
            if (banner) banner.classList.remove('mostrar');
        }

        function verificarSesionCadete() {
            const sesion = localStorage.getItem('lt_sesion_cadete');
            if (sesion) {
                try {
                    const cadete = JSON.parse(sesion);
                    document.getElementById('header-cadete-info').innerText = cadete.nombre;
                    document.getElementById('bottom-nav-cadete').style.display = 'flex';
                    revisarNuevosPedidosCadete(false);
                    mostrarDisponiblesCadete();
                } catch (e) { console.error(e); }
            }
        }

        function configurarEventosLoginCadete() {
            const btnReg = document.getElementById('irARegistroCadete');
            if (btnReg) {
                btnReg.onclick = () => {
                    document.getElementById('screen-login-cadete').style.display = 'none';
                    document.getElementById('screen-registro-cadete').style.display = 'block';
                };
            }

            const btnIng = document.getElementById('btnIngresarCadete');
            if (btnIng) {
                btnIng.onclick = () => {
                    const ci = document.getElementById('loginCiCadete').value.trim();
                    const pass = document.getElementById('loginPassCadete').value.trim();
                    let base = JSON.parse(localStorage.getItem('lt_base_cadetes')) || [];
                    
                    if (base.length === 0) {
                        base = [{ ci: '12345678', nombre: 'Cadete Demo Montevideo', telefono: '099111222', vehiculo: 'Moto', password: '123', entregas: [] }];
                        localStorage.setItem('lt_base_cadetes', JSON.stringify(base));
                    }

                    let cadete = base.find(c => String(c.ci).trim() === ci && String(c.password || '123').trim() === pass);

                    if (!cadete) {
                        if (ci === '12345678' && pass === '123') {
                            cadete = base[0];
                        } else {
                            alert("❌ CI o contraseña incorrectos.");
                            return;
                        }
                    }

                    reproducirAlertaVoz("Lo tengo");
                    localStorage.setItem('lt_sesion_cadete', JSON.stringify(cadete));
                    location.reload();
                };
            }
        }

        function completarRegistroCadete() {
            let nombre = document.getElementById('regCadNombre').value.trim();
            let ci = document.getElementById('regCadCi').value.trim();
            let telefono = document.getElementById('regCadTel').value.trim();
            let vehiculo = document.getElementById('regCadVehiculo').value;
            let password = document.getElementById('regCadPass').value.trim();

            if (!nombre || !ci || !password) { alert("⚠️ Completá los campos obligatorios."); return; }

            let base = JSON.parse(localStorage.getItem('lt_base_cadetes')) || [];
            if (base.some(c => String(c.ci).trim() === ci)) { alert("⚠️ Ya existe un cadete registrado con esta CI."); return; }

            let nuevoCadete = { ci, nombre, telefono, vehiculo, password, entregas: [] };
            base.push(nuevoCadete);
            localStorage.setItem('lt_base_cadetes', JSON.stringify(base));
            localStorage.setItem('lt_sesion_cadete', JSON.stringify(nuevoCadete));

            alert("✅ ¡Registro de cadete exitoso!");
            location.reload();
        }

        function mostrarRecuperarPass() {
            document.getElementById('screen-login-cadete').style.display = 'none';
            document.getElementById('screen-recuperar-cadete').style.display = 'block';
        }

        function enviarRecuperacionPass() {
            let dato = document.getElementById('recuperarDato').value.trim();
            if (!dato) { alert("⚠️ Ingresá tu cédula."); return; }
            let base = JSON.parse(localStorage.getItem('lt_base_cadetes')) || [];
            let cadete = base.find(c => c.ci === dato);
            if (cadete) {
                alert(`✅ Tu contraseña actual es: ${cadete.password}`);
            } else {
                alert("✅ Si la cédula existe en el sistema, se han enviado las instrucciones.");
            }
            irLoginCadete();
        }

        function irLoginCadete() {
            document.getElementById('screen-registro-cadete').style.display = 'none';
            document.getElementById('screen-recuperar-cadete').style.display = 'none';
            document.getElementById('screen-login-cadete').style.display = 'block';
        }

        function cerrarSesionCadete() {
            localStorage.removeItem('lt_sesion_cadete');
            location.reload();
        }

        function obtenerCadeteActualizado() {
            let sesion = JSON.parse(localStorage.getItem('lt_sesion_cadete'));
            if (!sesion) return null;
            let base = JSON.parse(localStorage.getItem('lt_base_cadetes')) || [];
            return base.find(c => String(c.ci).trim() === String(sesion.ci).trim()) || sesion;
        }

        function obtenerPedidosDisponiblesGlobales() {
            let pedidosCadete = JSON.parse(localStorage.getItem('lt_pedidos_cadete')) || [];
            let baseEmpresas = JSON.parse(localStorage.getItem('lt_base_empresas')) || [];
            
            let listaConsolidada = [...pedidosCadete];

            baseEmpresas.forEach(emp => {
                if (emp.pedidos) {
                    emp.pedidos.forEach(p => {
                        let st = (p.estado || '').toLowerCase().trim();
                        // Detecta tanto pedidos de comercios liberados como pedidos de Cadetería Express (Punto A a B)
                        let esPedidoAbierto = !p.cadeteAsignado && (
                            st.includes('listo para retirar') || 
                            st.includes('en ruta') || 
                            st.includes('buscando cadete') || 
                            st.includes('recibido') ||
                            st.includes('cadetería')
                        );

                        if (esPedidoAbierto) {
                            listaConsolidada.push({
                                id: p.id,
                                comercio: emp.nombre || 'Cadetería Express Mvd',
                                rutComercio: emp.rut || '000000',
                                direccionComercio: p.descripcion ? p.descripcion.split(']')[0].replace('Cadetería (moto) desde [', '').replace('Cadetería (camioneta) desde [', '') : (emp.direccion || 'Montevideo Central'),
                                telefonoComercio: emp.telefono || '099000000',
                                cliente: p.cliente,
                                telefonoCliente: p.telefonoCliente || 'Sin tel',
                                direccionCliente: p.direccion,
                                total: p.total,
                                codigoVerificacion: p.codigoVerificacion,
                                estado: 'Disponible para retirar'
                            });
                        }
                    });
                }
            });

            return Array.from(new Map(listaConsolidada.map(item => [String(item.id).trim(), item])).values())
                        .filter(p => {
                            let st = (p.estado || '').toLowerCase().trim();
                            return !p.cadeteAsignado && (
                                st.includes('disponible') || 
                                st.includes('listo para retirar') || 
                                st.includes('buscando cadete') ||
                                st.includes('recibido') ||
                                st.includes('cadetería')
                            );
                        });
        }

        function revisarNuevosPedidosCadete(activarAlertaSonora) {
            let disponibles = obtenerPedidosDisponiblesGlobales();
            let badge = document.getElementById('badge-cadete-disponibles');
            if (badge) badge.innerText = disponibles.length;

            if (disponibles.length > ultimoConteoPedidosCadete && activarAlertaSonora) {
                reproducirAlertaVoz("Lo tengo");
                mostrarBurbujaEmergente("📦 ¡Nuevo Pedido Disponible!", "Un nuevo envío o servicio de cadetería fue creado en Montevideo.");
            }
            ultimoConteoPedidosCadete = disponibles.length;
        }

        function mostrarDisponiblesCadete() {
            actualizarMenuActivoCadete(0);
            let disponibles = obtenerPedidosDisponiblesGlobales();
            disponibles.sort((a, b) => b.id - a.id);

            const container = document.getElementById('main-content-cadete');
            let htmlDisponibles = disponibles.map(p => `
                <div style="background: #fff; border: 1px solid var(--border); border-left: 4px solid var(--secondary); border-radius: var(--radius); padding: 15px; margin-bottom: 15px;">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <strong style="color: var(--secondary); font-size: 16px;">📦 Pedido #${p.id.toString().slice(-4)}</strong>
                        <div>
                            <span style="font-size: 12px; font-weight:bold; color:var(--success);">$${p.total}</span>
                        </div>
                    </div>
                    <p style="margin: 6px 0 2px 0; font-size: 13px;">🏪 <b>Origen:</b> ${p.comercio}</p>
                    <p style="margin: 2px 0; font-size: 13px; color:#555;">📍 <b>Retiro:</b> ${p.direccionComercio}</p>
                    <hr style="border:0; border-top:1px dashed #eee; margin:8px 0;">
                    <p style="margin: 2px 0; font-size: 13px;">👤 <b>Cliente:</b> ${p.cliente}</p>
                    <p style="margin: 2px 0 10px 0; font-size: 13px; color:#555;">📍 <b>Destino:</b> ${p.direccionCliente}</p>

                    <button type="button" onclick="tomarPedidoCadete('${p.id}')" style="background: var(--success); margin-top: 5px;">🚀 Aceptar y Tomar Pedido</button>
                </div>
            `).join('') || '<p style="text-align:center; color:#666; margin-top:30px;">No hay pedidos disponibles para retirar en este momento.</p>';

            container.innerHTML = `
                <div id="bandera-vista-disponibles"></div>
                <div class="section-title">
                    <span>📦 Pedidos Disponibles (Montevideo)</span>
                    <button type="button" onclick="mostrarDisponiblesCadete()" style="width:auto; padding:6px 10px; font-size:11px; background:var(--primary);">Actualizar 🔄</button>
                </div>
                ${htmlDisponibles}
            `;
        }

        window.tomarPedidoCadete = function(idPedido) {
            let sesion = obtenerCadeteActualizado();
            let pedidosCadete = JSON.parse(localStorage.getItem('lt_pedidos_cadete')) || [];
            let baseEmpresas = JSON.parse(localStorage.getItem('lt_base_empresas')) || [];
            
            let encontradoEnSistema = false;

            baseEmpresas.forEach(emp => {
                if (emp.pedidos) {
                    emp.pedidos.forEach(p => {
                        if (String(p.id).trim() === String(idPedido).trim()) {
                            p.estado = 'En camino a retirar';
                            p.cadeteAsignado = sesion.nombre;
                            p.ciCadete = sesion.ci;
                            encontradoEnSistema = true;

                            fetch(`${BACKEND_URL}/api/pedidos`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(p)
                            }).catch(err => console.warn("Modo offline en tomar pedido", err));
                        }
                    });
                }
            });
            if (encontradoEnSistema) {
                localStorage.setItem('lt_base_empresas', JSON.stringify(baseEmpresas));
            }

            let disponibles = obtenerPedidosDisponiblesGlobales();
            let itemACopiar = disponibles.find(p => String(p.id).trim() === String(idPedido).trim());
            if (itemACopiar) {
                itemACopiar.estado = 'En camino a retirar';
                itemACopiar.cadeteAsignado = sesion.nombre;
                itemACopiar.ciCadete = sesion.ci;
                
                let pIndex = pedidosCadete.findIndex(p => String(p.id).trim() === String(idPedido).trim());
                if (pIndex !== -1) {
                    pedidosCadete[pIndex] = itemACopiar;
                } else {
                    pedidosCadete.push(itemACopiar);
                }
            }

            localStorage.setItem('lt_pedidos_cadete', JSON.stringify(pedidosCadete));

            let pedidosCliente = JSON.parse(localStorage.getItem('lt_pedidos_cliente')) || [];
            let pCliente = pedidosCliente.find(p => String(p.id).trim() === String(idPedido).trim());
            if (pCliente) {
                pCliente.estado = 'En camino a retirar del comercio';
                localStorage.setItem('lt_pedidos_cliente', JSON.stringify(pedidosCliente));
            }

            window.dispatchEvent(new Event('storage'));

            reproducirAlertaVoz("Lo tengo");
            mostrarBurbujaEmergente("🛵 Pedido Asignado", "Dirígete al local comercial a retirar el paquete.");
            mostrarEnCursoCadete();
        };

        function mostrarEnCursoCadete() {
            actualizarMenuActivoCadete(1);
            let sesion = obtenerCadeteActualizado();
            if (!sesion) return;

            let pedidosCadete = JSON.parse(localStorage.getItem('lt_pedidos_cadete')) || [];
            let baseEmpresas = JSON.parse(localStorage.getItem('lt_base_empresas')) || [];

            // Consolidar también desde la base de empresas los pedidos asignados a este cadete por su CI o Nombre
            baseEmpresas.forEach(emp => {
                if (emp.pedidos) {
                    emp.pedidos.forEach(p => {
                        if ((String(p.ciCadete).trim() === String(sesion.ci).trim() || String(p.cadeteAsignado).trim() === String(sesion.nombre).trim()) && !String(p.estado || '').toLowerCase().includes('entregado')) {
                            if (!pedidosCadete.some(pc => String(pc.id).trim() === String(p.id).trim())) {
                                pedidosCadete.push({
                                    id: p.id,
                                    comercio: emp.nombre,
                                    direccionComercio: emp.direccion || 'Montevideo',
                                    cliente: p.cliente,
                                    telefonoCliente: p.telefonoCliente || '099000000',
                                    direccionCliente: p.direccion,
                                    total: p.total,
                                    codigoVerificacion: p.codigoVerificacion,
                                    estado: p.estado,
                                    ciCadete: sesion.ci
                                });
                            }
                        }
                    });
                }
            });

            let enCurso = pedidosCadete.filter(p => String(p.ciCadete).trim() === String(sesion.ci).trim() && !String(p.estado || '').toLowerCase().includes('entregado'));
            enCurso.sort((a, b) => b.id - a.id);

            const container = document.getElementById('main-content-cadete');
            let htmlCurso = enCurso.map(p => `
                <div style="background: #fff; border: 1px solid var(--border); border-left: 4px solid var(--primary); border-radius: var(--radius); padding: 15px; margin-bottom: 15px;">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <strong style="color: var(--primary); font-size: 16px;">🛵 Pedido #${p.id.toString().slice(-4)}</strong>
                        <span style="font-size: 11px; background:#eef2f6; padding:4px 8px; border-radius:6px; font-weight:bold;">${p.estado}</span>
                    </div>
                    
                    <p style="margin: 6px 0 2px 0; font-size: 13px;">🏪 <b>Retirar en:</b> ${p.comercio || 'Local'} (${p.direccionComercio || 'Montevideo'})</p>
                    
                    <div style="background: #eef2f6; padding: 10px; border-radius: 8px; margin: 8px 0; border: 1px dashed var(--primary);">
                        <button type="button" onclick="marcarPaqueteRetirado('${p.id}')" style="background: var(--warning); color: #000; font-size: 12px; margin:0;">📦 Recibí el paquete / Retirado del local</button>
                    </div>

                    <div style="background: #FEE2E2; padding: 10px; border-radius: 8px; margin: 8px 0; border: 1px solid #EF4444;">
                        <button type="button" onclick="reportarDesperfectoMecanico('${p.id}')" style="background: var(--danger); color: white; font-size: 12px; margin:0;">⚠️ Reportar Desperfecto Mecánico / Auxilio</button>
                    </div>

                    <a href="https://wa.me/598${p.telefonoCliente || '99000000'}?text=${encodeURIComponent('Hola ' + p.cliente + ', soy tu cadete de Lo Tengo. Voy en camino con tu pedido.')}" target="_blank" class="btn-whatsapp" style="text-decoration:none; color:white; padding:8px 10px; border-radius:8px; font-size:12px; font-weight:bold; text-align:center;">
                        💬 Abrir WhatsApp con el Cliente
                    </a>

                    <p style="margin: 8px 0 2px 0; font-size: 13px;">👤 <b>Cliente:</b> ${p.cliente}</p>
                    <p style="margin: 2px 0 10px 0; font-size: 13px;">📍 <b>Destino:</b> ${p.direccionCliente}</p>

                    <div style="margin-top:10px; margin-bottom:10px;">
                        <div style="font-size:11px; color:var(--primary); font-weight:bold; margin-bottom:4px;">🗺️ Mapa de Ruta Vial (Montevideo):</div>
                        <div style="height:120px; border-radius:8px; overflow:hidden; border:1px solid var(--border);">
                            <iframe src="https://maps.google.com/maps?q=${encodeURIComponent(p.direccionCliente + ', Montevideo')}&t=&z=14&ie=UTF8&iwloc=&output=embed" style="width:100%; height:100%; border:0;" allowfullscreen></iframe>
                        </div>
                    </div>

                    <div style="background:#f8f9fa; padding:10px; border-radius:8px; margin-top:8px;">
                        <label style="font-size:11px; font-weight:bold; color:var(--primary); display:block; margin-bottom:4px;">VERIFICAR PIN DE ENTREGA (Cliente):</label>
                        <input type="text" id="pin-ingresado-${p.id}" placeholder="PIN de 4 dígitos" style="margin-bottom:6px; text-align:center; font-size:16px; letter-spacing:2px; font-weight:bold;">
                        <button type="button" onclick="finalizarEntregaConPin('${p.id}')" style="background:var(--success);">✅ Confirmar Entrega (Llegué al cliente)</button>
                    </div>
                </div>
            `).join('') || '<p style="text-align:center; color:#666; margin-top:30px;">No tenés pedidos en curso actualmente.</p>';

            container.innerHTML = `
                <div id="bandera-vista-curso"></div>
                <div class="section-title"><span>🛵 Mis Pedidos en Curso</span></div>
                ${htmlCurso}
            `;
        }

        window.reportarDesperfectoMecanico = function(idPedido) {
            let zonaIncidente = prompt("Ingresá la esquina o zona aproximada donde tuviste el problema (ej: 18 de Julio y Ejido):", "Montevideo");
            if (zonaIncidente !== null) {
                let sesion = obtenerCadeteActualizado();
                let alertas = JSON.parse(localStorage.getItem('lt_alertas_cadetes')) || [];

                let nuevaAlerta = {
                    id: Date.now(),
                    idPedido: idPedido,
                    nombreCadete: sesion.nombre,
                    telefonoCadete: sesion.telefono || '099000000',
                    ciCadete: sesion.ci,
                    ubicacion: zonaIncidente.trim() || 'Montevideo',
                    timestamp: Date.now(),
                    resuelta: false
                };

                alertas.push(nuevaAlerta);
                localStorage.setItem('lt_alertas_cadetes', JSON.stringify(alertas));
                window.dispatchEvent(new Event('storage'));

                alert("🚨 ¡Alerta enviada con éxito a la administración!\n\nLa central recibió tu ubicación y datos para coordinar un cadete de auxilio de inmediato.");
            }
        };

        window.marcarPaqueteRetirado = function(idPedido) {
            let pedidosCadete = JSON.parse(localStorage.getItem('lt_pedidos_cadete')) || [];
            let pedido = pedidosCadete.find(p => String(p.id).trim() === String(idPedido).trim());
            if (!pedido) { alert("⚠️ Pedido no encontrado."); return; }

            pedido.estado = 'En camino hacia el cliente';
            localStorage.setItem('lt_pedidos_cadete', JSON.stringify(pedidosCadete));

            let baseEmpresas = JSON.parse(localStorage.getItem('lt_base_empresas')) || [];
            baseEmpresas.forEach(emp => {
                if (emp.pedidos) {
                    emp.pedidos.forEach(p => {
                        if (String(p.id).trim() === String(idPedido).trim()) {
                            p.estado = 'En camino hacia el cliente';
                            fetch(`${BACKEND_URL}/api/pedidos`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(p)
                            }).catch(err => console.warn("Modo offline", err));
                        }
                    });
                }
            });
            localStorage.setItem('lt_base_empresas', JSON.stringify(baseEmpresas));

            let pedidosCliente = JSON.parse(localStorage.getItem('lt_pedidos_cliente')) || [];
            pedidosCliente.forEach(p => {
                if (String(p.id).trim() === String(idPedido).trim()) {
                    p.estado = 'En camino hacia tu domicilio 🛵';
                }
            });
            localStorage.setItem('lt_pedidos_cliente', JSON.stringify(pedidosCliente));

            window.dispatchEvent(new Event('storage'));

            alert("✅ ¡Paquete marcado como retirado! Estado actualizado a: En camino hacia el cliente.");
            mostrarEnCursoCadete();
        };

        window.finalizarEntregaConPin = function(idPedido) {
            let inputPin = document.getElementById(`pin-ingresado-${idPedido}`);
            let pinIngresado = inputPin ? inputPin.value.trim() : '';

            let pedidosCadete = JSON.parse(localStorage.getItem('lt_pedidos_cadete')) || [];
            let pedido = pedidosCadete.find(p => String(p.id).trim() === String(idPedido).trim());

            if (!pedido) { alert("⚠️ Pedido no encontrado."); return; }

            if (pinIngresado !== String(pedido.codigoVerificacion).trim()) {
                alert("❌ PIN incorrecto. Solicitale el código de 4 dígitos al cliente.");
                return;
            }

            pedido.estado = 'Entregado y Cerrado';
            localStorage.setItem('lt_pedidos_cadete', JSON.stringify(pedidosCadete));

            let baseEmpresas = JSON.parse(localStorage.getItem('lt_base_empresas')) || [];
            baseEmpresas.forEach(emp => {
                if (emp.pedidos) {
                    emp.pedidos.forEach(p => {
                        if (String(p.id).trim() === String(idPedido).trim()) {
                            p.estado = 'Entregado y Cerrado';
                            fetch(`${BACKEND_URL}/api/pedidos`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(p)
                            }).catch(err => console.warn("Modo offline", err));
                        }
                    });
                }
            });
            localStorage.setItem('lt_base_empresas', JSON.stringify(baseEmpresas));

            let pedidosCliente = JSON.parse(localStorage.getItem('lt_pedidos_cliente')) || [];
            pedidosCliente.forEach(p => {
                if (String(p.id).trim() === String(idPedido).trim()) {
                    p.estado = 'Entregado y Cerrado ✓';
                }
            });
            localStorage.setItem('lt_pedidos_cliente', JSON.stringify(pedidosCliente));

            let sesion = obtenerCadeteActualizado();
            let baseCadetes = JSON.parse(localStorage.getItem('lt_base_cadetes')) || [];
            let cadIndex = baseCadetes.findIndex(c => String(c.ci).trim() === String(sesion.ci).trim());
            if (cadIndex !== -1) {
                if (!baseCadetes[cadIndex].entregas) baseCadetes[cadIndex].entregas = [];
                if (!baseCadetes[cadIndex].entregas.some(e => String(e.id).trim() === String(idPedido).trim())) {
                    baseCadetes[cadIndex].entregas.push(pedido);
                }
                localStorage.setItem('lt_base_cadetes', JSON.stringify(baseCadetes));
                localStorage.setItem('lt_sesion_cadete', JSON.stringify(baseCadetes[cadIndex]));
            }

            window.dispatchEvent(new Event('storage'));

            reproducirAlertaVoz("Lo tengo");
            mostrarBurbujaEmergente("🎉 ¡Entrega Exitosa!", "El pedido fue cerrado y registrado correctamente en tu historial.");
            mostrarEnCursoCadete();
        };

        function mostrarHistorialCadete() {
            actualizarMenuActivoCadete(2);
            let sesion = obtenerCadeteActualizado();
            if (!sesion) return;

            let entregas = sesion.entregas || [];
            entregas.sort((a, b) => b.id - a.id);
            let totalGanado = entregas.reduce((acc, curr) => acc + (Number(curr.total) * 0.30 || 150), 0);

            const container = document.getElementById('main-content-cadete');
            let htmlHistorial = entregas.map(e => `
                <div style="background:#fff; border:1px solid var(--border); border-radius:var(--radius); padding:12px; margin-bottom:10px; font-size:13px;">
                    <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
                        <b>Pedido #${e.id.toString().slice(-4)} (${e.comercio || 'Local'})</b>
                        <span style="color:var(--success); font-weight:bold;">Completado ✓</span>
                    </div>
                    <p style="margin:2px 0; color:#555;">Cliente: ${e.cliente} - Destino: ${e.direccionCliente}</p>
                    <div style="display:flex; justify-content:space-between; border-top:1px dashed #eee; margin-top:6px; padding-top:6px;">
                        <span>Ganancia por Envío (30%):</span>
                        <b style="color:var(--primary);">+$${(Number(e.total) * 0.30 || 150).toFixed(2)}</b>
                    </div>
                </div>
            `).join('') || '<p style="text-align:center; color:#666; margin-top:30px;">Aún no tenés entregas finalizadas en tu historial.</p>';

            container.innerHTML = `
                <div class="section-title"><span>💰 Historial de Ganancias</span></div>
                <div style="background:linear-gradient(135deg, var(--secondary), #c04800); color:white; padding:15px; border-radius:var(--radius); margin-bottom:15px;">
                    <h4 style="margin:0 0 4px 0; font-size:14px;">Total Envíos Realizados: ${entregas.length}</h4>
                    <h2 style="margin:0; font-size:22px;">Ganancia Total: $${totalGanado.toFixed(2)}</h2>
                </div>
                ${htmlHistorial}
            `;
        }

        function actualizarMenuActivoCadete(index) {
            const botones = document.querySelectorAll('.bottom-nav .nav-item');
            botones.forEach((btn, idx) => {
                if (idx === index) btn.classList.add('active');
                else btn.classList.remove('active');
            });
        }
    </script>
</body>
</html>
